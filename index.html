  /* ---------------- this week (fixed Mon–Sun planning view) ---------------- */
  function formatWeekRangeLabel(start, end){
    var sameMonth = start.getMonth() === end.getMonth();
    var startLabel = start.toLocaleDateString(undefined, {month:"short", day:"numeric"});
    var endLabel = end.toLocaleDateString(undefined, sameMonth ? {day:"numeric"} : {month:"short", day:"numeric"});
    return startLabel + " – " + endLabel;
  }
  function renderWeekView(){
    var root = document.getElementById("week-view");
    if(!state){ root.innerHTML = ""; return; }
    root.innerHTML = "";
    var monday = mondayOfWeek(new Date());
    var days = [];
    for(var i=0;i<7;i++){ days.push(addDaysCal(monday, i)); }
    var todayStr = todayDateStr();

    var buckets = {};
    days.forEach(function(d){ buckets[dateKey(d)] = []; });
    forEachTask(function(t, h, sub){
      if(t.done || t.archivedAt || t.deletedAt || !t.due) return;
      if(buckets[t.due.date] === undefined) return;
      buckets[t.due.date].push({ task:t, container: sub||h, heading:h, sub:sub });
    });
    days.forEach(function(d){
      buckets[dateKey(d)].sort(function(a, b){
        var ta = (!a.task.due.allDay && a.task.due.time) ? a.task.due.time : "99:99";
        var tb = (!b.task.due.allDay && b.task.due.time) ? b.task.due.time : "99:99";
        return ta < tb ? -1 : ta > tb ? 1 : 0;
      });
    });
    var anyItems = days.some(function(d){ return buckets[dateKey(d)].length; });

    var rangeLabel = formatWeekRangeLabel(days[0], days[6]);
    var head = document.createElement("div");
    head.className = "week-view-head";
    head.innerHTML = '<h2 class="week-view-title">This week</h2><span class="week-view-range mono">' + escapeHtml(rangeLabel) + '</span>';
    root.appendChild(head);

    if(!anyItems){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<h2>Nothing due this week</h2><p>Tasks with a due date between ' + escapeHtml(rangeLabel) + ' will show up here, grouped by day.</p>';
      root.appendChild(empty);
      return;
    }

    days.forEach(function(d){
      var ds = dateKey(d);
      var items = buckets[ds];
      var isToday = ds === todayStr;
      var section = document.createElement("section");
      section.className = "today-section week-day-section" + (isToday ? " week-day-today" : "");
      var dayLabel = d.toLocaleDateString(undefined, {weekday:"long", month:"short", day:"numeric"});
      var head2 = document.createElement("div");
      head2.className = "today-section-head";
      head2.innerHTML = '<h2 class="today-section-title">' + escapeHtml(dayLabel) + (isToday ? ' <span class="week-day-today-tag">Today</span>' : '') + '</h2><span class="today-section-count mono">' + items.length + '</span>';
      section.appendChild(head2);
      if(!items.length){
        var noteEl = document.createElement("div");
        noteEl.className = "week-day-empty";
        noteEl.textContent = "Nothing due";
        section.appendChild(noteEl);
      } else {
        var list = document.createElement("div");
        list.className = "task-list today-task-list";
        items.forEach(function(item){
          var wrap = document.createElement("div");
          wrap.className = "today-task-wrap";
          var pathLabel = escapeHtml(item.heading.title) + (item.sub ? ' <span class="today-task-path-sep">&rsaquo;</span> ' + escapeHtml(item.sub.title) : "");
          wrap.innerHTML = '<div class="today-task-path">' + pathLabel + '</div>';
          wrap.appendChild(renderTaskRow(item.container, item.task));
          list.appendChild(wrap);
        });
        section.appendChild(list);
      }
      root.appendChild(section);
    });
  }

  /* ---------------- status board (not started / in progress / done) ----------------
     A task shows as a full card in the column matching its OWN status. A subtask shows
     nested under a reference to its parent task, in the column matching the SUBTASK's own
     status — which can be a different column than the parent's, so the same task can appear
     more than once across the board: once as its own full card, and again (title-only, for
     context) wherever one of its subtasks landed. Archived tasks are left out entirely,
     same as they're hidden everywhere else once checked off and tucked away. */
  var STATUS_COLUMNS = [
    { key: "not_started", label: "Not started" },
    { key: "in_progress", label: "In progress" },
    { key: "done", label: "Done" }
  ];
  // Renders the kanban board into `root`. When `headingFilterId` is set (List view's Status
  // layout, with a specific heading tab selected rather than "All"), only that heading's tasks
  // are grouped — otherwise every heading in the list contributes, same as before this became
  // an embedded List-view layout instead of its own top-level tab.
  function renderStatusBoard(root, headingFilterId){
    if(!state){ root.innerHTML = ""; return; }
    root.innerHTML = "";

    var groups = { not_started: [], in_progress: [], done: [] };
    forEachTask(function(t, h, sub){
      if(t.archivedAt || t.deletedAt) return;
      if(headingFilterId && h.id !== headingFilterId) return;
      var container = sub || h;
      var subtasksByStatus = { not_started: [], in_progress: [], done: [] };
      (t.subtasks || []).forEach(function(st){
        var s = subtasksByStatus[st.status] ? st.status : (st.done ? "done" : "not_started");
        subtasksByStatus[s].push(st);
      });
      STATUS_COLUMNS.forEach(function(col){
        var isPrimary = (t.status || (t.done ? "done" : "not_started")) === col.key;
        var matching = subtasksByStatus[col.key];
        if(isPrimary || matching.length){
          groups[col.key].push({ task:t, heading:h, sub:sub, container:container, matchingSubtasks: matching, isPrimary: isPrimary });
        }
      });
    });

    var anyItems = STATUS_COLUMNS.some(function(col){ return groups[col.key].length; });
    if(!anyItems){
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = headingFilterId
        ? '<h2>Nothing here yet</h2><p>This heading has no tasks to show on the board.</p>'
        : '<h2>Nothing to show yet</h2><p>Add a task and its status will show up here.</p>';
      root.appendChild(empty);
      return;
    }

    var board = document.createElement("div");
    board.className = "board";
    STATUS_COLUMNS.forEach(function(col){
      board.appendChild(renderStatusColumn(col, groups[col.key]));
    });
    root.appendChild(board);
  }
  function renderStatusColumn(col, items){
    var colEl = document.createElement("div");
    colEl.className = "board-col";
    var count = items.reduce(function(n, g){ return n + (g.isPrimary ? 1 : 0) + g.matchingSubtasks.length; }, 0);
    var colHead = document.createElement("div");
    colHead.className = "board-col-head";
    colHead.innerHTML =
      '<span class="board-col-dot ' + col.key.replace(/_/g,"-") + '"></span>' +
      '<span class="board-col-title">' + escapeHtml(col.label) + '</span>' +
      '<span class="board-col-count mono">' + count + '</span>';
    colEl.appendChild(colHead);
    var body = document.createElement("div");
    body.className = "board-col-body";
    if(!items.length){
      body.innerHTML = '<div class="board-col-empty">Nothing here</div>';
    } else {
      items.forEach(function(group){ body.appendChild(renderStatusCard(group, col.key)); });
    }
    colEl.appendChild(body);
    return colEl;
  }
  function renderStatusCard(group, colKey){
    var task = group.task, heading = group.heading, sub = group.sub;
    var card = document.createElement("div");
    card.className = "board-card" + (task.status === "in_progress" ? " in-progress" : "") + (task.done ? " done" : "") + (group.isPrimary ? "" : " context-only");
    var pathLabel = '<span class="dot" style="background:' + (heading.color || "var(--muted)") + '"></span>' +
      escapeHtml(heading.title) + (sub ? ' <span class="today-task-path-sep">&rsaquo;</span> ' + escapeHtml(sub.title) : "");
    card.innerHTML = '<div class="board-card-path">' + pathLabel + '</div>';

    var row = document.createElement("div");
    row.className = "board-card-row";
    var statusBtn = document.createElement("button");
    statusBtn.type = "button";
    statusBtn.className = "check status-" + (task.status || (task.done ? "done" : "not_started"));
    statusBtn.setAttribute("aria-label", "Status: " + taskStatusLabel(task.status));
    statusBtn.title = taskStatusLabel(task.status) + " — click to change";
    statusBtn.addEventListener("click", function(){
      task.status = nextTaskStatus(task.status);
      task.done = task.status === "done";
      task.completedAt = task.done ? new Date().toISOString() : null;
      scheduleSave();
      if(task.calendarEventId) syncTaskToCalendar(task); else render();
    });
    row.appendChild(statusBtn);
    var titleEl = document.createElement("div");
    titleEl.className = "board-card-title";
    titleEl.textContent = task.text;
    row.appendChild(titleEl);
    card.appendChild(row);

    if(group.isPrimary && (task.due || task.priority)){
      var meta = document.createElement("div");
      meta.className = "board-card-meta";
      if(task.due){
        var overdue = isOverdue(task.due, task.done);
        meta.innerHTML += '<span class="pill' + (overdue ? " overdue" : "") + '">' + escapeHtml(formatDue(task.due)) + '</span>';
      }
      if(task.priority){
        meta.innerHTML += '<span class="pill ' + task.priority + '">' + escapeHtml(priorityLabel(task)) + '</span>';
      }
      card.appendChild(meta);
    }

    group.matchingSubtasks.forEach(function(st){
      var stRow = document.createElement("div");
      stRow.className = "board-subtask" + (st.status === "in_progress" ? " in-progress" : "") + (st.done ? " done" : "");
      var stBtn = document.createElement("button");
      stBtn.type = "button";
      stBtn.className = "check status-" + (st.status || (st.done ? "done" : "not_started"));
      stBtn.setAttribute("aria-label", "Status: " + taskStatusLabel(st.status));
      stBtn.title = taskStatusLabel(st.status) + " — click to change";
      stBtn.addEventListener("click", function(){
        st.status = nextTaskStatus(st.status);
        st.done = st.status === "done";
        st.completedAt = st.done ? new Date().toISOString() : null;
        scheduleSave();
        render();
      });
      stRow.appendChild(stBtn);
      var stTitle = document.createElement("div");
      stTitle.className = "board-subtask-title";
      stTitle.textContent = st.text;
      stRow.appendChild(stTitle);
      card.appendChild(stRow);
    });

    return card;
  }

  /* ---------------- due-time reminders (in-app only, session-only state) ----------------
     No push server exists for this static site, so reminders only fire while the app is
     open (a tab, or the installed PWA while running) — see banner text for the honest
     framing of that limitation. Dismissed/snoozed state is session-only by design, same
     as the search/filter state: it resets on reload rather than being saved to the repo. */
  var REMINDER_WINDOW_MS = 30 * 60 * 1000; // remind for due times up to 30 min in the past
  var reminderDismissed = {}; // key -> true
  var reminderSnoozeUntil = {}; // key -> ms timestamp
  function reminderKey(task, subtask){ return subtask ? task.id + ":" + subtask.id : task.id; }
  function dueDateTimeMs(due){
    if(!due || due.allDay || !due.time) return null;
    var d = new Date(due.date + "T" + due.time + ":00");
    return isNaN(d.getTime()) ? null : d.getTime();
  }
  function checkReminders(){
    var root = document.getElementById("reminder-toasts");
    if(!root) return;
    if(!state){ root.innerHTML = ""; return; }
    var now = Date.now();
    var candidates = [];
    function consider(task, subtask, heading, sub){
      var due = subtask ? subtask.due : task.due;
      var ms = dueDateTimeMs(due);
      if(ms === null || ms > now || ms < now - REMINDER_WINDOW_MS) return;
      var key = reminderKey(task, subtask);
      if(reminderDismissed[key]) return;
      if(reminderSnoozeUntil[key] && reminderSnoozeUntil[key] > now) return;
      candidates.push({ key:key, task:task, subtask:subtask, heading:heading, sub:sub, due:due });
    }
    forEachTask(function(t, h, sub){
      if(t.done || t.archivedAt || t.deletedAt) return;
      consider(t, null, h, sub);
      (t.subtasks || []).forEach(function(st){ if(!st.done) consider(t, st, h, sub); });
    });
    candidates.sort(function(a, b){ return dueDateTimeMs(a.due) - dueDateTimeMs(b.due); });
    renderReminderToasts(candidates.slice(0, 5));
  }
  function renderReminderToasts(list){
    var root = document.getElementById("reminder-toasts");
    root.innerHTML = "";
    list.forEach(function(item){
      var el = document.createElement("div");
      el.className = "reminder-toast";
      el.setAttribute("data-reminder-key", item.key);
      var whoText = item.subtask ? item.subtask.text : item.task.text;
      var pathLabel = escapeHtml(item.heading.title) + (item.sub ? ' <span class="today-task-path-sep">&rsaquo;</span> ' + escapeHtml(item.sub.title) : "") +
        (item.subtask ? ' <span class="today-task-path-sep">&rsaquo;</span> ' + escapeHtml(item.task.text) : "");
      el.innerHTML =
        '<div class="reminder-toast-title">' + escapeHtml(whoText) + '</div>' +
        '<div class="reminder-toast-path">' + pathLabel + '</div>' +
        '<div class="reminder-toast-time">Due ' + escapeHtml(formatTimeOfDay(item.due.time)) + ' · reminder only shows while Daybook is open</div>' +
        '<div class="reminder-toast-actions">' +
          '<button type="button" class="btn btn-sm btn-ghost" data-snooze="5">+5m</button>' +

  // Not started → In progress → Done → Not started. Shared by both tasks and subtasks.
  var STATUS_LABELS = { not_started: "Not started", in_progress: "In progress", done: "Done" };
  var STATUS_CYCLE = { not_started: "in_progress", in_progress: "done", done: "not_started" };
  function nextTaskStatus(status){ return STATUS_CYCLE[status] || "in_progress"; }
  function taskStatusLabel(status){ return STATUS_LABELS[status] || "Not started"; }
  // Task/subtask titles are <textarea>s (so they can hold multiple lines — Shift+Enter adds a
  // line, plain Enter finishes editing) instead of <input>s, which never grow with their content
  // on their own. Recompute height from scrollHeight on every keystroke, and once right after
  // creation for content that already has newlines in it (e.g. freshly loaded from storage).
  function autoGrowTextarea(el){

    var overdue = isOverdue(due, task.done);

    var hasSubtasks = !!(task.subtasks && task.subtasks.length);
    row.innerHTML =
      gripHtml() +
      '<button type="button" class="check status-' + (task.status || "not_started") + '" aria-label="Status: ' + taskStatusLabel(task.status) + '" title="' + taskStatusLabel(task.status) + ' — click to change"></button>' +
      (hasSubtasks ? '<button class="task-subtask-toggle" type="button" title="Show/hide subtasks" aria-label="Show/hide subtasks">' + SUBTASK_CHEVRON + '</button>' : '') +
      '<div class="task-main">' +
        '<textarea class="task-text" rows="1" title="' + escapeHtml(task.text) + '" aria-label="Task">' + escapeHtml(task.text) + '</textarea>' +

          '<button class="due-badge' + (due ? (overdue ? ' overdue' : ' set') : '') + '" type="button">' + syncBadge + '<span>' + escapeHtml(dueLabel) + '</span></button>' +
          '<button class="notes-badge' + (notesBadgeSet(task) ? ' set' : '') + '" type="button" title="Notes & checklist">' + notesBadgeHtml(task) + '</button>' +
          '<button class="tags-badge' + (tagsBadgeSet(task) ? ' set' : '') + '" type="button" title="Tags">' + tagsBadgeHtml(task) + '</button>' +
          '<button class="subtasks-badge' + (subtasksBadgeSet(task) ? ' set' : '') + '" type="button" title="Subtasks">' + subtasksBadgeHtml(task) + '</button>' +
          '<button class="attachments-badge' + (attachmentsBadgeSet(task) ? ' set' : '') + '" type="button" title="Attachments">' + attachmentsBadgeHtml(task) + '</button>' +
          (task.syncError ? '<span class="sync-note" title="' + escapeHtml(task.syncError) + '">' + escapeHtml(task.syncError) + '</span>' : '') +

      '<div class="task-actions">' +
        (task.done ? '<button class="icon-btn" title="Archive task" aria-label="Archive task" data-act="archive"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8M10 13h4"/></svg></button>' : '') +
        '<button class="icon-btn danger" title="Delete task" aria-label="Delete task"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>' +
      '</div>';

    if(taskSortMode !== "manual"){

      task.status = nextTaskStatus(task.status);
      task.done = task.status === "done";

      scheduleSave();
      if(task.calendarEventId) syncTaskToCalendar(task); else render();

    // Captured once, before any live-commit below can change task.text out from under it —
    // the date-parsing-on-first-edit behavior needs to know whether this row STARTED this
    // render as the untouched "New task" placeholder, not whatever task.text has become
    // keystroke-by-keystroke since.
    var wasFreshNewTask = (task.text === "New task" && !task.due);
    // Commit on every keystroke (not just blur/change) so an in-progress edit is never lost
    // to a re-render triggered by something else while this field hasn't been blurred yet —
    // see isActivelyEditing() for the case this closes.
    textInput.addEventListener("input", function(){ task.text = textInput.value; scheduleSave(); autoGrowTextarea(textInput); });
    textInput.addEventListener("change", function(){
      var newText = textInput.value.trim() || "Untitled task";
      // Only parse a date out of the very first edit of a freshly created inline task
      // (still showing the "New task" placeholder, no due date yet) — not later
      // renames of existing tasks, so editing a title elsewhere never surprises you
      // with a due date appearing because it happened to mention a day.
      if(wasFreshNewTask){
        var parsed = parseQuickCaptureLine(newText, new Date());
        if(parsed.due){
          task.text = parsed.text || "Untitled task";
          task.due = parsed.due;
          scheduleSave();
          render();
          syncTaskToCalendar(task);
          return;
        }
      }
      task.text = newText;
      scheduleSave();
      if(task.calendarEventId) syncTaskToCalendar(task);
    });
    // Plain Enter finishes editing (blurs), same as the old single-line input. Shift+Enter
    // inserts a line break instead — a <textarea>'s default for plain Enter is to insert a
    // newline, so that has to be suppressed explicitly rather than just left alone.
    textInput.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); textInput.blur(); }
    });
    requestAnimationFrame(function(){ autoGrowTextarea(textInput); });
    row.querySelector(".priority-flag").addEventListener("click", function(){ cyclePriority(row, task); });
    row.querySelector(".due-badge").addEventListener("click", function(){ toggleDueEditor(row, task); });
    row.querySelector(".notes-badge").addEventListener("click", function(){ toggleNotesEditor(row, task); });
    row.querySelector(".tags-badge").addEventListener("click", function(){ toggleTagsEditor(row, task); });
    row.querySelector(".subtasks-badge").addEventListener("click", function(){ toggleSubtasksEditor(row, task); });
    row.querySelector(".attachments-badge").addEventListener("click", function(){ toggleAttachmentsEditor(row, task); });
    var subtaskToggleBtn = row.querySelector(".task-subtask-toggle");
    if(subtaskToggleBtn) subtaskToggleBtn.addEventListener("click", function(){ toggleSubtasksEditor(row, task); });
    row.querySelector(".icon-btn.danger").addEventListener("click", function(){ trashTask(container, task); });
    var archiveBtn = row.querySelector('[data-act="archive"]');
    if(archiveBtn) archiveBtn.addEventListener("click", function(){
      task.archivedAt = new Date().toISOString();
      scheduleSave();
      render();
    });

    // Notes/checklist show up on their own whenever there's content — no need to click the
    // Notes badge just to see what's already there. buildTaskNotesEditor itself honors
    // task.notesCollapsed, so a manually-folded note stays folded across re-renders.
    if(notesBadgeSet(task)){
      row.querySelector(".task-main").appendChild(buildTaskNotesEditor(row, task));
    }

    if(task.id === lastAddedId){
      row.classList.add("enter");
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ row.classList.remove("enter"); }); });
      lastAddedId = null;
    }
    return row;
  }

  // Adds n days to a "YYYY-MM-DD" string, returning a new "YYYY-MM-DD" string.
  function addDaysToDateStr(dateStr, n){
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }
  function snoozeTask(task, days){
    if(!task.due) return;

    task.syncError = null;
    scheduleSave();
    render();
    syncTaskToCalendar(task);
  }
  function toggleDueEditor(row, task){

      '<input type="date" value="' + (d.date || "") + '" />' +
      '<input type="time" class="due-time-start" value="' + (d.time || "") + '" ' + (d.allDay ? "disabled" : "") + ' />' +

      '<button class="btn btn-sm btn-primary" data-act="save">Save</button>' +
      (task.due ? '<button class="btn btn-sm btn-ghost" data-act="clear">Clear</button>' : '') +
      '<button class="btn btn-sm btn-ghost" data-act="close">Close</button>' +
      (task.due ? '<div class="snooze-row"><span class="snooze-label">Snooze</span><button type="button" class="btn btn-sm btn-ghost" data-act="snooze-1d">+1 day</button><button type="button" class="btn btn-sm btn-ghost" data-act="snooze-1w">+1 week</button></div>' : '');
    row.querySelector(".task-main").appendChild(editor);
    var dateEl = editor.querySelector('input[type="date"]');
    var timeEl = editor.querySelector('.due-time-start');
    var endTimeEl = editor.querySelector('.due-time-end');
    var allDayEl = editor.querySelector('input[type="checkbox"]');
    dateEl.focus();
    allDayEl.addEventListener("change", function(){ timeEl.disabled = allDayEl.checked; endTimeEl.disabled = allDayEl.checked; });

    if(clearBtn) clearBtn.addEventListener("click", function(){
      task.due = null;
      scheduleSave();
      render();
      syncTaskToCalendar(task);

  /* ---------------- notes & checklist ---------------- */
  var NOTES_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>';
  // A heading/sub-heading's "Notes" button always just adds a new note (see below) rather
  // than toggling a single field open/closed — reusing the app's own "+" plus glyph (same one
  // as "+ Add task" / "+ Add sub-heading") makes that obvious at a glance, more so than the
  // checkbox-style NOTES_ICON above ever did for an action button.
  var NOTE_ADD_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>';
  // Notes are stored as a small, restricted HTML subset (bold/italic/underline/links/line
  // breaks only) so the rich-text toolbar's formatting survives a save/reload round trip.
  var NOTES_ALLOWED_TAGS = { B:1, STRONG:1, I:1, EM:1, U:1, A:1, BR:1, DIV:1, SPAN:1, UL:1, OL:1, LI:1 };
  function sanitizeNotesHtml(html){
    var tmp = document.createElement("div");
    tmp.innerHTML = html || "";
    (function walk(node){
      Array.prototype.slice.call(node.childNodes).forEach(function(child){
        if(child.nodeType === 1){
          var tag = child.tagName;
          if(!NOTES_ALLOWED_TAGS[tag]){
            while(child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            return;
          }
          Array.prototype.slice.call(child.attributes).forEach(function(attr){
            if(!(tag === "A" && attr.name === "href")) child.removeAttribute(attr.name);
          });
          if(tag === "A"){
            var href = child.getAttribute("href") || "";
            if(href && !/^https?:\/\//i.test(href) && !/^mailto:/i.test(href)) href = "https://" + href.replace(/^\/+/, "");
            if(!href){ // an empty/invalid href isn't a usable link — drop the wrapper, keep the text
              while(child.firstChild) node.insertBefore(child.firstChild, child);
              node.removeChild(child);
              return;
            }
            child.setAttribute("href", href);
            child.setAttribute("target", "_blank");
            child.setAttribute("rel", "noopener noreferrer");
          }
          walk(child);
        } else if(child.nodeType !== 3){
          node.removeChild(child);
        }
      });
    })(tmp);
    return tmp.innerHTML;
  }
  function stripHtmlToText(html){

    var done = total ? task.checklist.filter(function(c){ return c.done; }).length : 0;
    var parts = [];
    if(hasNotes) parts.push("Notes");
    if(total) parts.push(done + "/" + total);
    return NOTES_ICON + (parts.length ? "<span>" + escapeHtml(parts.join(" · ")) + "</span>" : "");
  }

  var BULLET_LIST_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="4" cy="6" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1.4" fill="currentColor" stroke="none"/><path d="M9 6h11M9 12h11M9 18h11"/></svg>';
  var NUMBERED_LIST_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6h11M9 12h11M9 18h11"/><text x="0.5" y="8.2" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">1</text><text x="0.5" y="14.2" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">2</text><text x="0.5" y="20.2" font-size="7" fill="currentColor" stroke="none" font-family="sans-serif">3</text></svg>';
  var NOTES_TOOLBAR_HTML =
    '<div class="notes-toolbar">' +
      '<button type="button" class="notes-fmt-btn" data-cmd="bold" title="Bold" aria-label="Bold"><b>B</b></button>' +
      '<button type="button" class="notes-fmt-btn" data-cmd="italic" title="Italic" aria-label="Italic"><i>I</i></button>' +
      '<button type="button" class="notes-fmt-btn" data-cmd="underline" title="Underline" aria-label="Underline"><u>U</u></button>' +
      '<button type="button" class="notes-fmt-btn" data-cmd="insertUnorderedList" title="Bulleted list" aria-label="Bulleted list">' + BULLET_LIST_ICON + '</button>' +
      '<button type="button" class="notes-fmt-btn" data-cmd="insertOrderedList" title="Numbered list" aria-label="Numbered list">' + NUMBERED_LIST_ICON + '</button>' +
      '<button type="button" class="notes-fmt-btn" data-act="link" title="Add link" aria-label="Add link">🔗</button>' +
    '</div>';
  // Wires the rich-text toolbar (bold/italic/underline/lists/link) + save-on-blur for a
  // ".notes-rich" contenteditable inside `editor`. Shared by task notes (which also has a
  // checklist, wired separately by the caller) and heading/sub-heading notes (rich text
  // only) so the trickier link-popover/selection-preservation logic isn't duplicated.
  // onSave(html) is called with the sanitized HTML whenever the field is blurred with a
  // real change, or a link is applied. Returns { rich, saveNotes } for the caller's own use
  // (e.g. flushing a pending edit on close).
  function wireNotesRichEditor(editor, initialHtml, onSave){
    var rich = editor.querySelector(".notes-rich");
    rich.innerHTML = initialHtml || "";
    function saveNotes(){ onSave(sanitizeNotesHtml(rich.innerHTML)); }
    rich.addEventListener("blur", saveNotes);
    // Also commit on every keystroke, not just blur — heading/sub-heading notes are part of
    // the normal render tree (rebuilt on every render()), so without this an unrelated
    // render() elsewhere while this note is mid-edit (and never blurred) would rebuild this
    // card from the last-saved HTML and silently drop whatever hadn't been blurred in yet.
    rich.addEventListener("input", saveNotes);
    // Deliberately no auto-focus here: a heading/sub-heading's notes are now part of the
    // normal render tree (rebuilt on every render(), not just when freshly opened), so
    // focusing unconditionally would steal focus from whatever else the user is doing every
    // time anything else on the page changes. Callers that genuinely just created/opened an
    // editor in response to a click (see toggleNotesEditor and addHeadingNote) focus it
    // themselves right after calling this.

    // Toolbar: mousedown (not click) with preventDefault keeps the text selection alive
    // in the contenteditable — a click alone would blur it away first.
    var toolbar = editor.querySelector(".notes-toolbar");
    function refreshToolbarState(){
      toolbar.querySelectorAll(".notes-fmt-btn[data-cmd]").forEach(function(btn){
        var cmd = btn.getAttribute("data-cmd");
        var active = false;
        try { active = document.queryCommandState(cmd); } catch(e){}
        btn.classList.toggle("active", active);
      });
    }
    toolbar.querySelectorAll(".notes-fmt-btn[data-cmd]").forEach(function(btn){
      btn.addEventListener("mousedown", function(e){ e.preventDefault(); });
      btn.addEventListener("click", function(){
        document.execCommand(btn.getAttribute("data-cmd"), false, null);
        refreshToolbarState();
      });
    });
    rich.addEventListener("keyup", refreshToolbarState);
    rich.addEventListener("mouseup", refreshToolbarState);

    // Link button: capture the selection before the URL popover's input steals focus,
    // then restore it to apply the link to whatever was actually selected.
    var savedRange = null;
    var linkBtn = editor.querySelector('[data-act="link"]');
    linkBtn.addEventListener("mousedown", function(e){
      e.preventDefault();
      var sel = window.getSelection();
      if(sel.rangeCount > 0 && rich.contains(sel.getRangeAt(0).commonAncestorContainer)) savedRange = sel.getRangeAt(0).cloneRange();
      else savedRange = null;
    });
    linkBtn.addEventListener("click", function(){
      var existingPop = editor.querySelector(".notes-link-popover");
      if(existingPop){ existingPop.remove(); return; }
      var pop = document.createElement("div");
      pop.className = "notes-link-popover";
      pop.innerHTML =
        '<input type="text" class="notes-link-input" placeholder="https://…" aria-label="Link URL" />' +
        '<button type="button" class="btn btn-sm btn-primary" data-act="apply-link">Add</button>' +
        '<button type="button" class="btn btn-sm btn-ghost" data-act="cancel-link">Cancel</button>';
      toolbar.appendChild(pop);
      var urlInput = pop.querySelector(".notes-link-input");
      urlInput.focus();
      function applyLink(){
        var url = urlInput.value.trim();
        pop.remove();
        if(!url) return;
        if(!/^https?:\/\//i.test(url) && !/^mailto:/i.test(url)) url = "https://" + url.replace(/^\/+/, "");
        rich.focus();
        var sel = window.getSelection();
        sel.removeAllRanges();
        if(savedRange) sel.addRange(savedRange);
        if(sel.rangeCount && !sel.getRangeAt(0).collapsed){
          document.execCommand("createLink", false, url);
        } else {
          document.execCommand("insertHTML", false, '<a href="' + escapeHtml(url) + '">' + escapeHtml(url) + '</a>');
        }
        saveNotes();
      }
      pop.querySelector('[data-act="apply-link"]').addEventListener("click", applyLink);
      pop.querySelector('[data-act="cancel-link"]').addEventListener("click", function(){ pop.remove(); rich.focus(); });
      urlInput.addEventListener("keydown", function(e){
        if(e.key === "Enter"){ e.preventDefault(); applyLink(); }
        else if(e.key === "Escape"){ pop.remove(); rich.focus(); }
      });
    });

    return { rich: rich, saveNotes: saveNotes };
  }
  var NOTES_COLLAPSE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>';
  // Builds a task's notes+checklist block. Unlike the old on-demand-only editor, this is now
  // part of the normal render tree — renderTaskRow appends one automatically whenever the
  // task already has notes/checklist content, same spirit as heading/sub-heading notes always
  // being visible — but a task can still fold it away (and back) with the chevron in its head,
  // via task.notesCollapsed, without losing anything: collapsing just stops rendering the
  // editable body, it never clears task.notes or task.checklist.
  function buildTaskNotesEditor(row, task){
    var editor = document.createElement("div");
    editor.className = "notes-editor" + (task.notesCollapsed ? " collapsed" : "");
    var collapseLabel = task.notesCollapsed ? "Expand notes" : "Collapse notes";
    editor.innerHTML =
      '<div class="notes-editor-head">' +
        '<button type="button" class="collapse-btn notes-collapse-btn" aria-label="' + collapseLabel + '" title="' + collapseLabel + '">' + NOTES_COLLAPSE_ICON + '</button>' +
        '<span class="notes-editor-head-label">Notes</span>' +
      '</div>';
    editor.querySelector(".notes-collapse-btn").addEventListener("click", function(){
      task.notesCollapsed = !task.notesCollapsed;
      scheduleSave();
      render();
    });
    if(task.notesCollapsed) return editor;

    var content = document.createElement("div");
    content.className = "notes-editor-content";
    content.innerHTML =
      NOTES_TOOLBAR_HTML +
      '<div class="notes-rich" contenteditable="true" data-placeholder="Notes…"></div>' +
      '<div class="checklist-list"></div>' +
      '<div class="checklist-add-row"><input type="text" class="checklist-add-input" placeholder="Add checklist item…" aria-label="Add checklist item"><button type="button" class="btn btn-sm btn-ghost" data-act="add-item">Add</button></div>';
    editor.appendChild(content);

    var listEl = content.querySelector(".checklist-list");
    task.checklist.forEach(function(item){ listEl.appendChild(renderChecklistItemRow(row, task, item)); });

    wireNotesRichEditor(content, task.notes, function(v){
      if(v !== (task.notes || "")){
        task.notes = v;
        scheduleSave();
        updateNotesBadge(row, task);
      }
    });

    var addInput = content.querySelector(".checklist-add-input");
    function addItem(){
      var text = addInput.value.trim();
      if(!text) return;
      var item = { id: uid(), text: text, done: false };
      task.checklist.push(item);
      listEl.appendChild(renderChecklistItemRow(row, task, item));
      addInput.value = "";
      addInput.focus();
      scheduleSave();
      updateNotesBadge(row, task);
    }
    content.querySelector('[data-act="add-item"]').addEventListener("click", addItem);
    addInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addItem(); } });

    return editor;
  }
  // The Notes badge click: if a block is already showing (expanded or collapsed) it just
  // flips the collapse state, same as clicking the chevron inside it. If nothing's showing
  // yet — a task with no notes/checklist content — it opens a fresh, expanded editor so
  // typing can start right away, same as the old "click to open" behavior.
  function toggleNotesEditor(row, task){
    var existing = row.querySelector(".notes-editor");
    if(existing){
      task.notesCollapsed = !task.notesCollapsed;
      scheduleSave();
      render();
      return;
    }
    task.notesCollapsed = false;
    var editor = buildTaskNotesEditor(row, task);
    row.querySelector(".task-main").appendChild(editor);
    var rich = editor.querySelector(".notes-rich");
    if(rich) rich.focus();
  }
  // Rich-text notes for a heading or sub-heading — same toolbar as task notes, no checklist
  // (headings don't have one). Unlike a task, a heading/sub-heading can hold *several*
  // independent notes, each its own card in ownerObj.notesList — and unlike a task's notes
  // (opened on demand, closed when done), these stay visible in the body at all times, so
  // there's nothing to click just to see what's already there. Each card carries its own
  // "Done" button (blurs + confirms the save — notes already save on blur regardless, this
  // is purely so it's obvious you're finished rather than still mid-edit) and a "remove"
  // button, rather than a task-notes-style "Close" action.
  // Which heading/sub-heading notes are currently mid-edit (showing the toolbar) — keyed by
  // note id, session-only (never saved). A note not in here renders as a plain, read-only
  // view of its content with no editing chrome; clicking it (or the "Add note" button, for a
  // brand-new note) is what puts it in here and switches it into the toolbar+contenteditable
  // form. Finishing — clicking Done, or clicking/tabbing away — removes it from here again.
  var openHeadingNoteEditors = {};

  function renderHeadingNoteCard(ownerObj, note, onChange){
    var editing = !!openHeadingNoteEditors[note.id];
    var editor = document.createElement("div");
    editor.className = "notes-editor" + (editing ? "" : " view-mode");
    editor.setAttribute("data-note-id", note.id);

    function rebuild(){
      var fresh = renderHeadingNoteCard(ownerObj, note, onChange);
      editor.replaceWith(fresh);
      return fresh;
    }

    if(!editing){
      var viewRemoveBtn = document.createElement("button");
      viewRemoveBtn.type = "button";
      viewRemoveBtn.className = "icon-btn danger notes-remove-btn";
      viewRemoveBtn.title = "Remove this note";
      viewRemoveBtn.setAttribute("aria-label", "Remove this note");
      viewRemoveBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>';
      // Keep this from blurring/rebuilding anything mid-click — it never opens an editor itself.
      viewRemoveBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
      viewRemoveBtn.addEventListener("click", function(e){
        e.stopPropagation();
        delete openHeadingNoteEditors[note.id];
        ownerObj.notesList = ownerObj.notesList.filter(function(n){ return n.id !== note.id; });
        editor.remove();
        scheduleSave();
        if(onChange) onChange();
      });

      var viewEl = document.createElement("div");
      viewEl.className = "notes-view";
      viewEl.tabIndex = 0;
      viewEl.setAttribute("role", "button");
      viewEl.setAttribute("aria-label", "Edit note");
      if(note.html && note.html.trim()){ viewEl.innerHTML = note.html; }
      else { viewEl.innerHTML = '<span class="notes-view-empty">Empty note — click to edit</span>'; }
      function enterEdit(){
        openHeadingNoteEditors[note.id] = true;
        var fresh = rebuild();
        var rich = fresh.querySelector(".notes-rich");
        if(rich) rich.focus();
      }
      viewEl.addEventListener("click", enterEdit);
      viewEl.addEventListener("keydown", function(e){
        if(e.key === "Enter" || e.key === " "){ e.preventDefault(); enterEdit(); }
      });

      editor.appendChild(viewEl);
      editor.appendChild(viewRemoveBtn);
      return editor;
    }

    editor.innerHTML =
      NOTES_TOOLBAR_HTML +
      '<div class="notes-rich" contenteditable="true" data-placeholder="Notes…"></div>';
    var toolbar = editor.querySelector(".notes-toolbar");

    var doneBtn = document.createElement("button");
    doneBtn.type = "button";
    doneBtn.className = "btn btn-sm btn-primary notes-done-btn";
    doneBtn.title = "Save and stop editing this note";
    doneBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg><span>Done</span>';
    toolbar.appendChild(doneBtn);

    var removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "icon-btn danger notes-remove-btn";
    removeBtn.title = "Remove this note";
    removeBtn.setAttribute("aria-label", "Remove this note");
    removeBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    // Don't let clicking Remove blur the rich field first (which would rebuild this card into
    // its view-mode form out from under the click) — just remove it directly.
    removeBtn.addEventListener("mousedown", function(e){ e.preventDefault(); });
    toolbar.appendChild(removeBtn);

    var ctl = wireNotesRichEditor(editor, note.html, function(v){
      if(v !== note.html){ note.html = v; scheduleSave(); if(onChange) onChange(); }
    });

    // The rich field already saves on blur (see wireNotesRichEditor) — Done switches the card
    // back to its plain, read-only view right away. Clicking anywhere else does the same,
    // *except* when focus is only moving somewhere still inside this card — the link button's
    // own URL popover, in particular, deliberately steals focus from the rich field while
    // staying part of the same edit — so a plain "blur" listener would slam the editor shut
    // out from under it. Instead, watch focus leaving the whole card (focusout bubbles) and
    // only exit once the newly-focused element genuinely isn't part of it anymore.
    var exited = false;
    function exitEdit(){
      if(exited) return;
      exited = true;
      delete openHeadingNoteEditors[note.id];
      rebuild();
    }
    doneBtn.addEventListener("click", function(){ ctl.rich.blur(); exitEdit(); });
    editor.addEventListener("focusout", function(){
      setTimeout(function(){
        if(exited || !editor.isConnected) return;
        if(!editor.contains(document.activeElement)) exitEdit();
      }, 0);
    });

    removeBtn.addEventListener("click", function(){
      delete openHeadingNoteEditors[note.id];
      ownerObj.notesList = ownerObj.notesList.filter(function(n){ return n.id !== note.id; });
      editor.remove();
      scheduleSave();
      if(onChange) onChange();
    });
    return editor;
  }
  // The always-visible block of note cards for a heading/sub-heading — returns null (nothing
  // to render) when there are none yet, so an empty heading's body doesn't gain stray padding.
  function renderHeadingNotesBlock(ownerObj, onChange){
    if(!ownerObj.notesList || !ownerObj.notesList.length) return null;
    var wrap = document.createElement("div");
    wrap.className = "heading-notes-block";
    ownerObj.notesList.forEach(function(note){ wrap.appendChild(renderHeadingNoteCard(ownerObj, note, onChange)); });
    return wrap;
  }
  // Adds a brand-new blank note and focuses it — this is what the heading/sub-heading bar's

  function addHeadingNote(container, ownerObj, onChange){
    var note = { id: uid(), html: "" };
    ownerObj.notesList.push(note);
    openHeadingNoteEditors[note.id] = true;
    var block = container.querySelector(".heading-notes-block");
    if(!block){

  }
  function toggleHeadingAttachmentsEditor(container, ownerObj, onChange){
    var existing = container.querySelector(".attachments-editor");

    document.querySelectorAll(".attachments-editor").forEach(function(el){ el.remove(); });
    if(!Array.isArray(ownerObj.attachments)) ownerObj.attachments = [];
    var editor = buildAttachmentsEditorEl(ownerObj, onChange);

    var notesBlock = container.querySelector(".heading-notes-block");
    container.insertBefore(editor, notesBlock ? notesBlock.nextSibling : container.firstChild);
  }

  /* ---------------- tags & tag filter ---------------- */
  var TAG_COLORS = ["#4a5fc1","#b3486b","#6f7d3a","#7a4fa0","#55606e","#b8452f","#2f7d8c","#a8672a"];
  function tagColor(tag){
    var hash = 0;
    for(var i=0;i<tag.length;i++){ hash = (hash*31 + tag.charCodeAt(i)) | 0; }
    return TAG_COLORS[Math.abs(hash) % TAG_COLORS.length];
  }
  var TAG_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.59 13.41L11 3.83A2 2 0 009.59 3.17H4a1 1 0 00-1 1v5.59a2 2 0 00.59 1.41l9.59 9.59a2 2 0 002.82 0l4.59-4.59a2 2 0 000-2.82z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg>';
  function tagsBadgeSet(task){ return !!(task.tags && task.tags.length); }
  function tagsBadgeHtml(task){
    var tags = task.tags || [];
    if(!tags.length) return TAG_ICON;
    return TAG_ICON + '<span>' + escapeHtml(tags.join(", ")) + '</span>';
  }
  function updateTagsBadge(row, task){
    var btn = row.querySelector(".tags-badge");

  }
  function renderTagChip(chipsEl, row, task, tag){

    chip.querySelector(".tag-chip-text").textContent = tag;

  // Which tags are currently selected to filter the list by (OR logic: a task shows
  // if it has ANY selected tag). Session-only, not persisted — a transient lens on
  // the list rather than a saved preference.
  var activeTagFilters = [];
  function allTagsInUse(){
    var set = {};
    forEachTask(function(t){ (t.tags || []).forEach(function(tag){ set[tag] = true; }); });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b); });
  }
  function taskPassesTagFilter(task){
    if(!activeTagFilters.length) return true;
    var tags = task.tags || [];
    return activeTagFilters.some(function(tag){ return tags.indexOf(tag) !== -1; });
  }
  function refreshTagFilterButton(){
    var btn = document.getElementById("tag-filter-btn");
    if(!btn) return;
    var n = activeTagFilters.length;
    btn.classList.toggle("active", n > 0);

  }
  // Opens the popover if none is showing, closes it if one already is — this is what
  // the "Tags" button itself toggles. Checkbox/clear actions inside the popover call
  // buildTagFilterPopover() directly instead, so they refresh it in place rather than
  // closing it (see the toggle-shaped check at the top here).
  function openTagFilterPopover(anchorEl){
    var existing = document.querySelector(".tag-filter-popover");
    if(existing){ existing.remove(); return; }
    closeAllPopovers();
    buildTagFilterPopover(anchorEl);
  }
  function buildTagFilterPopover(anchorEl){
    var old = document.querySelector(".tag-filter-popover");
    if(old) old.remove();
    var pop = document.createElement("div");
    pop.className = "tag-filter-popover";
    var tags = allTagsInUse();
    if(!tags.length){
      pop.innerHTML = '<div class="field-hint" style="padding:4px 6px;">No tags yet — add one from a task first.</div>';
    } else {
      pop.innerHTML = tags.map(function(tag){
        var checked = activeTagFilters.indexOf(tag) !== -1;
        return '<label class="tag-filter-row"><input type="checkbox" class="tag-filter-cb" value="' + escapeHtml(tag) + '"' + (checked ? " checked" : "") + '>' +
          '<span class="tag-chip-dot" style="background:' + tagColor(tag) + '"></span><span>' + escapeHtml(tag) + '</span></label>';
      }).join("");
      if(activeTagFilters.length){
        pop.innerHTML += '<button type="button" class="btn btn-sm btn-ghost" id="tag-filter-clear" style="margin-top:4px;width:100%;">Clear filter</button>';
      }
    }
    document.body.appendChild(pop);
    var rect = anchorEl.getBoundingClientRect();
    pop.style.top = (rect.bottom + 6) + "px";
    pop.style.left = Math.max(8, rect.left) + "px";
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    pop.querySelectorAll(".tag-filter-cb").forEach(function(cb){
      cb.addEventListener("change", function(){
        var tag = cb.value;
        var idx = activeTagFilters.indexOf(tag);
        if(cb.checked){ if(idx === -1) activeTagFilters.push(tag); }
        else if(idx !== -1){ activeTagFilters.splice(idx, 1); }
        refreshTagFilterButton();
        render();
        buildTagFilterPopover(anchorEl);
      });
    });
    var clearBtn = pop.querySelector("#tag-filter-clear");
    if(clearBtn) clearBtn.addEventListener("click", function(){
      activeTagFilters = [];
      refreshTagFilterButton();
      render();
      buildTagFilterPopover(anchorEl);
    });
  }

  /* ---------------- priority & due date filters ----------------
     Same idea as the tag filter above (session-only, OR logic within

     priority or due date — not related to the Manual/Priority/Due date
     Sort toggle, which only ever reorders tasks and never hides any. */
  var activePriorityFilters = []; // subset of "high"/"medium"/"low"/"none"
  var activeDuePresets = []; // subset of "overdue"/"today"/"week"/"none"
  var activeDueRange = { from: "", to: "" }; // "" = unset
  var PRIORITY_FILTER_OPTS = [
    { key: "high", label: "High" },
    { key: "medium", label: "Medium" },
    { key: "low", label: "Low" },
    { key: "none", label: "No priority" }

  var DUE_FILTER_PRESETS = [
    { key: "overdue", label: "Overdue" },
    { key: "today", label: "Due today" },
    { key: "week", label: "Due this week" },
    { key: "none", label: "No due date" }
  ];

  function taskPassesPriorityFilter(task){
    if(!activePriorityFilters.length) return true;
    return activePriorityFilters.indexOf(task.priority || "none") !== -1;
  }
  function dueRangeActive(){ return !!(activeDueRange.from || activeDueRange.to); }
  function dueFilterActive(){ return activeDuePresets.length > 0 || dueRangeActive(); }
  function taskPassesDueFilter(task){
    if(!dueFilterActive()) return true;
    var due = task.due;
    if(!due) return activeDuePresets.indexOf("none") !== -1;
    if(activeDuePresets.indexOf("overdue") !== -1 && isOverdue(due, task.done)) return true;
    var today = todayDateStr();
    if(activeDuePresets.indexOf("today") !== -1 && due.date === today) return true;
    if(activeDuePresets.indexOf("week") !== -1){
      var weekEnd = addDaysToDateStr(today, 7);
      if(due.date >= today && due.date <= weekEnd) return true;
    }
    if(dueRangeActive()){
      var from = activeDueRange.from || "0000-01-01";
      var to = activeDueRange.to || "9999-12-31";
      if(due.date >= from && due.date <= to) return true;
    }
    return false;
  }
  // Free-text search — like the filters above, session-only and not persisted. Matches
  // across a task's own text/notes/tags, its subtasks' text, any attachment's filename or
  // extracted text (OCR'd from images, read from a PDF's text layer or OCR'd off its pages
  // when it doesn't have one — see the attachment text-extraction section further down for
  // how extractedText gets populated) — AND, just as much, the heading and sub-heading a
  // task lives under: their titles, every one of their notes, and their own attachments.
  // A task shows if it matches on its own OR the heading/sub-heading containing it does —
  // e.g. searching a name mentioned only in a heading's note surfaces every task under that
  // heading, on the idea that finding the project is often the point of the search.
  var searchQuery = "";
  function attachmentSearchParts(attachments){
    var parts = [];
    (attachments || []).forEach(function(a){ parts.push(a.name || ""); parts.push(a.extractedText || ""); });
    return parts;
  }
  function taskSearchHaystack(task){
    var parts = [task.text || "", stripHtmlToText(task.notes || ""), (task.tags || []).join(" ")];
    (task.subtasks || []).forEach(function(st){
      parts.push(st.text || "");
      parts.push.apply(parts, attachmentSearchParts(st.attachments));
    });
    parts.push.apply(parts, attachmentSearchParts(task.attachments));
    return parts.join(" \n ").toLowerCase();
  }
  function headingSearchHaystack(ownerObj){
    var parts = [ownerObj.title || ""];
    (ownerObj.notesList || []).forEach(function(n){ parts.push(stripHtmlToText(n.html || "")); });
    parts.push.apply(parts, attachmentSearchParts(ownerObj.attachments));
    return parts.join(" \n ").toLowerCase();
  }
  // A small, dependency-free fuzzy matcher, since a plain substring check misses typos —
  // searching "conferance" should still find "conference". An exact substring match (the old
  // behavior) is always checked first and short-circuits, so nothing that used to match stops
  // matching; on top of that, every word in the query has to be close (small Levenshtein edit
  // distance, scaled to the word's length so short words stay strict) to *some* word in the
  // haystack, so a near-miss spelling still counts without turning search to mush.
  function levenshteinDistance(a, b){
    var al = a.length, bl = b.length;
    if(al === 0) return bl;
    if(bl === 0) return al;
    var prevRow = new Array(bl + 1);
    for(var j = 0; j <= bl; j++) prevRow[j] = j;
    for(var i = 1; i <= al; i++){
      var curRow = [i];
      var ai = a.charCodeAt(i - 1);
      for(var j2 = 1; j2 <= bl; j2++){
        var cost = ai === b.charCodeAt(j2 - 1) ? 0 : 1;
        curRow[j2] = Math.min(prevRow[j2] + 1, curRow[j2 - 1] + 1, prevRow[j2 - 1] + cost);
      }
      prevRow = curRow;
    }
    return prevRow[bl];
  }
  function fuzzyWordMatches(queryWord, haystackWord){
    if(!queryWord || !haystackWord) return false;
    if(haystackWord.indexOf(queryWord) !== -1) return true;
    if(queryWord.length <= 2) return false; // too short to fuzz meaningfully without matching everything
    var maxDist = queryWord.length <= 4 ? 1 : (queryWord.length <= 8 ? 2 : 3);
    if(Math.abs(queryWord.length - haystackWord.length) > maxDist) return false;
    return levenshteinDistance(queryWord, haystackWord) <= maxDist;
  }
  function fuzzyMatches(haystack, query){
    if(!query) return true;
    if(haystack.indexOf(query) !== -1) return true;
    var queryWords = query.split(/\s+/).filter(Boolean);
    if(!queryWords.length) return true;
    var haystackWords = haystack.split(/[\s\n]+/).filter(Boolean);
    return queryWords.every(function(qw){
      return haystackWords.some(function(hw){ return fuzzyWordMatches(qw, hw); });
    });
  }
  function taskPassesSearch(task, heading, sub){
    if(!searchQuery) return true;
    if(fuzzyMatches(taskSearchHaystack(task), searchQuery)) return true;
    if(heading && fuzzyMatches(headingSearchHaystack(heading), searchQuery)) return true;
    if(sub && fuzzyMatches(headingSearchHaystack(sub), searchQuery)) return true;
    return false;
  }
  // The single predicate every task-list rendering site filters through: passes
  // only if it clears the tag filter AND the priority filter AND the due filter AND
  // the search query (each individual filter is itself OR logic across its own
  // selected options; search is a fuzzy match against the haystack above, which now also
  // covers the containing heading/sub-heading — see taskPassesSearch).
  function taskPassesFilters(task, heading, sub){
    return taskPassesTagFilter(task) && taskPassesPriorityFilter(task) && taskPassesDueFilter(task) && taskPassesSearch(task, heading, sub);
  }
  function anyFilterActive(){
    return !!searchQuery || activeTagFilters.length > 0 || activePriorityFilters.length > 0 || dueFilterActive();
  }
  // Whether a heading/sub-heading has at least one task that would actually show under the
  // current Tags/Priority/Due date/search filters. Used to force a collapsed heading open
  // while a filter is narrowing the list — otherwise "1 task found" from a search (or a tag/
  // priority/due filter) can point at a task sitting inside a collapsed section with no way
  // to actually see it, which is exactly what was happening before this existed.
  function headingHasFilterMatch(heading){
    if(heading.tasks.some(function(t){ return !t.archivedAt && !t.deletedAt && taskPassesFilters(t, heading, null); })) return true;
    return heading.subheadings.some(function(sh){ return subHasFilterMatch(heading, sh); });
  }
  function subHasFilterMatch(heading, sub){
    return sub.tasks.some(function(t){ return !t.archivedAt && !t.deletedAt && taskPassesFilters(t, heading, sub); });
  }
  function updateSearchStatus(){
    var statusEl = document.getElementById("search-status");
    if(!statusEl) return;
    if(!searchQuery){ statusEl.textContent = ""; return; }
    var count = 0;
    forEachTask(function(t, h, sh){ if(!t.archivedAt && !t.deletedAt && taskPassesFilters(t, h, sh)) count++; });
    statusEl.textContent = count === 0 ? "No matches" : (count === 1 ? "1 task found" : count + " tasks found");
  }

  function refreshPriorityFilterButton(){
    var btn = document.getElementById("priority-filter-btn");
    if(!btn) return;
    var n = activePriorityFilters.length;
    btn.classList.toggle("active", n > 0);
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 21V4"/><path d="M6 4h11l-3 4 3 4H6"/></svg><span>' + (n ? "Priority (" + n + ")" : "Priority") + '</span>';
  }
  function openPriorityFilterPopover(anchorEl){

    pop.querySelectorAll(".priority-filter-cb").forEach(function(cb){

    if(clearBtn) clearBtn.addEventListener("click", function(){

  function refreshDueFilterButton(){
    var btn = document.getElementById("due-filter-btn");
    if(!btn) return;
    var n = activeDuePresets.length + (dueRangeActive() ? 1 : 0);
    btn.classList.toggle("active", n > 0);
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>' + (n ? "Due date (" + n + ")" : "Due date") + '</span>';
  }
  function openDueFilterPopover(anchorEl){
    var existing = document.querySelector(".due-filter-popover");
    if(existing){ existing.remove(); return; }
    closeAllPopovers();
    buildDueFilterPopover(anchorEl);
  }
  function buildDueFilterPopover(anchorEl){
    var old = document.querySelector(".due-filter-popover");
    if(old) old.remove();
    var pop = document.createElement("div");
    pop.className = "tag-filter-popover due-filter-popover";
    pop.innerHTML = DUE_FILTER_PRESETS.map(function(o){
      var checked = activeDuePresets.indexOf(o.key) !== -1;
      return '<label class="tag-filter-row"><input type="checkbox" class="due-filter-cb" value="' + o.key + '"' + (checked ? " checked" : "") + '><span>' + o.label + '</span></label>';
    }).join("") +
      '<div class="due-filter-range">' +
        '<div class="due-filter-range-label">Custom range</div>' +
        '<div class="due-filter-range-row">' +
          '<input type="date" class="due-filter-from" value="' + escapeHtml(activeDueRange.from) + '" aria-label="From date">' +
          '<span class="due-filter-range-sep">to</span>' +
          '<input type="date" class="due-filter-to" value="' + escapeHtml(activeDueRange.to) + '" aria-label="To date">' +
        '</div>' +
      '</div>' +
      (activeDuePresets.length || dueRangeActive() ? '<button type="button" class="btn btn-sm btn-ghost" id="due-filter-clear" style="margin-top:8px;width:100%;">Clear filter</button>' : '');
    document.body.appendChild(pop);
    var rect = anchorEl.getBoundingClientRect();
    pop.style.top = (rect.bottom + 6) + "px";
    // This popover is wider than the tag/priority ones (it holds two date inputs
    // side by side), so when its anchor button sits near the right edge, anchoring
    // to rect.left like the others would run it off-screen — clamp to the viewport.
    var left = Math.min(rect.left, window.innerWidth - pop.offsetWidth - 8);
    pop.style.left = Math.max(8, left) + "px";
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    pop.querySelectorAll(".due-filter-cb").forEach(function(cb){
      cb.addEventListener("change", function(){
        var key = cb.value;
        var idx = activeDuePresets.indexOf(key);
        if(cb.checked){ if(idx === -1) activeDuePresets.push(key); }
        else if(idx !== -1){ activeDuePresets.splice(idx, 1); }
        refreshDueFilterButton();
        render();
        buildDueFilterPopover(anchorEl);
      });
    });
    var fromInput = pop.querySelector(".due-filter-from");
    var toInput = pop.querySelector(".due-filter-to");
    fromInput.addEventListener("change", function(){
      activeDueRange.from = fromInput.value || "";
      refreshDueFilterButton();
      render();
      buildDueFilterPopover(anchorEl);
    });
    toInput.addEventListener("change", function(){
      activeDueRange.to = toInput.value || "";
      refreshDueFilterButton();
      render();
      buildDueFilterPopover(anchorEl);
    });
    var clearBtn = pop.querySelector("#due-filter-clear");
    if(clearBtn) clearBtn.addEventListener("click", function(){
      activeDuePresets = [];
      activeDueRange = { from: "", to: "" };
      refreshDueFilterButton();
      render();
      buildDueFilterPopover(anchorEl);
    });
  }

  /* ---------------- subtasks ---------------- */
  // Subtasks are a lighter-weight nested task: text, done, and an optional due date —
  // no notes/checklist/tags/priority/calendar sync of their own. Distinct from the
  // notes checklist, which is plain text items with no dates.
  var SUBTASK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3" stroke-linecap="round"/></svg>';
  // A dedicated disclosure arrow (rather than relying on the small icon alone as the
  // only visual cue) — it rotates via the .open class toggled in toggleSubtasksEditor.
  var SUBTASK_CHEVRON = '<svg class="subtask-chevron" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="M6 9l6 6 6-6"/></svg>';
  function subtasksBadgeSet(task){ return !!(task.subtasks && task.subtasks.length); }
  function subtasksBadgeHtml(task){
    var subs = task.subtasks || [];
    if(!subs.length) return SUBTASK_ICON + SUBTASK_CHEVRON;
    var done = subs.filter(function(s){ return s.done; }).length;
    return SUBTASK_ICON + '<span>' + done + '/' + subs.length + '</span>' + SUBTASK_CHEVRON;
  }
  function updateSubtasksBadge(row, task){
    var btn = row.querySelector(".subtasks-badge");
    if(!btn) return;
    btn.classList.toggle("set", subtasksBadgeSet(task));
    var wasOpen = btn.classList.contains("open");
    btn.innerHTML = subtasksBadgeHtml(task);
    btn.classList.toggle("open", wasOpen);
  }
  // The row-level disclosure arrow next to the task title only exists once a task has
  // at least one subtask — add or remove it in place (no full render()) when the first
  // subtask is added or the last one is removed, keeping it in sync with the badge.
  function updateTaskSubtaskToggle(row, task){
    var existing = row.querySelector(".task-subtask-toggle");
    var shouldExist = !!(task.subtasks && task.subtasks.length);
    if(shouldExist && !existing){
      var btn = document.createElement("button");
      btn.className = "task-subtask-toggle";
      btn.type = "button";
      btn.title = "Show/hide subtasks";
      btn.setAttribute("aria-label", "Show/hide subtasks");
      btn.innerHTML = SUBTASK_CHEVRON;
      var badge = row.querySelector(".subtasks-badge");
      if(badge && badge.classList.contains("open")) btn.classList.add("open");
      btn.addEventListener("click", function(){ toggleSubtasksEditor(row, task); });
      row.querySelector(".task-main").insertAdjacentElement("beforebegin", btn);
    } else if(!shouldExist && existing){
      existing.remove();
    }
  }
  function updateSubtaskDueBadge(itemRow, subtask){
    var btn = itemRow.querySelector(".subtask-due-badge");
    if(!btn) return;
    var due = subtask.due;
    var overdue = isOverdue(due, subtask.done);
    btn.className = "due-badge due-badge-sm subtask-due-badge" + (due ? (overdue ? " overdue" : " set") : "");
    btn.textContent = due ? formatDue(due) : "Add date";
  }
  function toggleSubtaskDueEditor(itemRow, task, subtask){
    var existing = itemRow.querySelector(".due-editor");
    if(existing){ existing.remove(); return; }
    document.querySelectorAll(".due-editor").forEach(function(el){ el.remove(); });
    var editor = document.createElement("div");
    editor.className = "due-editor";
    var d = subtask.due || {};
    editor.innerHTML =
      '<input type="date" value="' + (d.date || "") + '" />' +
      '<input type="time" class="due-time-start" value="' + (d.time || "") + '" ' + (d.allDay ? "disabled" : "") + ' />' +
      '<span class="due-time-sep">to</span>' +
      '<input type="time" class="due-time-end" value="' + (d.endTime || "") + '" ' + (d.allDay ? "disabled" : "") + ' title="End time (optional)" />' +
      '<label><input type="checkbox" ' + (d.allDay ? "checked" : "") + ' /> All day</label>' +
      '<button class="btn btn-sm btn-primary" data-act="save">Save</button>' +
      (subtask.due ? '<button class="btn btn-sm btn-ghost" data-act="clear">Clear</button>' : '') +
      '<button class="btn btn-sm btn-ghost" data-act="close">Close</button>';
    itemRow.appendChild(editor);
    var dateEl = editor.querySelector('input[type="date"]');
    var timeEl = editor.querySelector('.due-time-start');
    var endTimeEl = editor.querySelector('.due-time-end');
    var allDayEl = editor.querySelector('input[type="checkbox"]');
    dateEl.focus();
    allDayEl.addEventListener("change", function(){ timeEl.disabled = allDayEl.checked; endTimeEl.disabled = allDayEl.checked; });
    editor.querySelector('[data-act="save"]').addEventListener("click", function(){
      if(!dateEl.value){ dateEl.focus(); return; }
      var startVal = allDayEl.checked ? null : (timeEl.value || null);
      var endVal = (allDayEl.checked || !startVal || !endTimeEl.value) ? null : endTimeEl.value;
      if(endVal && endVal <= startVal) endVal = null;
      subtask.due = { date: dateEl.value, time: startVal, endTime: endVal, allDay: allDayEl.checked || !startVal };
      scheduleSave();
      updateSubtaskDueBadge(itemRow, subtask);
      editor.remove();
    });
    var clearBtn = editor.querySelector('[data-act="clear"]');
    if(clearBtn) clearBtn.addEventListener("click", function(){
      subtask.due = null;
      scheduleSave();
      updateSubtaskDueBadge(itemRow, subtask);
      editor.remove();
    });
    editor.querySelector('[data-act="close"]').addEventListener("click", function(){ editor.remove(); });
  }
  function renderSubtaskRow(listEl, row, task, subtask){
    var itemRow = document.createElement("div");
    itemRow.className = "subtask-item" + (subtask.done ? " done" : "") + (subtask.status === "in_progress" ? " in-progress" : "");
    itemRow.setAttribute("data-subtask-id", subtask.id);
    itemRow.innerHTML =
      '<div class="subtask-item-row">' +
        '<button type="button" class="check subtask-check status-' + (subtask.status || "not_started") + '" aria-label="Status: ' + taskStatusLabel(subtask.status) + '" title="' + taskStatusLabel(subtask.status) + ' — click to change"></button>' +
        '<textarea class="subtask-text" rows="1" title="' + escapeHtml(subtask.text) + '" aria-label="Subtask">' + escapeHtml(subtask.text) + '</textarea>' +
        '<button type="button" class="due-badge due-badge-sm subtask-due-badge' + (subtask.due ? (isOverdue(subtask.due, subtask.done) ? " overdue" : " set") : "") + '">' + (subtask.due ? escapeHtml(formatDue(subtask.due)) : "Add date") + '</button>' +
        '<button type="button" class="attachments-badge due-badge-sm subtask-attachments-badge' + (attachmentsBadgeSet(subtask) ? " set" : "") + '" title="Attachments">' + attachmentsBadgeHtml(subtask) + '</button>' +
        '<button type="button" class="icon-btn danger subtask-remove" title="Remove subtask" aria-label="Remove subtask"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '</div>';
    itemRow.querySelector(".subtask-check").addEventListener("click", function(e){
      subtask.status = nextTaskStatus(subtask.status);

      itemRow.classList.toggle("done", subtask.done);

      e.currentTarget.className = "check subtask-check status-" + subtask.status;
      e.currentTarget.setAttribute("aria-label", "Status: " + taskStatusLabel(subtask.status));
