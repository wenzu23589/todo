  /* ================================================================
     GOOGLE CALENDAR (client-side OAuth via Google Identity Services)
     ================================================================ */
  var GCAL_CONFIG_KEY = "daybook-gcal-config-v1";
  var GCAL_EVER_KEY = "daybook-gcal-everconnected-v1";
  var GCAL_TOKEN_KEY = "daybook-gcal-token-v1";
  var GCAL_SCOPE = "https://www.googleapis.com/auth/calendar";
  var gcalClientId = null;
  var gcalTokenClient = null;
  var gcalToken = null;
  var gcalTokenExpiresAt = 0;
  var gcalStatus = "not_configured"; // not_configured | not_connected | connecting | connected | error
  var gcalStatusDetail = "";
  var gcalCalendars = [];
  var lastGcalFetchAt = 0;

  function loadGcalConfig(){ try{ return JSON.parse(localStorage.getItem(GCAL_CONFIG_KEY) || "null"); }catch(e){ return null; } }
  function saveGcalConfig(cfg){ localStorage.setItem(GCAL_CONFIG_KEY, JSON.stringify(cfg)); }

  // Access tokens are cached (with their expiry) so a plain page refresh can reuse
  // the still-valid token instead of re-triggering Google's sign-in flow every time.
  function saveGcalToken(){
    try{ localStorage.setItem(GCAL_TOKEN_KEY, JSON.stringify({ token: gcalToken, expiresAt: gcalTokenExpiresAt })); }catch(e){}
  }
  function loadCachedGcalToken(){
    try{
      var raw = JSON.parse(localStorage.getItem(GCAL_TOKEN_KEY) || "null");
      if(raw && raw.token && raw.expiresAt && Date.now() < raw.expiresAt - 60000){
        gcalToken = raw.token; gcalTokenExpiresAt = raw.expiresAt;
        return true;
      }
    }catch(e){}
    return false;
  }
  function clearCachedGcalToken(){
    try{ localStorage.removeItem(GCAL_TOKEN_KEY); }catch(e){}
  }

  function setGcalStatus(kind, detail){
    gcalStatus = kind; gcalStatusDetail = detail || "";
    var pill = document.getElementById("gcal-pill");
    var text = document.getElementById("gcal-pill-text");
    var map = {
      not_configured: {state:"off", text:"Set up Calendar"},
      not_connected: {state:"off", text:"Connect Calendar"},
      connecting: {state:"warn", text:"Connecting…"},
      connected: {state:"connected", text: (function(){
        var cal = gcalCalendars.filter(function(c){ return c.id === (state && state.googleCalendarId); })[0];
        return "Calendar: " + (cal ? cal.summary.trim() : "connected");
      })()},
      error: {state:"error", text:"Calendar error"}
    };
    var m = map[kind] || map.error;
    pill.setAttribute("data-state", m.state);
    text.textContent = m.text;
  }

  function ensureTokenClient(){
    if(!window.google || !google.accounts || !google.accounts.oauth2 || !gcalClientId) return null;
    if(!gcalTokenClient){
      gcalTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: gcalClientId,
        scope: GCAL_SCOPE,
        callback: function(){}
      });
    }
    return gcalTokenClient;
  }

  function requestGcalToken(opts){
    return new Promise(function(resolve, reject){
      var tc = ensureTokenClient();
      if(!tc){ reject(new Error("Google sign-in script isn't loaded yet — try again in a moment.")); return; }
      tc.callback = function(resp){
        if(resp && resp.error){ reject(resp); return; }
        gcalToken = resp.access_token;
        gcalTokenExpiresAt = Date.now() + (parseInt(resp.expires_in, 10) || 3500) * 1000;
        localStorage.setItem(GCAL_EVER_KEY, "1");
        saveGcalToken();
        resolve(gcalToken);
      };
      tc.requestAccessToken(opts || {});
    });
  }

  function ensureFreshGcalToken(){
    if(gcalToken && Date.now() < gcalTokenExpiresAt - 60000) return Promise.resolve(gcalToken);
    return requestGcalToken({ prompt: "" });
  }

  function gcalFetch(path, options){
    return ensureFreshGcalToken().then(function(token){
      options = options || {};
      var headers = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
      if(options.headers) for(var k in options.headers) headers[k] = options.headers[k];
      var opts = { method: options.method, body: options.body, headers: headers };
      return fetch("https://www.googleapis.com/calendar/v3/" + path, opts);
    });
  }

  function describeGcalError(err){
    if(err && err.message) return err.message;
    if(err && err.error === "popup_closed_by_user") return "Sign-in window closed before finishing.";
    if(err && err.error) return "Google sign-in error: " + err.error;
    return "Couldn't connect to Google Calendar.";
  }

  function connectGoogleCalendar(){
    if(!gcalClientId){ openCalendarSettings(); return; }
    setGcalStatus("connecting");
    requestGcalToken({ prompt: "" }).then(function(){
      return loadGoogleCalendars();
    }).then(function(){
      setGcalStatus("connected");
      reconcileFromCalendar();
    }).catch(function(err){
      setGcalStatus("error", describeGcalError(err));
      showBanner("Google Calendar: " + describeGcalError(err), "danger");
    });
  }

  function loadGoogleCalendars(){
    return gcalFetch("users/me/calendarList?maxResults=250").then(function(res){
      if(!res.ok) return res.json().then(function(j){ throw new Error((j && j.error && j.error.message) || "Couldn't load your calendars."); });
      return res.json();
    }).then(function(json){
      gcalCalendars = json.items || [];
      if(!state.googleCalendarId || !gcalCalendars.some(function(c){ return c.id === state.googleCalendarId; })){
        var pick = gcalCalendars.filter(function(c){ return /to.?do/i.test(c.summary || ""); })[0]
          || gcalCalendars.filter(function(c){ return c.primary; })[0]
          || gcalCalendars[0];
        if(pick){ state.googleCalendarId = pick.id; scheduleSave(); }
      }
      lastGcalFetchAt = Date.now();
    });
  }

  function pad2(n){ return n < 10 ? "0" + n : "" + n; }
  function addDaysToDateStr(dateStr, days){
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function addMinutesToTimeStr(timeStr, mins){
    var parts = timeStr.split(":");
    var d = new Date(2000, 0, 1, parseInt(parts[0], 10), parseInt(parts[1], 10));
    d.setMinutes(d.getMinutes() + mins);
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function eventTitleFor(task){ return (task.done ? "✓ " : "") + task.text; }

  // All-day tasks sync to Google Calendar as a timed block from ALLDAY_SYNC_START
  // to ALLDAY_SYNC_END, rather than a true all-day (date-only) event — so they show
  // up in the day's time grid instead of a banner. eventToDue() below recognizes an
  // event matching this exact window and reads it back as allDay, so the round trip
  // through a periodic calendar refresh doesn't flip the task's own "All day" flag.
  var ALLDAY_SYNC_START = "07:00";
  var ALLDAY_SYNC_END = "19:00";
  function buildEventBody(task){
    if(!task.due) return null;
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    if(task.due.allDay || !task.due.time){
      return {
        summary: eventTitleFor(task),
        start: { dateTime: task.due.date + "T" + ALLDAY_SYNC_START + ":00", timeZone: tz },
        end: { dateTime: task.due.date + "T" + ALLDAY_SYNC_END + ":00", timeZone: tz }
      };
    }
    var endTime = task.due.endTime || addMinutesToTimeStr(task.due.time, 30);
    return {
      summary: eventTitleFor(task),
      start: { dateTime: task.due.date + "T" + task.due.time + ":00", timeZone: tz },
      end: { dateTime: task.due.date + "T" + endTime + ":00", timeZone: tz }
    };
  }

  function syncTaskToCalendar(task){
    if(gcalStatus !== "connected" || !state.googleCalendarId) return;
    var body = buildEventBody(task);
    task.syncing = true; render();
    var p;
    var base = "calendars/" + encodeURIComponent(state.googleCalendarId) + "/events";
    if(!body){
      if(task.calendarEventId){
        p = gcalFetch(base + "/" + encodeURIComponent(task.calendarEventId), { method: "DELETE" })
          .then(function(){ task.calendarEventId = null; });
      } else { p = Promise.resolve(); }
    } else if(task.calendarEventId){
      p = gcalFetch(base + "/" + encodeURIComponent(task.calendarEventId), { method: "PATCH", body: JSON.stringify(body) })
        .then(function(res){
          if(res.status === 404){ task.calendarEventId = null; throw new Error("That calendar event was removed — try again to recreate it."); }
          if(!res.ok) return res.json().then(function(j){ throw new Error((j && j.error && j.error.message) || "Calendar update failed."); });
        });
    } else {
      p = gcalFetch(base, { method: "POST", body: JSON.stringify(body) })
        .then(function(res){ return res.json().then(function(j){
          if(!res.ok) throw new Error((j && j.error && j.error.message) || "Calendar create failed.");
          task.calendarEventId = j.id;
        }); });
    }
    p.then(function(){ task.syncError = null; })
      .catch(function(err){ task.syncError = err.message || "Calendar sync failed."; })
      .then(function(){ task.syncing = false; scheduleSave(); render(); });
  }

  function deleteRemoteEventBestEffort(task){
    if(gcalStatus !== "connected" || !task.calendarEventId || !state.googleCalendarId) return Promise.resolve();
    return gcalFetch("calendars/" + encodeURIComponent(state.googleCalendarId) + "/events/" + encodeURIComponent(task.calendarEventId), { method: "DELETE" }).catch(function(){});
  }

  function eventToDue(ev){
    if(!ev.start) return null;
    if(ev.start.date && !ev.start.dateTime) return { date: ev.start.date, time: null, endTime: null, allDay: true };
    var dt = ev.start.dateTime;
    var dateStr = dt.slice(0, 10);
    var startTime = dt.slice(11, 16);
    var endDt = ev.end && ev.end.dateTime;
    var endTime = endDt ? endDt.slice(11, 16) : null;
    var sameDay = !endDt || endDt.slice(0, 10) === dateStr;
    // A same-day event running exactly ALLDAY_SYNC_START–ALLDAY_SYNC_END is the
    // window Daybook itself creates for an "All day" task — read it back as such.
    if(sameDay && startTime === ALLDAY_SYNC_START && endTime === ALLDAY_SYNC_END){
      return { date: dateStr, time: null, endTime: null, allDay: true };
    }
    return { date: dateStr, time: startTime, endTime: sameDay ? endTime : null, allDay: false };
  }
  function dueEqual(a, b){
    if(!a && !b) return true;
    if(!a || !b) return false;
    return a.date === b.date && a.time === b.time && a.endTime === b.endTime && !!a.allDay === !!b.allDay;
  }
  function normText(s){ return (s || "").replace(/^✓\s*/, "").trim().toLowerCase(); }

  function reconcileFromCalendar(){
    if(gcalStatus !== "connected" || !state.googleCalendarId) return Promise.resolve();
    var timeMin = new Date(); timeMin.setDate(timeMin.getDate() - 3); timeMin.setHours(0, 0, 0, 0);
    var timeMax = new Date(); timeMax.setDate(timeMax.getDate() + 60);
    var url = "calendars/" + encodeURIComponent(state.googleCalendarId) + "/events?singleEvents=true&orderBy=startTime&maxResults=250" +
      "&timeMin=" + encodeURIComponent(timeMin.toISOString()) + "&timeMax=" + encodeURIComponent(timeMax.toISOString());
    return gcalFetch(url).then(function(res){
      if(!res.ok) return res.json().then(function(j){ throw new Error((j && j.error && j.error.message) || "Couldn't read calendar events."); });
      return res.json();
    }).then(function(json){
      lastGcalFetchAt = Date.now();
      var events = json.items || [];
      var byId = {}; events.forEach(function(e){ byId[e.id] = e; });
      var linkedIds = {}; var changed = false;
      forEachTask(function(t){
        if(!t.calendarEventId) return;
        linkedIds[t.calendarEventId] = true;
        var ev = byId[t.calendarEventId];
        if(!ev || ev.status === "cancelled"){ t.calendarEventId = null; t.syncError = "The linked calendar event was removed"; changed = true; return; }
        var extDue = eventToDue(ev);
        var extDone = /^✓/.test(ev.summary || "");
        var extText = normText(ev.summary);
        if(!dueEqual(extDue, t.due)){ t.due = extDue; changed = true; }
        if(extText && extText !== normText(t.text)){ t.text = (ev.summary || "").replace(/^✓\s*/, "").trim(); changed = true; }
        if(extDone !== t.done){
          t.done = extDone;
          t.completedAt = extDone ? (t.completedAt || new Date().toISOString()) : null;
          t.status = extDone ? "done" : (t.status === "done" ? "not_started" : t.status);
          changed = true;
        }
        if(t.syncError){ t.syncError = null; changed = true; }
      });
      events.forEach(function(ev){
        if(linkedIds[ev.id] || ev.status === "cancelled") return;
        var evNorm = normText(ev.summary);
        if(!evNorm) return;
        var match = null;
        forEachTask(function(t){ if(match || t.calendarEventId) return; if(normText(t.text) === evNorm) match = t; });
        if(match){
          match.calendarEventId = ev.id;
          match.due = eventToDue(ev);
          var extDone2 = /^✓/.test(ev.summary || "");
          if(extDone2 !== match.done){
            match.done = extDone2;
            match.completedAt = extDone2 ? new Date().toISOString() : null;
            match.status = extDone2 ? "done" : (match.status === "done" ? "not_started" : match.status);
          }
          match.syncError = null;
          linkedIds[ev.id] = true; changed = true;
        }
      });
      if(changed){ scheduleSave(); render(); }
    }).catch(function(err){
      showBanner("Calendar sync: " + (err.message || "couldn't refresh from Google Calendar."), "danger");
    });
  }

  function tryAutoConnectGcal(){
    if(!gcalClientId){ setGcalStatus("not_configured"); return; }
    if(localStorage.getItem(GCAL_EVER_KEY) !== "1"){ setGcalStatus("not_connected"); return; }
    setGcalStatus("connecting");
    if(loadCachedGcalToken()){
      // Still-valid token from a previous visit — reuse it silently, no Google
      // popup/prompt at all, instead of requesting a brand-new one on every load.
      loadGoogleCalendars().then(function(){
        setGcalStatus("connected");
        reconcileFromCalendar();
      }).catch(function(){
        // Cached token turned out to be no good (e.g. revoked) — fall back to a fresh silent request.
        requestGcalToken({ prompt: "" }).then(function(){
          return loadGoogleCalendars();
        }).then(function(){
          setGcalStatus("connected");
          reconcileFromCalendar();
        }).catch(function(){ setGcalStatus("not_connected"); });
      });
      return;
    }
    requestGcalToken({ prompt: "" }).then(function(){
      return loadGoogleCalendars();
    }).then(function(){
      setGcalStatus("connected");
      reconcileFromCalendar();
    }).catch(function(){ setGcalStatus("not_connected"); });
  }

  function waitForGis(cb, triesLeft){
    if(window.google && google.accounts && google.accounts.oauth2){ cb(); return; }
    if(triesLeft <= 0) return;
    setTimeout(function(){ waitForGis(cb, triesLeft - 1); }, 200);
  }

  function openCalendarSettings(){
    var root = document.getElementById("modal-root");
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    root.appendChild(backdrop);
    function close(){ if(backdrop.parentNode) root.removeChild(backdrop); }
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });

    function paint(){
      var gcfg = loadGcalConfig();
      var clientIdVal = gcalClientId || (gcfg && gcfg.clientId) || "";
      var html = '<div class="modal-box" role="dialog" aria-modal="true"><h3>Google Calendar</h3>';

      var trailingActionsHtml = "";
      if(gcalStatus !== "connected"){
        html += '<p>Give a task a due date and it becomes a real event on your Google Calendar — and events you add there flow back into Daybook. This needs a small (free) Google Cloud project of your own; see the README for exact steps.</p>';
        html += '<div id="cal-error" class="modal-error" hidden></div>';
        html += '<div class="field"><label for="f-clientid">OAuth Client ID</label>' +
          '<input id="f-clientid" type="text" placeholder="xxxxxxxx.apps.googleusercontent.com" value="' + escapeHtml(clientIdVal) + '">' +
          '<div class="field-hint">From Google Cloud Console → Google Auth platform → Clients. Not secret — safe to store in this browser.</div></div>';
        trailingActionsHtml = '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="cal-cancel">Close</button>' +
          '<button class="btn btn-primary" id="cal-connect">Connect Google Calendar</button>' +
          '</div>';
      } else {
        html += '<p>Connected. Choose which calendar new due dates sync to:</p>';
        html += '<div class="field"><label for="f-cal-select">Calendar</label><select id="f-cal-select">' +
          gcalCalendars.map(function(c){
            return '<option value="' + escapeHtml(c.id) + '"' + (c.id === state.googleCalendarId ? " selected" : "") + '>' + escapeHtml((c.summary || c.id).trim()) + '</option>';
          }).join("") + '</select></div>';
        html += '<div class="modal-note">Switching calendars unlinks tasks from their old events (nothing is deleted there) and re-creates events for tasks with due dates on the new calendar.</div>';

        var otherCals = gcalCalendars.filter(function(c){ return c.id !== state.googleCalendarId; });
        html += '<div class="field"><label>Also show on the Calendar view (read-only)</label>';
        if(!otherCals.length){
          html += '<div class="field-hint">No other calendars on this account.</div>';
        } else {
          html += '<div class="cal-display-list">' + otherCals.map(function(c){
            var checked = (state.googleDisplayCalendarIds || []).indexOf(c.id) !== -1;
            var color = c.backgroundColor || "var(--muted)";
            return '<label class="cal-display-row"><input type="checkbox" class="cal-display-cb" value="' + escapeHtml(c.id) + '"' + (checked ? " checked" : "") + '>' +
              '<span class="cal-display-dot" style="background:' + color + '"></span>' +
              '<span>' + escapeHtml((c.summary || c.id).trim()) + '</span></label>';
          }).join("") + '</div>';
        }
        html += '</div>';

        trailingActionsHtml = '<div class="modal-actions">' +
          '<button class="btn btn-danger btn-ghost" id="cal-disconnect">Disconnect</button>' +
          '<button class="btn btn-ghost" id="cal-cancel">Close</button>' +
          '</div>';
      }

      html += '<div class="field ics-feeds-field"><label>External calendars (read-only)</label>';
      html += '<div class="modal-note">Paste a calendar’s “Secret address in iCal format” (in Google Calendar: Settings → that calendar → Integrate calendar) to show its events here — no Google sign-in needed, so this works for calendars that don’t support OAuth (like most University of Malta calendars). A background job syncs feeds roughly every 30 minutes; adding or removing one here also kicks off an immediate sync, which can still take a minute or two to show up.</div>';
      if(!icsFeeds.length){
        html += '<div class="field-hint">No external calendars added yet.</div>';
      } else {
        html += '<div class="ics-feed-list">' + icsFeeds.map(function(f){
          var meta = icsEventsMeta && icsEventsMeta.feeds ? icsEventsMeta.feeds.filter(function(m){ return m.id === f.id; })[0] : null;
          var statusText = !icsEventsMeta ? "not yet synced" : (meta ? (meta.ok ? (meta.count + (meta.count === 1 ? " event" : " events")) : "sync error: " + escapeHtml(meta.error || "unknown")) : "not yet synced");
          return '<div class="ics-feed-row" data-feed-id="' + escapeHtml(f.id) + '">' +
            '<span class="cal-display-dot" style="background:' + escapeHtml(f.color) + '"></span>' +
            '<span class="ics-feed-name">' + escapeHtml(f.name) + '</span>' +
            '<span class="ics-feed-status">' + statusText + '</span>' +
            '<button type="button" class="btn btn-ghost btn-danger ics-feed-remove" data-feed-id="' + escapeHtml(f.id) + '" aria-label="Remove">Remove</button>' +
            '</div>';
        }).join("") + '</div>';
      }
      html += '<div class="ics-add-row">' +
        '<input type="text" id="ics-add-name" placeholder="Name (e.g. UM Timetable)">' +
        '<input type="text" id="ics-add-url" placeholder="https://calendar.google.com/calendar/ical/…">' +
        '<button type="button" class="btn btn-ghost" id="ics-add-btn">Add</button>' +
        '</div>';
      html += '<div id="ics-add-error" class="modal-error" hidden></div>';
      html += '</div>';

      html += '<div class="field digest-field"><label>Daily email digest</label>';
      html += '<div class="modal-note">A once-a-day email listing overdue tasks, tasks due today, and tasks due in the next few days. Sent by a GitHub Actions job — see the README for the one-time setup (a Gmail address + App Password stored as repo secrets).</div>';
      html += '<label class="digest-toggle-row"><input type="checkbox" id="digest-enabled"' + (digestSettings.enabled ? " checked" : "") + '> <span>Send me the daily digest</span></label>';
      html += '<input type="email" id="digest-email" placeholder="you@example.com" value="' + escapeHtml(digestSettings.email) + '">';
      html += '<div id="digest-error" class="modal-error" hidden></div>';
      html += '<button type="button" class="btn btn-ghost btn-sm" id="digest-save">Save digest settings</button>';
      html += '<span id="digest-saved-note" class="field-hint" hidden>Saved.</span>';
      html += '</div>';

      html += trailingActionsHtml;

      html += '</div>';
      backdrop.innerHTML = html;

      backdrop.querySelector("#cal-cancel").addEventListener("click", close);

      var connectBtn = backdrop.querySelector("#cal-connect");
      if(connectBtn){
        connectBtn.addEventListener("click", function(){
          var idVal = backdrop.querySelector("#f-clientid").value.trim();
          var errEl = backdrop.querySelector("#cal-error");
          if(!idVal){ errEl.textContent = "Paste your OAuth Client ID first."; errEl.hidden = false; return; }
          gcalClientId = idVal;
          saveGcalConfig({ clientId: idVal });
          gcalTokenClient = null;
          connectBtn.disabled = true; connectBtn.textContent = "Connecting…";
          setGcalStatus("connecting");
          waitForGis(function(){
            requestGcalToken({ prompt: "" }).then(function(){
              return loadGoogleCalendars();
            }).then(function(){
              setGcalStatus("connected");
              reconcileFromCalendar();
              paint();
            }).catch(function(err){
              setGcalStatus("not_connected");
              errEl.textContent = describeGcalError(err);
              errEl.hidden = false;
              connectBtn.disabled = false; connectBtn.textContent = "Connect Google Calendar";
            });
          }, 25);
        });
      }

      var calSelect = backdrop.querySelector("#f-cal-select");
      if(calSelect){
        calSelect.addEventListener("change", function(){
          var newId = calSelect.value;
          if(newId === state.googleCalendarId) return;
          state.googleCalendarId = newId;
          state.googleDisplayCalendarIds = (state.googleDisplayCalendarIds || []).filter(function(id){ return id !== newId; });
          forEachTask(function(t){ t.calendarEventId = null; t.syncError = null; });
          scheduleSave();
          setGcalStatus("connected");
          forEachTask(function(t){ if(t.due) syncTaskToCalendar(t); });
          calEventsKey = null;
          render();
          paint();
        });
      }

      backdrop.querySelectorAll(".cal-display-cb").forEach(function(cb){
        cb.addEventListener("change", function(){
          var id = cb.value;
          var list = (state.googleDisplayCalendarIds || []).slice();
          var idx = list.indexOf(id);
          if(cb.checked){ if(idx === -1) list.push(id); }
          else if(idx !== -1){ list.splice(idx, 1); }
          state.googleDisplayCalendarIds = list;
          scheduleSave();
          calEventsKey = null;
          if(viewMode === "cal") renderCalendar();
        });
      });

      var discBtn = backdrop.querySelector("#cal-disconnect");
      if(discBtn){
        discBtn.addEventListener("click", function(){
          gcalToken = null; gcalTokenExpiresAt = 0;
          localStorage.removeItem(GCAL_EVER_KEY);
          clearCachedGcalToken();
          setGcalStatus("not_connected");
          close();
        });
      }

      var icsAddBtn = backdrop.querySelector("#ics-add-btn");
      if(icsAddBtn){
        icsAddBtn.addEventListener("click", function(){
          var nameEl = backdrop.querySelector("#ics-add-name");
          var urlEl = backdrop.querySelector("#ics-add-url");
          var errEl = backdrop.querySelector("#ics-add-error");
          var name = nameEl.value.trim();
          var url = urlEl.value.trim();
          errEl.hidden = true;
          if(!name || !url){
            errEl.textContent = "Give it a name and paste the calendar's iCal link.";
            errEl.hidden = false;
            return;
          }
          if(!/^https?:\/\//i.test(url)){
            errEl.textContent = "That doesn't look like a link — it should start with http:// or https://.";
            errEl.hidden = false;
            return;
          }
          if(!config){
            errEl.textContent = "Connect Daybook to a GitHub repo first (see Settings) before adding external calendars.";
            errEl.hidden = false;
            return;
          }
          icsAddBtn.disabled = true; icsAddBtn.textContent = "Adding…";
          icsFeeds.push({ id: uid(), name: name, url: url, color: nextIcsColor() });
          saveIcsFeeds().then(function(){
            icsEventsFetchedAt = 0;
            if(viewMode === "cal") ensureIcsEvents(true);
            paint();
          });
        });
      }

      backdrop.querySelectorAll(".ics-feed-remove").forEach(function(btn){
        btn.addEventListener("click", function(){
          var id = btn.getAttribute("data-feed-id");
          icsFeeds = icsFeeds.filter(function(f){ return f.id !== id; });
          icsEvents = icsEvents.filter(function(ev){ return ev.feedId !== id; });
          btn.disabled = true;
          saveIcsFeeds().then(function(){
            icsEventsFetchedAt = 0;
            if(icsFeeds.length){ if(viewMode === "cal") ensureIcsEvents(true); }
            else if(viewMode === "cal") renderCalendar();
            paint();
          });
        });
      });

      var digestSaveBtn = backdrop.querySelector("#digest-save");
      if(digestSaveBtn){
        digestSaveBtn.addEventListener("click", function(){
          var emailEl = backdrop.querySelector("#digest-email");
          var errEl = backdrop.querySelector("#digest-error");
          var savedNote = backdrop.querySelector("#digest-saved-note");
          var enabled = backdrop.querySelector("#digest-enabled").checked;
          var email = emailEl.value.trim();
          errEl.hidden = true; savedNote.hidden = true;
          if(enabled && !email){
            errEl.textContent = "Add the email address to send the digest to, or turn the toggle off.";
            errEl.hidden = false;
            return;
          }
          if(!config){
            errEl.textContent = "Connect Daybook to a GitHub repo first (see Settings) before enabling the digest.";
            errEl.hidden = false;
            return;
          }
          digestSettings = { enabled: enabled, email: email };
          digestSaveBtn.disabled = true; digestSaveBtn.textContent = "Saving…";
          saveDigestSettings().then(function(){
            digestSaveBtn.disabled = false; digestSaveBtn.textContent = "Save digest settings";
            savedNote.hidden = false;
          });
        });
      }
    }
    paint();
    if(config && !icsFeedsLoaded) loadIcsFeeds().then(paint);
    if(config && !digestSettingsLoaded) loadDigestSettings().then(paint);
  }
  document.getElementById("gcal-pill").addEventListener("click", openCalendarSettings);

  /* ---------------- view tabs ---------------- */
  function setView(mode){
    viewMode = mode;

  /* ---------------- data helpers ---------------- */
  function forEachTask(fn){
    state.headings.forEach(function(h){
      h.tasks.forEach(function(t){ fn(t, h, null); });
      h.subheadings.forEach(function(sh){ sh.tasks.forEach(function(t){ fn(t, h, sh); }); });
    });
  }

  function locateTask(taskId){
    for(var i=0;i<state.headings.length;i++){
      var h = state.headings[i];
      var idx = h.tasks.findIndex(function(t){ return t.id === taskId; });
      if(idx >= 0) return { list: h.tasks, index: idx, heading: h, sub: null };
      for(var j=0;j<h.subheadings.length;j++){
        var sh = h.subheadings[j];
        var idx2 = sh.tasks.findIndex(function(t){ return t.id === taskId; });
        if(idx2 >= 0) return { list: sh.tasks, index: idx2, heading: h, sub: sh };
      }
    }
    return null;
  }
  function locateSub(subId){
    for(var i=0;i<state.headings.length;i++){
      var h = state.headings[i];
      var idx = h.subheadings.findIndex(function(s){ return s.id === subId; });
      if(idx >= 0) return { list: h.subheadings, index: idx, heading: h };
    }
    return null;
  }
  function locateHeading(headingId){
    var idx = state.headings.findIndex(function(h){ return h.id === headingId; });
    return idx >= 0 ? { index: idx } : null;
  }

  function moveTaskTo(taskId, targetList, targetIndex){
    var loc = locateTask(taskId);
    if(!loc) return;
    var sameList = loc.list === targetList;
    var task = loc.list.splice(loc.index, 1)[0];
    if(sameList && loc.index < targetIndex) targetIndex--;
    if(targetIndex < 0) targetIndex = 0;
    if(targetIndex > targetList.length) targetIndex = targetList.length;
    targetList.splice(targetIndex, 0, task);
  }
  function moveSubTo(subId, targetHeading, targetIndex){
    var loc = locateSub(subId);
    if(!loc) return;
    var targetList = targetHeading.subheadings;
    var sameList = loc.list === targetList;
    var sub = loc.list.splice(loc.index, 1)[0];
    if(sameList && loc.index < targetIndex) targetIndex--;
    if(targetIndex < 0) targetIndex = 0;
    if(targetIndex > targetList.length) targetIndex = targetList.length;
    targetList.splice(targetIndex, 0, sub);
  }
  function moveHeadingTo(headingId, targetIndex){
    var idx = state.headings.findIndex(function(h){ return h.id === headingId; });
    if(idx < 0) return;
    var h = state.headings.splice(idx, 1)[0];
    if(idx < targetIndex) targetIndex--;
    if(targetIndex < 0) targetIndex = 0;
    if(targetIndex > state.headings.length) targetIndex = state.headings.length;
    state.headings.splice(targetIndex, 0, h);
  }

  // Deleting a task from the live list is a *soft* delete: it stays right where it is
  // in container.tasks (so restoring it needs no bookkeeping about where it came from)
  // but gets flagged deletedAt, which every visible/archived task list filters out.
  // The Recycle Bin view lists every deletedAt task across the whole board. This is
  // deliberately separate from permanentlyDeleteTask below, which is the one truly
  // irreversible action (used by the Recycle Bin's own "Delete forever", and by the
  // Archive panel's "Delete permanently" — both already said permanent, so neither of
  // those should route through the recycle bin instead of actually deleting).
  function trashTask(container, task){
    deleteRemoteEventBestEffort(task).then(function(){
      var hadCalendarEvent = !!task.calendarEventId;
      if(hadCalendarEvent) task.calendarEventId = null; // the remote event is already gone — recreate it below if restored while still due
      task.deletedAt = new Date().toISOString();
      scheduleSave(); render();
      showUndoToast("Task deleted", function(){
        task.deletedAt = null;
        scheduleSave(); render();
        if(task.due) syncTaskToCalendar(task);
      });
    });
  }
  function restoreTrashedTask(entry){
    entry.task.deletedAt = null;
    scheduleSave();
    render();
    if(entry.task.due) syncTaskToCalendar(entry.task);
  }
  function permanentlyDeleteTask(container, task){
    openConfirm({
      title: "Delete “" + task.text + "” permanently?",
      body: "This can't be undone — it won't be in the recycle bin.",
      confirmLabel: "Delete forever", danger: true,
      onConfirm: function(){
        deleteRemoteEventBestEffort(task).then(function(){
          var idx = container.tasks.findIndex(function(t){ return t.id === task.id; });
          if(idx < 0) return;
          container.tasks.splice(idx, 1);
          scheduleSave(); render();
        });
      }
    });
  }
  function collectTrashedTasks(){
    var out = [];
    forEachTask(function(t, h, sh){
      if(t.deletedAt) out.push({ task: t, container: sh || h, heading: h, sub: sh });
    });
    out.sort(function(a, b){ return (b.task.deletedAt || "").localeCompare(a.task.deletedAt || ""); });
    return out;
  }

  function formatTimeOfDay(hhmm){
    var parts = hhmm.split(":");
    var t = new Date(2000,0,1, parseInt(parts[0],10), parseInt(parts[1],10));
    return t.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  }
  function formatDue(due){
    if(!due) return "";
    var d = new Date(due.date + "T00:00:00");
    var label = d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
    if(!due.allDay && due.time){
      label += " · " + formatTimeOfDay(due.time);

  function ensureIcsEvents(force){
    if(!config || !icsFeeds.length) return;
    if(icsEventsLoading) return;
    if(!force && icsEventsFetchedAt && (Date.now() - icsEventsFetchedAt) < 5*60*1000) return;
    icsEventsLoading = true; icsEventsError = null;
    ghGet(cfgFor(ICS_EVENTS_PATH)).then(function(res){
      if(res.exists && res.data){

        icsEvents = []; icsEventsMeta = null;
      }
      icsEventsFetchedAt = Date.now();

      icsEventsError = (err && err.message) || "Couldn't load external calendar events.";

  function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function addMonthsCal(d, n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
  function addDaysCal(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function mondayOfWeek(d){ var r = new Date(d); var day = (r.getDay()+6)%7; r.setDate(r.getDate()-day); return r; }
  function sameDateCal(a, b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function formatTimeShort(timeStr){
    if(!timeStr) return "";
    var parts = timeStr.split(":");
    var t = new Date(2000,0,1, parseInt(parts[0],10), parseInt(parts[1],10));
    return t.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  }

  function calendarDisplayIds(){
    var ids = [];
    if(state.googleCalendarId) ids.push(state.googleCalendarId);
    (state.googleDisplayCalendarIds || []).forEach(function(id){ if(id && ids.indexOf(id) === -1) ids.push(id); });
    return ids;
  }
  function getCalendarMeta(calId){
    var c = gcalCalendars.filter(function(x){ return x.id === calId; })[0];
    return { name: c ? (c.summary || c.id).trim() : calId, color: (c && c.backgroundColor) || null };
  }

  function fetchCalRangeEvents(startDate, endDateExclusive){
    var calIds = calendarDisplayIds();
    var key = gcalStatus + "|" + calIds.slice().sort().join(",") + "|" + dateKey(startDate) + "_" + dateKey(endDateExclusive);
    if(gcalStatus !== "connected" || !calIds.length){
      calEvents = []; calEventsKey = key; calEventsError = null;
      return;
    }
    if(calEventsKey === key || calEventsLoading) return;
    calEventsLoading = true; calEventsError = null;
    var timeMinQ = encodeURIComponent(startDate.toISOString());
    var timeMaxQ = encodeURIComponent(endDateExclusive.toISOString());
    Promise.all(calIds.map(function(calId){
      var url = "calendars/" + encodeURIComponent(calId) + "/events?singleEvents=true&orderBy=startTime&maxResults=250" +
        "&timeMin=" + timeMinQ + "&timeMax=" + timeMaxQ;
      return gcalFetch(url).then(function(res){
        if(!res.ok) return res.json().then(function(j){ throw new Error((j && j.error && j.error.message) || "Couldn't load calendar events."); });
        return res.json();
      }).then(function(json){
        return (json.items || []).filter(function(e){ return e.status !== "cancelled"; }).map(function(e){
          var copy = {}; for(var k2 in e){ copy[k2] = e[k2]; }
          copy._calId = calId;
          return copy;
        });
      });
    })).then(function(perCalendar){
      var merged = [];
      perCalendar.forEach(function(arr){ merged = merged.concat(arr); });
      calEvents = merged;
      calEventsKey = key;
    }).catch(function(err){
      calEventsError = err.message || "Couldn't load calendar events.";
    }).then(function(){
      calEventsLoading = false;
      if(viewMode === "cal") renderCalendar();
    });
  }

  function buildDayIndex(startDate, numDays){
    var idx = {};
    for(var i=0;i<numDays;i++){ idx[dateKey(addDaysCal(startDate,i))] = { tasks: [], events: [], ics: [] }; }
    var linkedIds = {};
    forEachTask(function(t){ if(t.calendarEventId) linkedIds[t.calendarEventId] = true; });
    forEachTask(function(t, h){
      if(!t.due) return;
      var k = t.due.date;
      if(idx[k]) idx[k].tasks.push({ task: t, heading: h });
    });
    calEvents.forEach(function(ev){
      if(ev._calId === state.googleCalendarId && linkedIds[ev.id]) return;
      var due = eventToDue(ev);
      if(!due) return;
      var k = due.date;
      if(idx[k]) idx[k].events.push({ event: ev, due: due, calId: ev._calId });
    });
    icsEvents.forEach(function(ev){
      var k = ev.date;
      if(idx[k]) idx[k].ics.push({ event: ev, due: { date: ev.date, time: ev.time, allDay: ev.allDay }, feedId: ev.feedId });
    });
    return idx;
  }

  function itemSortKey(it){
    var due = it.type === "task" ? it.data.task.due : it.data.due;
    return (due && !due.allDay && due.time) ? due.time : "";
  }
  function dayItems(idx, k){
    var d = idx[k] || { tasks: [], events: [], ics: [] };
    var items = d.tasks.map(function(x){ return { type:"task", data:x }; })
      .concat(d.events.map(function(x){ return { type:"event", data:x }; }))
      .concat((d.ics || []).map(function(x){ return { type:"ics", data:x }; }));
    items.sort(function(a,b){ var ka=itemSortKey(a), kb=itemSortKey(b); return ka<kb?-1:(ka>kb?1:0); });
    return items;
  }

  function eventChipStyle(it){
    if(it.type === "ics"){
      var feed = getIcsFeed(it.data.feedId);
      return { cls: "other-cal", color: feed ? feed.color : null };

    var isPrimary = it.data.calId === state.googleCalendarId;
    if(isPrimary) return { cls: "ext-event", color: null };
    var meta = getCalendarMeta(it.data.calId);
    return { cls: "other-cal", color: meta.color };
  }
  function itemSourceName(it){
    if(it.type === "ics"){ var feed = getIcsFeed(it.data.feedId); return feed ? feed.name : "External"; }
    return getCalendarMeta(it.data.calId).name;
  }

  function renderCalChip(it){

      chip.textContent = ev.summary || "(untitled)";
      chip.title = chip.textContent + (style.cls === "other-cal" ? " · " + itemSourceName(it) : "");

  function renderCalWeekChip(it){

  function renderCalendarHead(root, title){
    var head = document.createElement("div");
    head.className = "cal-head";
    head.innerHTML =
      '<div class="cal-nav">' +
        '<button class="cal-nav-btn" id="cal-prev" aria-label="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></button>' +

      '</div>' +

  function renderCalendarMonth(root){
    var monthStart = startOfMonth(calAnchor);
    var gridStart = mondayOfWeek(monthStart);
    var totalDays = 42;
    var gridEnd = addDaysCal(gridStart, totalDays);
    fetchCalRangeEvents(gridStart, gridEnd);
    ensureIcsEvents();
    var title = monthStart.toLocaleDateString(undefined, {month:"long", year:"numeric"});
    renderCalendarHead(root, title);

    var idx = buildDayIndex(gridStart, totalDays);
    var today = new Date(); today.setHours(0,0,0,0);
    var grid = document.createElement("div"); grid.className = "cal-month-grid";
    var weekdayRow = document.createElement("div"); weekdayRow.className = "cal-weekday-row";
    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(d){ var s = document.createElement("span"); s.textContent = d; weekdayRow.appendChild(s); });
    grid.appendChild(weekdayRow);
    var body = document.createElement("div"); body.className = "cal-month-body";
    var dayDates = []; for(var i=0;i<totalDays;i++) dayDates.push(addDaysCal(gridStart, i));
    dayDates.forEach(function(d){
      var k = dateKey(d);
      var cell = document.createElement("div");
      cell.className = "cal-day-cell" + (d.getMonth() !== monthStart.getMonth() ? " outside" : "") + (sameDateCal(d, today) ? " today" : "");
      var num = document.createElement("span"); num.className = "cal-day-num"; num.textContent = d.getDate(); cell.appendChild(num);
      var items = dayItems(idx, k);
      var shown = items.slice(0, 3);
      shown.forEach(function(it){ cell.appendChild(renderCalChip(it)); });
      if(items.length > shown.length){
        var more = document.createElement("span"); more.className = "cal-more"; more.textContent = "+" + (items.length - shown.length) + " more"; cell.appendChild(more);
      }
      cell.addEventListener("click", function(e){ e.stopPropagation(); openQuickAdd(cell, k); });
      body.appendChild(cell);
    });
    grid.appendChild(body);
    root.appendChild(grid);
  }

  function renderCalendarWeek(root){
    var weekStart = mondayOfWeek(calAnchor);
    var weekEnd = addDaysCal(weekStart, 7);
    fetchCalRangeEvents(weekStart, weekEnd);
    ensureIcsEvents();
    var title = weekStart.toLocaleDateString(undefined, {month:"short", day:"numeric"}) + " – " + addDaysCal(weekStart,6).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
    renderCalendarHead(root, title);

    var idx = buildDayIndex(weekStart, 7);
    var today = new Date(); today.setHours(0,0,0,0);
    var grid = document.createElement("div"); grid.className = "cal-week-grid";
    var dayDates = []; for(var i=0;i<7;i++) dayDates.push(addDaysCal(weekStart, i));
    dayDates.forEach(function(d){

  function renderCalendar(){

  function addTaskWithDue(container, text, dateStr){
    var t = { id: uid(), text: text || "New task", done:false, due:{date:dateStr,time:null,endTime:null,allDay:true}, completedAt:null, calendarEventId:null, syncError:null };
    container.tasks.push(t);
    lastAddedId = t.id;
    scheduleSave();
    render();
    syncTaskToCalendar(t);
    return t;
  }

  function openQuickAdd(anchorEl, dateStr){
    var existing = document.querySelector(".quickadd-popover");
    if(existing){
      var wasSameDate = existing.getAttribute("data-date") === dateStr;
      existing.remove();
      if(wasSameDate) return;
    }
    closeAllPopovers();
    var pop = document.createElement("div");
    pop.className = "quickadd-popover";
    pop.setAttribute("data-date", dateStr);
    var dObj = new Date(dateStr + "T00:00:00");
    var label = dObj.toLocaleDateString(undefined, {weekday:"long", month:"long", day:"numeric"});
    var hasHeadings = state.headings.length > 0;
    pop.innerHTML =
      '<div class="qa-title">Add task — ' + escapeHtml(label) + '</div>' +
      '<input type="text" class="qa-text" placeholder="Task title" />' +
      '<select class="qa-heading">' +
        state.headings.map(function(h){ return '<option value="' + h.id + '">' + escapeHtml(h.title) + '</option>'; }).join("") +
        '<option value="__new__"' + (hasHeadings ? "" : " selected") + '>+ New heading…</option>' +
      '</select>' +
      '<input type="text" class="qa-new-heading" placeholder="New heading name"' + (hasHeadings ? " hidden" : "") + ' />' +
      '<div class="qa-actions"><button class="btn btn-sm btn-ghost" type="button" data-act="cancel">Cancel</button><button class="btn btn-sm btn-primary" type="button" data-act="add">Add</button></div>';
    document.body.appendChild(pop);
    var rect = anchorEl.getBoundingClientRect();
    var popRect = pop.getBoundingClientRect();
    var top = rect.bottom + 6;
    var left = rect.left;
    if(left + popRect.width > window.innerWidth - 8) left = window.innerWidth - popRect.width - 8;
    if(top + popRect.height > window.innerHeight - 8) top = rect.top - popRect.height - 6;
    pop.style.top = Math.max(8, top) + "px";
    pop.style.left = Math.max(8, left) + "px";
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    var textEl = pop.querySelector(".qa-text");
    var headingSel = pop.querySelector(".qa-heading");
    var newHeadingEl = pop.querySelector(".qa-new-heading");
    (hasHeadings ? textEl : newHeadingEl).focus();
    headingSel.addEventListener("change", function(){
      newHeadingEl.hidden = headingSel.value !== "__new__";
      if(!newHeadingEl.hidden) newHeadingEl.focus();
    });
    function submit(){
      var text = textEl.value.trim();
      if(!text){ textEl.focus(); return; }
      var headingId = headingSel.value;
      var heading;
      if(headingId === "__new__"){
        var newTitle = newHeadingEl.value.trim();
        if(!newTitle){ newHeadingEl.focus(); return; }
        heading = { id: uid(), title: newTitle, collapsed:false, color:null, tasks: [], subheadings: [], notesList:[], attachments:[] };
        state.headings.push(heading);
      } else {
        heading = state.headings.filter(function(h){ return h.id === headingId; })[0] || state.headings[0];
      }
      addTaskWithDue(heading, text, dateStr);
      pop.remove();
    }
    textEl.addEventListener("keydown", function(e){ if(e.key === "Enter") submit(); if(e.key === "Escape") pop.remove(); });
    newHeadingEl.addEventListener("keydown", function(e){ if(e.key === "Enter") submit(); if(e.key === "Escape") pop.remove(); });
    pop.querySelector('[data-act="add"]').addEventListener("click", submit);
    pop.querySelector('[data-act="cancel"]').addEventListener("click", function(){ pop.remove(); });
  }

  /* ---------------- quick capture ---------------- */
  /* ---------------- natural-language date parsing (Quick capture) ---------------- */
  var QC_WEEKDAY_PATTERN = "(?:sun|mon|tue|tues|wed|weds|thu|thur|thurs|fri|sat|sunday|monday|tuesday|wednesday|thursday|friday|saturday)";
  var QC_WEEKDAY_TO_INDEX = {
    sun:0, sunday:0, mon:1, monday:1, tue:2, tues:2, tuesday:2, wed:3, weds:3, wednesday:3,
    thu:4, thur:4, thurs:4, thursday:4, fri:5, friday:5, sat:6, saturday:6
  };
  var QC_MONTH_PATTERN = "(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)";
  var QC_MONTH_TO_INDEX = {
    jan:0,january:0, feb:1,february:1, mar:2,march:2, apr:3,april:3, may:4, jun:5,june:5,
    jul:6,july:6, aug:7,august:7, sep:8,sept:8,september:8, oct:9,october:9, nov:10,november:10, dec:11,december:11
  };
  function qcPad2(n){ return n < 10 ? "0" + n : "" + n; }
  function qcYmd(d){ return d.getFullYear() + "-" + qcPad2(d.getMonth()+1) + "-" + qcPad2(d.getDate()); }
  function qcDayOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  // Finds the first recognizable date phrase in text (checked most-specific-first so
  // e.g. an ISO date doesn't get shadowed by a looser pattern). Returns the matched
  // substring (so callers can strip it back out) plus the Date it resolves to, or
  // null if nothing in the line looks like a date.
  function qcParseDatePhrase(text, now){
    var today = qcDayOnly(now);
    var m = text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
    if(m){
      var dIso = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
      if(!isNaN(dIso.getTime())) return { match: m[0], date: dIso };
    }
    m = text.match(/\bin\s+(\d+)\s+day(?:s)?\b/i);
    if(m){ var d1 = new Date(today); d1.setDate(d1.getDate() + parseInt(m[1],10)); return { match: m[0], date: d1 }; }
    m = text.match(/\bin\s+(a|\d+)\s+week(?:s)?\b/i);
    if(m){ var n = (m[1].toLowerCase() === "a") ? 1 : parseInt(m[1],10); var d2 = new Date(today); d2.setDate(d2.getDate() + n*7); return { match: m[0], date: d2 }; }
    m = text.match(/\b(today|tonight)\b/i);
    if(m) return { match: m[0], date: new Date(today) };
    m = text.match(/\b(tomorrow|tmrw|tmr)\b/i);
    if(m){ var d3 = new Date(today); d3.setDate(d3.getDate()+1); return { match: m[0], date: d3 }; }
    var wdRe = new RegExp("\\b(next\\s+)?(" + QC_WEEKDAY_PATTERN + ")\\b", "i");
    m = text.match(wdRe);
    if(m){
      var hasNext = !!m[1];
      var idx = QC_WEEKDAY_TO_INDEX[m[2].toLowerCase()];
      var diff = (idx - today.getDay() + 7) % 7;
      if(hasNext) diff += 7;
      var d4 = new Date(today); d4.setDate(d4.getDate() + diff); return { match: m[0], date: d4 };
    }
    var mdRe = new RegExp("\\b(" + QC_MONTH_PATTERN + ")\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b", "i");
    m = text.match(mdRe);
    if(m){
      var monthIdx = QC_MONTH_TO_INDEX[m[1].toLowerCase()], day = parseInt(m[2],10), year = today.getFullYear();
      var d5 = new Date(year, monthIdx, day);
      if(d5 < today) d5 = new Date(year+1, monthIdx, day);
      return { match: m[0], date: d5 };
    }
    var dmRe = new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(" + QC_MONTH_PATTERN + ")\\.?\\b", "i");
    m = text.match(dmRe);
    if(m){
      var day2 = parseInt(m[1],10), monthIdx2 = QC_MONTH_TO_INDEX[m[2].toLowerCase()], year2 = today.getFullYear();
      var d6 = new Date(year2, monthIdx2, day2);
      if(d6 < today) d6 = new Date(year2+1, monthIdx2, day2);
      return { match: m[0], date: d6 };
    }
    m = text.match(/\b(\d{1,2})\/(\d{1,2})\b/);
    if(m){
      var mo = parseInt(m[1],10)-1, da = parseInt(m[2],10), year3 = today.getFullYear();
      var d7 = new Date(year3, mo, da);
      if(!isNaN(d7.getTime())){
        if(d7 < today) d7 = new Date(year3+1, mo, da);
        return { match: m[0], date: d7 };
      }
    }
    return null;
  }
  function qcParseTimePhrase(text){
    var m = text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
    if(m){
      var h = parseInt(m[1],10) % 12;
      if(/pm/i.test(m[3])) h += 12;
      var min = m[2] ? parseInt(m[2],10) : 0;
      return { match: m[0], hh: qcPad2(h), mm: qcPad2(min) };
    }
    m = text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if(m) return { match: m[0], hh: qcPad2(parseInt(m[1],10)), mm: m[2] };
    return null;
  }
  function qcCleanText(text){
    return text
      .replace(/\s+/g, " ")
      .replace(/\b(on|by|due|at|for)\s*$/i, "")
      .replace(/^\s*(on|by|due|at|for)\b/i, "")
      .replace(/[,;–—-]\s*$/, "")
      .replace(/^\s*[,;–—-]\s*/, "")
      .trim();
  }
  // Pulls a due date (and optional time) out of a Quick capture line, if it looks like
  // one is there — "Call dentist Friday 3pm" becomes text "Call dentist" plus a due
  // date. Lines with no recognizable date phrase come back untouched.
  function parseQuickCaptureLine(line, now){
    now = now || new Date();
    var working = line;
    var dateResult = qcParseDatePhrase(working, now);
    if(dateResult) working = working.replace(dateResult.match, " ");
    var timeResult = qcParseTimePhrase(working);
    if(timeResult) working = working.replace(timeResult.match, " ");
    var cleaned = line.trim();
    if(dateResult || timeResult){
      cleaned = qcCleanText(working);
      if(!cleaned) cleaned = line.trim();
    }
    var due = null;
    if(dateResult){
      due = { date: qcYmd(dateResult.date), time: timeResult ? (timeResult.hh + ":" + timeResult.mm) : null, endTime: null, allDay: !timeResult };
    } else if(timeResult){
      due = { date: qcYmd(qcDayOnly(now)), time: timeResult.hh + ":" + timeResult.mm, endTime: null, allDay: false };
    }
    return { text: cleaned, due: due };
  }

  // A quick way to get from the top of a long list to a heading further down without
  // scrolling past everything in between — lists every heading (and, indented under it,
  // every sub-heading) with a live task count, and jumps straight to it on click. Doesn't
  // touch collapsed state — a collapsed heading you jump to still just shows its bar, same
  // as scrolling to it by hand would.
  function outlineVisibleCount(tasks){ return tasks.filter(function(t){ return !t.archivedAt && !t.deletedAt; }).length; }
  function outlineGroupsHtml(){
    var groupsHtml = (state.headings || []).map(function(h){
      var total = outlineVisibleCount(h.tasks);
      h.subheadings.forEach(function(sh){ total += outlineVisibleCount(sh.tasks); });
      var hasSubs = h.subheadings.length > 0;
      var expanded = !!outlineGroupExpanded[h.id];
      // A heading with sub-headings gets its own chevron to fold its sub-heading list away
      // within the panel — separate from clicking the heading row itself, which still jumps
      // straight to it either way. Starts collapsed each time the panel opens, same spirit
      // as sub-headings collapsing by default in the main list.
      var toggleHtml = hasSubs
        ? '<button type="button" class="outline-group-toggle' + (expanded ? ' expanded' : '') + '" data-group-id="' + h.id + '" aria-label="' + (expanded ? 'Collapse' : 'Expand') + ' sub-headings for ' + escapeHtml(h.title) + '" title="' + (expanded ? 'Collapse' : 'Expand') + '">' +
            '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg>' +
          '</button>'
        : '<span class="outline-group-toggle-spacer"></span>';
      var subItemsHtml = (hasSubs && expanded) ? h.subheadings.map(function(sh){
        return '<button type="button" class="outline-item outline-sub-item" data-target-type="sub" data-target-id="' + sh.id + '">' +
          '<span class="outline-item-title">' + escapeHtml(sh.title) + '</span>' +
          '<span class="outline-item-count mono">' + outlineVisibleCount(sh.tasks) + '</span>' +
        '</button>';
      }).join("") : "";
      return '<div class="outline-group">' +
        '<div class="outline-item-row">' +
          toggleHtml +
          '<button type="button" class="outline-item" data-target-type="heading" data-target-id="' + h.id + '">' +
            '<span class="outline-item-dot"' + (h.color ? ' style="background:' + h.color + '"' : '') + '></span>' +
            '<span class="outline-item-title">' + escapeHtml(h.title) + '</span>' +
            '<span class="outline-item-count mono">' + total + '</span>' +
          '</button>' +
        '</div>' +
        subItemsHtml +
      '</div>';
    }).join("");
    return groupsHtml || '<p class="outline-empty">No headings yet.</p>';
  }
  function renderOutlineList(){
    var list = document.getElementById("outline-list");
    if(!list) return;
    list.innerHTML = outlineGroupsHtml();
    wireOutlineItemClicks(document.getElementById("outline-drawer"));
  }
  // Jump-to-heading side menu. Unlike most panels in this app it's a persistent drawer, not a
  // one-shot modal: clicking a heading scrolls to it and highlights it but leaves the drawer
  // open, so you can jump to several sections in a row without reopening it each time.
  function openOutlinePanel(){
    if(outlineDrawerOpen){ closeOutlinePanel(); return; }
    outlineDrawerOpen = true;
    outlineGroupExpanded = {}; // start every heading's sub-list collapsed on a fresh open
    var root = document.getElementById("modal-root");
    var backdrop = document.createElement("div");
    backdrop.className = "outline-drawer-backdrop";
    backdrop.id = "outline-drawer-backdrop";
    backdrop.addEventListener("click", function(){ closeOutlinePanel(); });

    var drawer = document.createElement("aside");
    drawer.className = "outline-drawer";
    drawer.id = "outline-drawer";
    drawer.setAttribute("role", "dialog");
    drawer.setAttribute("aria-modal", "false");
    drawer.setAttribute("aria-labelledby", "outline-title");
    drawer.innerHTML =
      '<div class="outline-drawer-header">' +
        '<h3 id="outline-title">Jump to heading</h3>' +
        '<button type="button" class="outline-drawer-close" id="outline-close-btn" aria-label="Close">&times;</button>' +
      '</div>' +
      '<div class="outline-list" id="outline-list">' + outlineGroupsHtml() + '</div>';
    drawer.addEventListener("click", function(e){ e.stopPropagation(); });

    // Sit below the sticky header rather than covering it, so the header — including the
    // Outline button itself, right there next to Theme — stays visible and clickable the
    // whole time the drawer is open, instead of getting hidden behind its own overlay.
    positionOutlineDrawerBelowHeader(backdrop, drawer);
    window.addEventListener("resize", onOutlineResize);

    root.appendChild(backdrop);
    root.appendChild(drawer);
    wireOutlineItemClicks(drawer);
    drawer.querySelector("#outline-close-btn").addEventListener("click", closeOutlinePanel);
    document.addEventListener("keydown", onOutlineKeydown);
    var btn = document.getElementById("outline-btn");
    if(btn) btn.classList.add("active");

    // Trigger the slide-in transition on the next frame rather than the same tick it was
    // inserted, so the browser actually animates from translateX(-100%) instead of skipping
    // straight to the open state.
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        backdrop.classList.add("open");
        drawer.classList.add("open");
      });
    });
  }
  function onOutlineKeydown(e){ if(e.key === "Escape") closeOutlinePanel(); }
  function positionOutlineDrawerBelowHeader(backdrop, drawer){
    var header = document.querySelector("header.top");
    var top = header ? header.getBoundingClientRect().bottom : 0;
    if(top < 0) top = 0; // header scrolled fully past view isn't expected (it's sticky), but guard anyway
    backdrop.style.top = top + "px";
    drawer.style.top = top + "px";
  }
  function onOutlineResize(){
    var backdrop = document.getElementById("outline-drawer-backdrop");
    var drawer = document.getElementById("outline-drawer");
    if(backdrop && drawer) positionOutlineDrawerBelowHeader(backdrop, drawer);
  }
  function closeOutlinePanel(){
    if(!outlineDrawerOpen) return;
    outlineDrawerOpen = false;
    document.removeEventListener("keydown", onOutlineKeydown);
    window.removeEventListener("resize", onOutlineResize);
    var btn = document.getElementById("outline-btn");
    if(btn) btn.classList.remove("active");
    var backdrop = document.getElementById("outline-drawer-backdrop");
    var drawer = document.getElementById("outline-drawer");
    if(backdrop) backdrop.parentNode.removeChild(backdrop);
    if(drawer) drawer.parentNode.removeChild(drawer);
  }
  // Since the drawer stays open while you keep working (rather than closing after one click),
  // its task counts need to stay live — this is called from render() and is a no-op unless
  // the drawer is actually open.
  function refreshOutlineDrawer(){
    if(!outlineDrawerOpen) return;
    renderOutlineList();
  }
  function wireOutlineItemClicks(drawer){
    drawer.querySelectorAll(".outline-item").forEach(function(btn){
      btn.addEventListener("click", function(){
        var isSub = btn.getAttribute("data-target-type") === "sub";
        var id = btn.getAttribute("data-target-id");
        var selector = isSub ? '.sub-block[data-sub-id="' + id + '"]' : '.heading-card[data-heading-id="' + id + '"]';
        var target = document.querySelector(selector);
        if(target){
          target.scrollIntoView({ behavior: "smooth", block: "start" });
          target.classList.add("outline-highlight");
          setTimeout(function(){ target.classList.remove("outline-highlight"); }, 1400);
        }
      });
    });
    drawer.querySelectorAll(".outline-group-toggle").forEach(function(btn){
      btn.addEventListener("click", function(){
        var id = btn.getAttribute("data-group-id");
        outlineGroupExpanded[id] = !outlineGroupExpanded[id];
        renderOutlineList();
      });
    });
  }
  function openQuickCapture(){
    var root = document.getElementById("modal-root");
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    function close(){ if(backdrop.parentNode) root.removeChild(backdrop); }
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
    var hasHeadings = state.headings.length > 0;
    backdrop.innerHTML =
      '<div class="modal-box" role="dialog" aria-modal="true"><h3>Quick capture</h3>' +
      '<p>Paste or type multiple lines — each non-empty line becomes its own task. Mention a date (like "Friday", "tomorrow 3pm", or "Aug 30") and Daybook picks it up as the due date automatically.</p>' +
      '<div class="field"><textarea id="qc-textarea" rows="8" placeholder="Buy milk&#10;Call dentist tomorrow 3pm&#10;Finish slides for Friday"></textarea></div>' +
      '<div class="field"><label for="qc-heading">Add to</label><select id="qc-heading">' +
        state.headings.map(function(h){ return '<option value="' + h.id + '">' + escapeHtml(h.title) + '</option>'; }).join("") +
        '<option value="__new__"' + (hasHeadings ? "" : " selected") + '>+ New heading…</option>' +
      '</select></div>' +
      '<div class="field" id="qc-new-heading-field"' + (hasHeadings ? " hidden" : "") + '><input type="text" id="qc-new-heading" placeholder="New heading name"></div>' +
      '<div id="qc-error" class="modal-error" hidden></div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="qc-cancel">Cancel</button><button class="btn btn-primary" id="qc-add">Add tasks</button></div>' +
      '</div>';
    root.appendChild(backdrop);

    var textarea = backdrop.querySelector("#qc-textarea");
    var headingSel = backdrop.querySelector("#qc-heading");
    var newHeadingField = backdrop.querySelector("#qc-new-heading-field");
    var newHeadingInput = backdrop.querySelector("#qc-new-heading");
    var errEl = backdrop.querySelector("#qc-error");
    textarea.focus();

    headingSel.addEventListener("change", function(){
      newHeadingField.hidden = headingSel.value !== "__new__";
      if(!newHeadingField.hidden) newHeadingInput.focus();
    });
    backdrop.querySelector("#qc-cancel").addEventListener("click", close);

    function submit(){
      errEl.hidden = true;
      var lines = textarea.value.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
      if(!lines.length){ errEl.textContent = "Add at least one line."; errEl.hidden = false; textarea.focus(); return; }
      var headingId = headingSel.value;
      var heading;
      if(headingId === "__new__"){
        var title = newHeadingInput.value.trim();
        if(!title){ errEl.textContent = "Name the new heading, or pick an existing one."; errEl.hidden = false; newHeadingInput.focus(); return; }
        heading = { id: uid(), title: title, collapsed:false, color:null, tasks: [], subheadings: [], notesList:[], attachments:[] };
        state.headings.push(heading);
      } else {
        heading = state.headings.filter(function(h){ return h.id === headingId; })[0];
        if(!heading){ errEl.textContent = "Pick a heading."; errEl.hidden = false; return; }
      }
      var now = new Date();
      var createdWithDue = [];
      lines.forEach(function(line){
        var parsed = parseQuickCaptureLine(line, now);
        var t = { id: uid(), text: parsed.text, done:false, due: parsed.due, completedAt:null, calendarEventId:null, syncError:null, notes:"", checklist:[], archivedAt:null, priority:null, tags:[], subtasks:[], attachments:[] };
        heading.tasks.push(t);
        if(parsed.due) createdWithDue.push(t);
      });
      scheduleSave();
      render();
      createdWithDue.forEach(function(t){ syncTaskToCalendar(t); });
      close();
    }
    backdrop.querySelector("#qc-add").addEventListener("click", submit);
    textarea.addEventListener("keydown", function(e){
      if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); submit(); }
      if(e.key === "Escape") close();
    });
  }

  function render(){
    if(!state) return;
    renderHeadings();
    renderEmptyState();
    refreshTagFilterButton();
    refreshPriorityFilterButton();
    refreshDueFilterButton();
    updateSearchStatus();
    if(viewMode === "today") renderTodayView();
    if(viewMode === "week") renderWeekView();
    if(viewMode === "stats") renderStats();
    if(viewMode === "cal") renderCalendar();
    if(viewMode === "trash") renderTrashView();
    refreshTrashTabLabel();
    refreshOutlineDrawer();
    checkReminders();
  }
  function refreshTrashTabLabel(){
    var tab = document.getElementById("tab-trash");
    if(!tab || !state) return;
    var n = collectTrashedTasks().length;
    tab.textContent = n ? "Trash (" + n + ")" : "Trash";
  }

  function renderEmptyState(){
    var root = document.getElementById("empty-state-root");
    if(state.headings.length > 0){ root.innerHTML = ""; return; }
    root.innerHTML =
      '<div class="empty-state">' +
        '<h2>Nothing here yet</h2>' +
        '<p>Start with a heading — like “Work” or “This week”. Add tasks straight under it, or add sub-headings first if you want another layer of grouping — both are optional.' +
        (config ? '' : ' Connect a GitHub repo from Settings so your list follows you across devices.') +
        '</p>' +
      '</div>';
  }

  function headingTaskCount(heading){
    var count = 0;
    heading.tasks.forEach(function(t){ if(!t.archivedAt && !t.deletedAt) count++; });
    heading.subheadings.forEach(function(sh){ sh.tasks.forEach(function(t){ if(!t.archivedAt && !t.deletedAt) count++; }); });
    return count;
  }

  function renderHeadingTabsBar(){
    var tabsRoot = document.getElementById("heading-tabs-root");
    tabsRoot.innerHTML = "";
    // The heading filter bar is available in all three layouts — Tabs and Status use it to
    // isolate one heading (or scope the board to it); in Stacked it just narrows the usual
    // stacked list down to one heading's card instead of showing every heading at once.
    if(!state.headings.length){ return; }
    // If the previously-selected heading was deleted, fall back to "All" rather than
    // silently rendering nothing.
    if(activeHeadingTabId !== null && !state.headings.some(function(h){ return h.id === activeHeadingTabId; })){
      activeHeadingTabId = null;
    }
    var bar = document.createElement("div");
    bar.className = "heading-tabs-bar";
    var allBtn = document.createElement("button");
    allBtn.type = "button";
    allBtn.className = "heading-tab-btn" + (activeHeadingTabId === null ? " active" : "");
    allBtn.textContent = "All";
    allBtn.addEventListener("click", function(){ activeHeadingTabId = null; render(); });
    bar.appendChild(allBtn);
    state.headings.forEach(function(heading){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "heading-tab-btn" + (activeHeadingTabId === heading.id ? " active" : "");
      if(heading.color) btn.style.setProperty("--tab-dot", heading.color);
      btn.innerHTML =
        (heading.color ? '<span class="heading-tab-dot" style="background:' + heading.color + '"></span>' : '') +
        '<span class="heading-tab-title">' + escapeHtml(heading.title) + '</span>' +
        '<span class="heading-tab-count mono">' + headingTaskCount(heading) + '</span>';
      btn.addEventListener("click", function(){ activeHeadingTabId = heading.id; render(); });
      bar.appendChild(btn);
    });
    tabsRoot.appendChild(bar);
  }

  function renderHeadings(){
    renderHeadingTabsBar();
    var root = document.getElementById("headings-root");
    root.innerHTML = "";

    if(listLayoutMode === "status"){
      // No headings at all is handled by the shared "Nothing here yet" empty state below
      // (renderEmptyState) — don't also show the board's own, narrower empty message on top of it.
      if(state.headings.length) renderStatusBoard(root, activeHeadingTabId);
      return;
    }

    var showAll = activeHeadingTabId === null;
    var headingsToShow = showAll ? state.headings : state.headings.filter(function(h){ return h.id === activeHeadingTabId; });
    headingsToShow.forEach(function(heading){ root.appendChild(renderHeadingCard(heading)); });
    // Reordering headings against each other only makes sense when every heading is
    // visible at once — skip the dropzone-end when a single tab is isolated.
    if(showAll){
      var endZone = document.createElement("div");
      endZone.className = "heading-dropzone-end";
      wireHeadingDropzoneEnd(endZone);
      root.appendChild(endZone);
    }
  }

  function renderHeadingCard(heading){
    var card = document.createElement("section");
    // A collapsed heading stays visually collapsed UNLESS a filter is active and it's the
    // only place a match is sitting — otherwise a search result you can't actually see is
    // worse than useless. This never touches heading.collapsed itself (still a normal saved
    // preference, and the collapse toggle button flips that real value, not this override).
    var forceExpanded = heading.collapsed && anyFilterActive() && headingHasFilterMatch(heading);
    card.className = "heading-card" + ((heading.collapsed && !forceExpanded) ? " collapsed" : "");
    card.setAttribute("data-heading-id", heading.id);
    if(heading.color) card.style.background = "color-mix(in srgb, " + heading.color + " 10%, var(--paper-raised))";
    var visibleHeadingTasks = heading.tasks.filter(function(t){ return !t.archivedAt && !t.deletedAt; });
    var archivedHeadingTasks = heading.tasks.filter(function(t){ return t.archivedAt && !t.deletedAt; });
    var totalTasks = visibleHeadingTasks.length, doneTasks = visibleHeadingTasks.filter(function(t){return t.done;}).length;
    heading.subheadings.forEach(function(sh){ sh.tasks.forEach(function(t){ if(t.archivedAt || t.deletedAt) return; totalTasks++; if(t.done) doneTasks++; }); });

    var bar = document.createElement("div");
    bar.className = "heading-bar";
    if(heading.color) bar.style.borderLeftColor = heading.color;
    bar.innerHTML =
      gripHtml() +
      '<button class="collapse-btn" aria-label="Toggle section" title="Collapse / expand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>' +
      '<button class="color-dot' + (heading.color ? '' : ' unset') + '" type="button" title="Heading color" aria-label="Choose heading color"' + (heading.color ? ' style="background:' + heading.color + '"' : '') + '></button>' +
      '<input class="heading-title" value="' + escapeHtml(heading.title) + '" aria-label="Heading title" />' +
      '<span class="heading-count mono">' + doneTasks + '/' + totalTasks + '</span>' +
      '<div class="heading-actions">' +

    // to a re-render triggered by something else while this field hasn't been blurred yet —
    // see isActivelyEditing() for the case this closes.
    titleInput.addEventListener("input", function(){ heading.title = titleInput.value; scheduleSave(); });

    // Notes live at the top of the collapsible body — right under the bar — always visible,
    // rather than appended after the task list or hidden behind a click like a task's own
    // notes editor, since bodyContent here can be long (tasks, sub-headings, add buttons)
    // and burying them at the bottom (or behind a toggle) would bury what you came to see.
    var headingNotesBlock = renderHeadingNotesBlock(heading, null);
    if(headingNotesBlock) bodyContent.appendChild(headingNotesBlock);

    bar.querySelector(".heading-notes-badge").addEventListener("click", function(){

    });
    bar.querySelector(".heading-attachments-badge").addEventListener("click", function(){

    });

    wireTaskListContainer(directList, heading);
    bodyContent.appendChild(directList);

    var addTaskBtn = document.createElement("button");
    addTaskBtn.className = "ghost-add";

    addTaskBtn.addEventListener("click", function(){
      var t = addTask(heading, "");

  /* ---------------- today view ---------------- */
  function renderTodayView(){
    var root = document.getElementById("today-view");
    if(!state){ root.innerHTML = ""; return; }
    root.innerHTML = "";
    var todayStr = todayDateStr();
    var overdue = [], dueToday = [], flagged = [];
    forEachTask(function(t, h, sub){
      if(t.done || t.archivedAt || t.deletedAt) return;
      var container = sub || h;
      if(t.due && t.due.date < todayStr){ overdue.push({ task:t, container:container, heading:h, sub:sub }); }
      else if(t.due && t.due.date === todayStr){ dueToday.push({ task:t, container:container, heading:h, sub:sub }); }
      else if(t.priority === "high"){ flagged.push({ task:t, container:container, heading:h, sub:sub }); }
    });

    if(!overdue.length && !dueToday.length && !flagged.length){
      root.innerHTML = '<div class="empty-state"><h2>All clear for today</h2><p>Nothing overdue, nothing due today, and nothing flagged as high priority.</p></div>';
      return;
    }

    [
      renderTodaySection("Overdue", overdue),
      renderTodaySection("Due today", dueToday),
      renderTodaySection("Flagged", flagged)
    ].forEach(function(section){ if(section) root.appendChild(section); });
  }

  function renderTodaySection(title, items){
    if(!items.length) return null; // skip empty sections entirely — no empty box left behind
    var section = document.createElement("section");
    section.className = "today-section";
    var head = document.createElement("div");
    head.className = "today-section-head";
    head.innerHTML = '<h2 class="today-section-title">' + escapeHtml(title) + '</h2><span class="today-section-count mono">' + items.length + '</span>';

    list.className = "task-list today-task-list";
