          '<span class="theme-swatch"><span style="background:' + vals.accent + '"></span><span style="background:' + vals.accent2 + '"></span></span>' +
          '<span>' + escapeHtml(p.name) + '</span>' +
        '</button>';
      }).join("");
    Object.keys(FONT_PACKAGES).forEach(function(key){ ensureFontLoaded(key); }); // so every sample below previews in its real typeface
    var fontRow =
      '<div class="theme-section-label">Font</div>' +
      '<div class="theme-font-list">' + Object.keys(FONT_PACKAGES).map(function(key){
        var f = FONT_PACKAGES[key];
        return '<button class="theme-font-option' + (key === currentFontKey ? " active" : "") + '" type="button" data-font-key="' + key + '">' +
          '<span class="theme-font-sample" style="font-family:' + escapeHtml(f.heading) + '">' + escapeHtml(f.sample) + '</span>' +
          '<span class="theme-font-label">' + escapeHtml(f.name) + '</span>' +
        '</button>';
      }).join("") + '</div>';
    pop.innerHTML = appearanceRow + paletteRow + fontRow;
    document.body.appendChild(pop);
    var rect = anchorEl.getBoundingClientRect();
    pop.style.top = (rect.bottom + 6) + "px";

  function ensureIcsEvents(force){
    if(!config || !icsFeeds.length) return;
    if(icsEventsLoading) return;
    if(!force && icsEventsFetchedAt && (Date.now() - icsEventsFetchedAt) < 5*60*1000) return;
    icsEventsLoading = true; icsEventsError = null;
    ghGet(cfgFor(ICS_EVENTS_PATH)).then(function(res){
      if(res.exists && res.data){
        icsEvents = Array.isArray(res.data.events) ? res.data.events : [];
        icsEventsMeta = { generatedAt: res.data.generatedAt || null, feeds: res.data.feeds || [] };
      } else {
        icsEvents = []; icsEventsMeta = null;
      }
      icsEventsFetchedAt = Date.now();
    }).catch(function(err){
      icsEventsError = (err && err.message) || "Couldn't load external calendar events.";
    }).then(function(){
      icsEventsLoading = false;
      if(viewMode === "cal") renderCalendar();
    });
  }

  function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function addMonthsCal(d, n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
  function addDaysCal(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function mondayOfWeek(d){ var r = new Date(d); var day = (r.getDay()+6)%7; r.setDate(r.getDate()-day); return r; }
  function sameDateCal(a, b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function formatTimeShort(timeStr){
    if(!timeStr) return "";
    var parts = timeStr.split(":");
    var t = new Date(2000,0,1, parseInt(parts[0],10), parseInt(parts[1],10));
    return t.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  }

  function calendarDisplayIds(){
    var ids = [];
    if(state.googleCalendarId) ids.push(state.googleCalendarId);
    (state.googleDisplayCalendarIds || []).forEach(function(id){ if(id && ids.indexOf(id) === -1) ids.push(id); });
    return ids;
  }
  function getCalendarMeta(calId){
    var c = gcalCalendars.filter(function(x){ return x.id === calId; })[0];
    return { name: c ? (c.summary || c.id).trim() : calId, color: (c && c.backgroundColor) || null };
  }

  function fetchCalRangeEvents(startDate, endDateExclusive){
    var calIds = calendarDisplayIds();
    var key = gcalStatus + "|" + calIds.slice().sort().join(",") + "|" + dateKey(startDate) + "_" + dateKey(endDateExclusive);
    if(gcalStatus !== "connected" || !calIds.length){
      calEvents = []; calEventsKey = key; calEventsError = null;
      return;
    }
    if(calEventsKey === key || calEventsLoading) return;
    calEventsLoading = true; calEventsError = null;
    var timeMinQ = encodeURIComponent(startDate.toISOString());
    var timeMaxQ = encodeURIComponent(endDateExclusive.toISOString());
    Promise.all(calIds.map(function(calId){
      var url = "calendars/" + encodeURIComponent(calId) + "/events?singleEvents=true&orderBy=startTime&maxResults=250" +
        "&timeMin=" + timeMinQ + "&timeMax=" + timeMaxQ;
      return gcalFetch(url).then(function(res){
        if(!res.ok) return res.json().then(function(j){ throw new Error((j && j.error && j.error.message) || "Couldn't load calendar events."); });
        return res.json();
      }).then(function(json){
        return (json.items || []).filter(function(e){ return e.status !== "cancelled"; }).map(function(e){
          var copy = {}; for(var k2 in e){ copy[k2] = e[k2]; }
          copy._calId = calId;
          return copy;
        });
      });
    })).then(function(perCalendar){
      var merged = [];
      perCalendar.forEach(function(arr){ merged = merged.concat(arr); });
      calEvents = merged;
      calEventsKey = key;
    }).catch(function(err){
      calEventsError = err.message || "Couldn't load calendar events.";
    }).then(function(){
      calEventsLoading = false;
      if(viewMode === "cal") renderCalendar();
    });
  }

  function buildDayIndex(startDate, numDays){
    var idx = {};
    for(var i=0;i<numDays;i++){ idx[dateKey(addDaysCal(startDate,i))] = { tasks: [], events: [], ics: [] }; }
    var linkedIds = {};
    forEachTask(function(t){ if(t.calendarEventId) linkedIds[t.calendarEventId] = true; });
    forEachTask(function(t, h){
      if(!t.due) return;
      var k = t.due.date;
      if(idx[k]) idx[k].tasks.push({ task: t, heading: h });
    });
    calEvents.forEach(function(ev){
      if(ev._calId === state.googleCalendarId && linkedIds[ev.id]) return;
      var due = eventToDue(ev);
      if(!due) return;
      var k = due.date;
      if(idx[k]) idx[k].events.push({ event: ev, due: due, calId: ev._calId });
    });
    icsEvents.forEach(function(ev){
      var k = ev.date;
      if(idx[k]) idx[k].ics.push({ event: ev, due: { date: ev.date, time: ev.time, allDay: ev.allDay }, feedId: ev.feedId });
    });
    return idx;
  }

  function itemSortKey(it){
    var due = it.type === "task" ? it.data.task.due : it.data.due;
    return (due && !due.allDay && due.time) ? due.time : "";
  }
  function dayItems(idx, k){
    var d = idx[k] || { tasks: [], events: [], ics: [] };
    var items = d.tasks.map(function(x){ return { type:"task", data:x }; })
      .concat(d.events.map(function(x){ return { type:"event", data:x }; }))
      .concat((d.ics || []).map(function(x){ return { type:"ics", data:x }; }));
    items.sort(function(a,b){ var ka=itemSortKey(a), kb=itemSortKey(b); return ka<kb?-1:(ka>kb?1:0); });
    return items;
  }

  function eventChipStyle(it){
    if(it.type === "ics"){
      var feed = getIcsFeed(it.data.feedId);
      return { cls: "other-cal", color: feed ? feed.color : null };

    var isPrimary = it.data.calId === state.googleCalendarId;
    if(isPrimary) return { cls: "ext-event", color: null };
    var meta = getCalendarMeta(it.data.calId);
    return { cls: "other-cal", color: meta.color };
  }
  function itemSourceName(it){
    if(it.type === "ics"){ var feed = getIcsFeed(it.data.feedId); return feed ? feed.name : "External"; }
    return getCalendarMeta(it.data.calId).name;
  }

  function renderCalChip(it){

  function renderCalendarHead(root, title){
    var head = document.createElement("div");

    head.innerHTML =
      '<div class="cal-nav">' +
        '<button class="cal-nav-btn" id="cal-prev" aria-label="Previous"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg></button>' +

    head.querySelector("#cal-next").addEventListener("click", function(){ calAnchor = calMode==="month" ? addMonthsCal(calAnchor,1) : addDaysCal(calAnchor,7); renderCalendar(); });
    head.querySelector("#cal-today").addEventListener("click", function(){ calAnchor = new Date(); calAnchor.setHours(0,0,0,0); renderCalendar(); });
    head.querySelector("#cal-mode-month").addEventListener("click", function(){ calMode = "month"; renderCalendar(); });

  function renderCalendarMonth(root){
    var monthStart = startOfMonth(calAnchor);
    var gridStart = mondayOfWeek(monthStart);
    var totalDays = 42;
    var gridEnd = addDaysCal(gridStart, totalDays);
    fetchCalRangeEvents(gridStart, gridEnd);
    ensureIcsEvents();
    var title = monthStart.toLocaleDateString(undefined, {month:"long", year:"numeric"});
    renderCalendarHead(root, title);

    var idx = buildDayIndex(gridStart, totalDays);
    var today = new Date(); today.setHours(0,0,0,0);
    var grid = document.createElement("div"); grid.className = "cal-month-grid";
    var weekdayRow = document.createElement("div"); weekdayRow.className = "cal-weekday-row";
    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(d){ var s = document.createElement("span"); s.textContent = d; weekdayRow.appendChild(s); });
    grid.appendChild(weekdayRow);
    var body = document.createElement("div"); body.className = "cal-month-body";
    var dayDates = []; for(var i=0;i<totalDays;i++) dayDates.push(addDaysCal(gridStart, i));
    dayDates.forEach(function(d){
      var k = dateKey(d);
      var cell = document.createElement("div");
      cell.className = "cal-day-cell" + (d.getMonth() !== monthStart.getMonth() ? " outside" : "") + (sameDateCal(d, today) ? " today" : "");
      var num = document.createElement("span"); num.className = "cal-day-num"; num.textContent = d.getDate(); cell.appendChild(num);
      var items = dayItems(idx, k);
      var shown = items.slice(0, 3);
      shown.forEach(function(it){ cell.appendChild(renderCalChip(it)); });
      if(items.length > shown.length){
        var more = document.createElement("span"); more.className = "cal-more"; more.textContent = "+" + (items.length - shown.length) + " more"; cell.appendChild(more);
      }
      cell.addEventListener("click", function(e){ e.stopPropagation(); openQuickAdd(cell, k); });
      body.appendChild(cell);
    });
    grid.appendChild(body);
    root.appendChild(grid);
  }

  function renderCalendarWeek(root){
    var weekStart = mondayOfWeek(calAnchor);
    var weekEnd = addDaysCal(weekStart, 7);
    fetchCalRangeEvents(weekStart, weekEnd);
    ensureIcsEvents();

  /* ---------------- quick capture ---------------- */
  /* ---------------- natural-language date parsing (Quick capture) ---------------- */
  var QC_WEEKDAY_PATTERN = "(?:sun|mon|tue|tues|wed|weds|thu|thur|thurs|fri|sat|sunday|monday|tuesday|wednesday|thursday|friday|saturday)";
  var QC_WEEKDAY_TO_INDEX = {
    sun:0, sunday:0, mon:1, monday:1, tue:2, tues:2, tuesday:2, wed:3, weds:3, wednesday:3,
    thu:4, thur:4, thurs:4, thursday:4, fri:5, friday:5, sat:6, saturday:6
  };
  var QC_MONTH_PATTERN = "(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|jun(?:e)?|jul(?:y)?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)";
  var QC_MONTH_TO_INDEX = {
    jan:0,january:0, feb:1,february:1, mar:2,march:2, apr:3,april:3, may:4, jun:5,june:5,
    jul:6,july:6, aug:7,august:7, sep:8,sept:8,september:8, oct:9,october:9, nov:10,november:10, dec:11,december:11
  };
  function qcPad2(n){ return n < 10 ? "0" + n : "" + n; }
  function qcYmd(d){ return d.getFullYear() + "-" + qcPad2(d.getMonth()+1) + "-" + qcPad2(d.getDate()); }
  function qcDayOnly(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

  // Finds the first recognizable date phrase in text (checked most-specific-first so
  // e.g. an ISO date doesn't get shadowed by a looser pattern). Returns the matched
  // substring (so callers can strip it back out) plus the Date it resolves to, or
  // null if nothing in the line looks like a date.
  function qcParseDatePhrase(text, now){
    var today = qcDayOnly(now);
    var m = text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
    if(m){
      var dIso = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
      if(!isNaN(dIso.getTime())) return { match: m[0], date: dIso };
    }
    m = text.match(/\bin\s+(\d+)\s+day(?:s)?\b/i);
    if(m){ var d1 = new Date(today); d1.setDate(d1.getDate() + parseInt(m[1],10)); return { match: m[0], date: d1 }; }
    m = text.match(/\bin\s+(a|\d+)\s+week(?:s)?\b/i);
    if(m){ var n = (m[1].toLowerCase() === "a") ? 1 : parseInt(m[1],10); var d2 = new Date(today); d2.setDate(d2.getDate() + n*7); return { match: m[0], date: d2 }; }
    m = text.match(/\b(today|tonight)\b/i);
    if(m) return { match: m[0], date: new Date(today) };
    m = text.match(/\b(tomorrow|tmrw|tmr)\b/i);
    if(m){ var d3 = new Date(today); d3.setDate(d3.getDate()+1); return { match: m[0], date: d3 }; }
    var wdRe = new RegExp("\\b(next\\s+)?(" + QC_WEEKDAY_PATTERN + ")\\b", "i");
    m = text.match(wdRe);
    if(m){
      var hasNext = !!m[1];
      var idx = QC_WEEKDAY_TO_INDEX[m[2].toLowerCase()];
      var diff = (idx - today.getDay() + 7) % 7;
      if(hasNext) diff += 7;
      var d4 = new Date(today); d4.setDate(d4.getDate() + diff); return { match: m[0], date: d4 };
    }
    var mdRe = new RegExp("\\b(" + QC_MONTH_PATTERN + ")\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?\\b", "i");
    m = text.match(mdRe);
    if(m){
      var monthIdx = QC_MONTH_TO_INDEX[m[1].toLowerCase()], day = parseInt(m[2],10), year = today.getFullYear();
      var d5 = new Date(year, monthIdx, day);
      if(d5 < today) d5 = new Date(year+1, monthIdx, day);
      return { match: m[0], date: d5 };
    }
    var dmRe = new RegExp("\\b(\\d{1,2})(?:st|nd|rd|th)?\\s+(" + QC_MONTH_PATTERN + ")\\.?\\b", "i");
    m = text.match(dmRe);
    if(m){
      var day2 = parseInt(m[1],10), monthIdx2 = QC_MONTH_TO_INDEX[m[2].toLowerCase()], year2 = today.getFullYear();
      var d6 = new Date(year2, monthIdx2, day2);
      if(d6 < today) d6 = new Date(year2+1, monthIdx2, day2);
      return { match: m[0], date: d6 };
    }
    m = text.match(/\b(\d{1,2})\/(\d{1,2})\b/);
    if(m){
      var mo = parseInt(m[1],10)-1, da = parseInt(m[2],10), year3 = today.getFullYear();
      var d7 = new Date(year3, mo, da);
      if(!isNaN(d7.getTime())){
        if(d7 < today) d7 = new Date(year3+1, mo, da);
        return { match: m[0], date: d7 };
      }
    }
    return null;
  }
  function qcParseTimePhrase(text){
    var m = text.match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
    if(m){
      var h = parseInt(m[1],10) % 12;
      if(/pm/i.test(m[3])) h += 12;
      var min = m[2] ? parseInt(m[2],10) : 0;
      return { match: m[0], hh: qcPad2(h), mm: qcPad2(min) };
    }
    m = text.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/);
    if(m) return { match: m[0], hh: qcPad2(parseInt(m[1],10)), mm: m[2] };
    return null;
  }
  function qcCleanText(text){
    return text
      .replace(/\s+/g, " ")
      .replace(/\b(on|by|due|at|for)\s*$/i, "")
      .replace(/^\s*(on|by|due|at|for)\b/i, "")
      .replace(/[,;–—-]\s*$/, "")
      .replace(/^\s*[,;–—-]\s*/, "")
      .trim();
  }
  // Pulls a due date (and optional time) out of a Quick capture line, if it looks like
  // one is there — "Call dentist Friday 3pm" becomes text "Call dentist" plus a due
  // date. Lines with no recognizable date phrase come back untouched.
  function parseQuickCaptureLine(line, now){
    now = now || new Date();
    var working = line;
    var dateResult = qcParseDatePhrase(working, now);
    if(dateResult) working = working.replace(dateResult.match, " ");
    var timeResult = qcParseTimePhrase(working);
    if(timeResult) working = working.replace(timeResult.match, " ");
    var cleaned = line.trim();
    if(dateResult || timeResult){
      cleaned = qcCleanText(working);
      if(!cleaned) cleaned = line.trim();
    }
    var due = null;
    if(dateResult){
      due = { date: qcYmd(dateResult.date), time: timeResult ? (timeResult.hh + ":" + timeResult.mm) : null, endTime: null, allDay: !timeResult };
    } else if(timeResult){
      due = { date: qcYmd(qcDayOnly(now)), time: timeResult.hh + ":" + timeResult.mm, endTime: null, allDay: false };
    }
    return { text: cleaned, due: due };
  }

  function openQuickCapture(){
    var root = document.getElementById("modal-root");
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    function close(){ if(backdrop.parentNode) root.removeChild(backdrop); }
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
    var hasHeadings = state.headings.length > 0;
    backdrop.innerHTML =
      '<div class="modal-box" role="dialog" aria-modal="true"><h3>Quick capture</h3>' +
      '<p>Paste or type multiple lines — each non-empty line becomes its own task. Mention a date (like "Friday", "tomorrow 3pm", or "Aug 30") and Daybook picks it up as the due date automatically.</p>' +
      '<div class="field"><textarea id="qc-textarea" rows="8" placeholder="Buy milk&#10;Call dentist tomorrow 3pm&#10;Finish slides for Friday"></textarea></div>' +
      '<div class="field"><label for="qc-heading">Add to</label><select id="qc-heading">' +
        state.headings.map(function(h){ return '<option value="' + h.id + '">' + escapeHtml(h.title) + '</option>'; }).join("") +
        '<option value="__new__"' + (hasHeadings ? "" : " selected") + '>+ New heading…</option>' +
      '</select></div>' +
      '<div class="field" id="qc-new-heading-field"' + (hasHeadings ? " hidden" : "") + '><input type="text" id="qc-new-heading" placeholder="New heading name"></div>' +
      '<div id="qc-error" class="modal-error" hidden></div>' +
      '<div class="modal-actions"><button class="btn btn-ghost" id="qc-cancel">Cancel</button><button class="btn btn-primary" id="qc-add">Add tasks</button></div>' +
      '</div>';
    root.appendChild(backdrop);

    var textarea = backdrop.querySelector("#qc-textarea");
    var headingSel = backdrop.querySelector("#qc-heading");
    var newHeadingField = backdrop.querySelector("#qc-new-heading-field");
    var newHeadingInput = backdrop.querySelector("#qc-new-heading");
    var errEl = backdrop.querySelector("#qc-error");
    textarea.focus();

    headingSel.addEventListener("change", function(){
      newHeadingField.hidden = headingSel.value !== "__new__";
      if(!newHeadingField.hidden) newHeadingInput.focus();
    });
    backdrop.querySelector("#qc-cancel").addEventListener("click", close);

    function submit(){
      errEl.hidden = true;
      var lines = textarea.value.split("\n").map(function(l){ return l.trim(); }).filter(Boolean);
      if(!lines.length){ errEl.textContent = "Add at least one line."; errEl.hidden = false; textarea.focus(); return; }
      var headingId = headingSel.value;
      var heading;
      if(headingId === "__new__"){
        var title = newHeadingInput.value.trim();
        if(!title){ errEl.textContent = "Name the new heading, or pick an existing one."; errEl.hidden = false; newHeadingInput.focus(); return; }
        heading = { id: uid(), title: title, collapsed:false, color:null, tasks: [], subheadings: [] };
        state.headings.push(heading);
      } else {
        heading = state.headings.filter(function(h){ return h.id === headingId; })[0];
        if(!heading){ errEl.textContent = "Pick a heading."; errEl.hidden = false; return; }
      }
      var now = new Date();
      var createdWithDue = [];
      lines.forEach(function(line){
        var parsed = parseQuickCaptureLine(line, now);
        var t = { id: uid(), text: parsed.text, done:false, due: parsed.due, completedAt:null, calendarEventId:null, syncError:null, notes:"", checklist:[], archivedAt:null, priority:null, tags:[], subtasks:[] };
        heading.tasks.push(t);
        if(parsed.due) createdWithDue.push(t);
      });
      scheduleSave();
      render();
      createdWithDue.forEach(function(t){ syncTaskToCalendar(t); });
      close();
    }
    backdrop.querySelector("#qc-add").addEventListener("click", submit);
    textarea.addEventListener("keydown", function(e){
      if(e.key === "Enter" && (e.metaKey || e.ctrlKey)){ e.preventDefault(); submit(); }
      if(e.key === "Escape") close();
    });
  }

  function renderHeadings(){

  function renderHeadingCard(heading){
    var card = document.createElement("section");

    if(heading.color) card.style.background = "color-mix(in srgb, " + heading.color + " 10%, var(--paper-raised))";
    var visibleHeadingTasks = heading.tasks.filter(function(t){ return !t.archivedAt; });
    var archivedHeadingTasks = heading.tasks.filter(function(t){ return t.archivedAt; });
    var totalTasks = visibleHeadingTasks.length, doneTasks = visibleHeadingTasks.filter(function(t){return t.done;}).length;
    heading.subheadings.forEach(function(sh){ sh.tasks.forEach(function(t){ if(t.archivedAt) return; totalTasks++; if(t.done) doneTasks++; }); });

    var bar = document.createElement("div");
    bar.className = "heading-bar";
    if(heading.color) bar.style.borderLeftColor = heading.color;
    bar.innerHTML =
      gripHtml() +
      '<button class="collapse-btn" aria-label="Toggle section" title="Collapse / expand"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></button>' +
      '<button class="color-dot" type="button" title="Heading color" aria-label="Choose heading color" style="background:' + (heading.color || "var(--accent)") + '"></button>' +
      '<input class="heading-title" value="' + escapeHtml(heading.title) + '" aria-label="Heading title" />' +
      '<span class="heading-count mono">' + doneTasks + '/' + totalTasks + '</span>' +

    card.appendChild(bar);

    wireDragSource(bar.querySelector(".grip"), "heading", heading.id, card);
    wireHeadingBar(bar, heading);
    wireColorDot(bar.querySelector(".color-dot"), bar, heading);

    bar.querySelector(".collapse-btn").addEventListener("click", function(){ heading.collapsed = !heading.collapsed; scheduleSave(); render(); });
    var titleInput = bar.querySelector(".heading-title");
    titleInput.addEventListener("change", function(){ heading.title = titleInput.value.trim() || "Untitled"; scheduleSave(); });
    titleInput.addEventListener("keydown", function(e){ if(e.key === "Enter") titleInput.blur(); });
    bar.querySelector(".icon-btn.danger").addEventListener("click", function(){ removeHeading(heading); });

    var body = document.createElement("div");

    var directList = document.createElement("div");

    sortedTaskList(visibleHeadingTasks.filter(taskPassesTagFilter)).forEach(function(task){ directList.appendChild(renderTaskRow(heading, task)); });
    wireTaskListContainer(directList, heading);
    bodyContent.appendChild(directList);

    var addTaskBtn = document.createElement("button");
    addTaskBtn.className = "ghost-add";
    addTaskBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> Add task';
    addTaskBtn.addEventListener("click", function(){
      var t = addTask(heading, "");
      requestAnimationFrame(function(){ var el = document.querySelector('[data-task-id="' + t.id + '"] .task-text'); if(el){ el.focus(); el.select(); } });
    });
    bodyContent.appendChild(addTaskBtn);

    bodyContent.appendChild(renderArchiveToggle(heading, archivedHeadingTasks));

    heading.subheadings.forEach(function(sub){ bodyContent.appendChild(renderSubBlock(heading, sub)); });

    var subEndZone = document.createElement("div");
    subEndZone.className = "sub-dropzone-end";
    wireSubDropzoneEnd(subEndZone, heading);
    bodyContent.appendChild(subEndZone);

    var addSub = document.createElement("button");
    addSub.className = "ghost-add";
    addSub.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> Add sub-heading';
    addSub.addEventListener("click", function(){ addSubheading(heading, "New sub-heading"); });
    bodyContent.appendChild(addSub);

    bodyInner.appendChild(bodyContent);
    body.appendChild(bodyInner);
    card.appendChild(body);

    if(heading.id === lastAddedId){
      card.classList.add("enter");
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ card.classList.remove("enter"); }); });
      lastAddedId = null;
    }
    return card;
  }

  function renderSubBlock(heading, sub){

    bar.querySelector(".collapse-btn").addEventListener("click", function(){ sub.collapsed = !sub.collapsed; scheduleSave(); render(); });

    subTitleInput.addEventListener("keydown", function(e){ if(e.key === "Enter") subTitleInput.blur(); });
    bar.querySelector(".icon-btn.danger").addEventListener("click", function(){ removeSubheading(heading, sub); });

    subBody.className = "sub-body";
    var subBodyInner = document.createElement("div");
    subBodyInner.className = "sub-body-inner";

    var list = document.createElement("div");
    list.className = "task-list";
    sortedTaskList(visibleSubTasks.filter(taskPassesTagFilter)).forEach(function(task){ list.appendChild(renderTaskRow(sub, task)); });
    wireTaskListContainer(list, sub);
    subBodyInner.appendChild(list);

    var addTaskBtn = document.createElement("button");
    addTaskBtn.className = "ghost-add";
    addTaskBtn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> Add task';
    addTaskBtn.addEventListener("click", function(){
      var t = addTask(sub, "");
      requestAnimationFrame(function(){ var el = document.querySelector('[data-task-id="' + t.id + '"] .task-text'); if(el){ el.focus(); el.select(); } });
    });
    subBodyInner.appendChild(addTaskBtn);

    subBodyInner.appendChild(renderArchiveToggle(sub, archivedSubTasks));

    subBody.appendChild(subBodyInner);
    block.appendChild(subBody);

    if(sub.id === lastAddedId){
      block.classList.add("enter");
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ block.classList.remove("enter"); }); });
      lastAddedId = null;
    }
    return block;
  }

  /* ---------------- today view ---------------- */
  function renderTodayView(){
    var root = document.getElementById("today-view");
    if(!state){ root.innerHTML = ""; return; }
    root.innerHTML = "";
    var todayStr = todayDateStr();
    var overdue = [], dueToday = [], flagged = [];
    forEachTask(function(t, h, sub){
      if(t.done || t.archivedAt) return;
      var container = sub || h;
      if(t.due && t.due.date < todayStr){ overdue.push({ task:t, container:container, heading:h, sub:sub }); }
      else if(t.due && t.due.date === todayStr){ dueToday.push({ task:t, container:container, heading:h, sub:sub }); }
      else if(t.priority === "high"){ flagged.push({ task:t, container:container, heading:h, sub:sub }); }
    });

    if(!overdue.length && !dueToday.length && !flagged.length){
      root.innerHTML = '<div class="empty-state"><h2>All clear for today</h2><p>Nothing overdue, nothing due today, and nothing flagged as high priority.</p></div>';
      return;
    }

    root.appendChild(renderTodaySection("Overdue", overdue));
    root.appendChild(renderTodaySection("Due today", dueToday));
    root.appendChild(renderTodaySection("Flagged", flagged));
  }

  function renderTodaySection(title, items){
    var section = document.createElement("section");
    section.className = "today-section";
    if(!items.length) return section; // skip empty sections entirely (empty <section> renders nothing)
    var head = document.createElement("div");
    head.className = "today-section-head";
    head.innerHTML = '<h2 class="today-section-title">' + escapeHtml(title) + '</h2><span class="today-section-count mono">' + items.length + '</span>';
    section.appendChild(head);
    var list = document.createElement("div");
    list.className = "task-list today-task-list";
    items.forEach(function(item){
      var wrap = document.createElement("div");
      wrap.className = "today-task-wrap";
      var pathLabel = escapeHtml(item.heading.title) + (item.sub ? ' <span class="today-task-path-sep">&rsaquo;</span> ' + escapeHtml(item.sub.title) : "");
      wrap.innerHTML = '<div class="today-task-path">' + pathLabel + '</div>';
      wrap.appendChild(renderTaskRow(item.container, item.task));
      list.appendChild(wrap);
    });
    section.appendChild(list);
    return section;
  }

  /* ---------------- archive ---------------- */
  var expandedArchives = {}; // heading/sub id -> expanded?, transient UI state (not persisted)
  var ICON_RESTORE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M3 12a9 9 0 1 1 2.64 6.36M3 12V6m0 6h6"/></svg>';
  function renderArchivedRow(container, task){
    var row = document.createElement("div");
    row.className = "archived-row";
    row.setAttribute("data-task-id", task.id);
    var dateLabel = task.completedAt ? new Date(task.completedAt).toLocaleDateString(undefined, {month:"short", day:"numeric"}) : "";
    row.innerHTML =
      '<span class="archived-text">' + escapeHtml(task.text) + '</span>' +
      '<span class="archived-date mono">' + escapeHtml(dateLabel) + '</span>' +
      '<button type="button" class="btn btn-sm btn-ghost" data-act="restore">' + ICON_RESTORE + ' Restore</button>' +
      '<button type="button" class="icon-btn danger" title="Delete permanently" aria-label="Delete permanently"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>';
    row.querySelector('[data-act="restore"]').addEventListener("click", function(){
      task.archivedAt = null;
      scheduleSave();
      render();
    });
    row.querySelector(".icon-btn.danger").addEventListener("click", function(){ removeTask(container, task); });
    return row;
  }
  function renderArchiveToggle(ownerObj, archivedTasks){
    var wrap = document.createElement("div");
    if(!archivedTasks.length) return wrap;
    var expanded = !!expandedArchives[ownerObj.id];
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ghost-add archive-toggle";
    btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="transform:rotate(' + (expanded ? "90" : "0") + 'deg)"><path d="M9 6l6 6-6 6"/></svg> ' +
      (expanded ? "Hide" : "Show") + " archived (" + archivedTasks.length + ")";
    btn.addEventListener("click", function(){
      expandedArchives[ownerObj.id] = !expanded;
      render();
    });
    wrap.appendChild(btn);
    if(expanded){
      var list = document.createElement("div");
      list.className = "archived-list";
      archivedTasks.forEach(function(t){ list.appendChild(renderArchivedRow(ownerObj, t)); });
      wrap.appendChild(list);
    }
    return wrap;
  }

  function renderTaskRow(container, task){
    var row = document.createElement("div");
    row.className = "task-row" + (task.done ? " done" : "");
    row.setAttribute("data-task-id", task.id);
    var due = task.due;
    var overdue = isOverdue(due, task.done);
    var dueLabel = due ? formatDue(due) : "Add due date";
    var syncBadge = task.syncing ? ICON_SPIN : (task.calendarEventId ? ICON_LINK : "");

    row.innerHTML =
      gripHtml() +
      '<input type="checkbox" class="check" ' + (task.done ? "checked" : "") + ' aria-label="Mark done" />' +
      '<div class="task-main">' +
        '<input class="task-text" value="' + escapeHtml(task.text) + '" aria-label="Task" />' +
        '<div class="task-meta">' +
          '<button class="priority-flag' + (task.priority ? ' set' : '') + '" type="button" title="' + (task.priority ? "Priority: " + priorityLabel(task) + " (click to change)" : "Set priority") + '" aria-label="Priority"><span class="priority-dot dot-' + (task.priority || "none") + '"></span>' + escapeHtml(priorityLabel(task)) + '</button>' +
          '<button class="due-badge' + (due ? (overdue ? ' overdue' : ' set') : '') + '" type="button">' + syncBadge + '<span>' + escapeHtml(dueLabel) + '</span></button>' +
          '<button class="notes-badge' + (notesBadgeSet(task) ? ' set' : '') + '" type="button" title="Notes & checklist">' + notesBadgeHtml(task) + '</button>' +
          '<button class="tags-badge' + (tagsBadgeSet(task) ? ' set' : '') + '" type="button" title="Tags">' + tagsBadgeHtml(task) + '</button>' +
          '<button class="subtasks-badge' + (subtasksBadgeSet(task) ? ' set' : '') + '" type="button" title="Subtasks">' + subtasksBadgeHtml(task) + '</button>' +
          (task.syncError ? '<span class="sync-note" title="' + escapeHtml(task.syncError) + '">' + escapeHtml(task.syncError) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="task-actions">' +
        (task.done ? '<button class="icon-btn" title="Archive task" aria-label="Archive task" data-act="archive"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8M10 13h4"/></svg></button>' : '') +
        '<button class="icon-btn danger" title="Delete task" aria-label="Delete task"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>' +
      '</div>';

    if(taskSortMode !== "manual"){
      var grip = row.querySelector(".grip");
      grip.classList.add("inactive");
      grip.removeAttribute("draggable");
      grip.title = "Switch to Manual sort to drag and reorder";
    } else {
      wireDragSource(row.querySelector(".grip"), "task", task.id, row);
      wireTaskRowDropTarget(row, task);
    }

    row.querySelector(".check").addEventListener("change", function(e){
      task.done = e.target.checked;
      task.completedAt = task.done ? new Date().toISOString() : null;
      scheduleSave();
      if(task.calendarEventId) syncTaskToCalendar(task); else render();
    });
    var textInput = row.querySelector(".task-text");
    textInput.addEventListener("change", function(){
      var newText = textInput.value.trim() || "Untitled task";
      // Only parse a date out of the very first edit of a freshly created inline task
      // (still showing the "New task" placeholder, no due date yet) — not later
      // renames of existing tasks, so editing a title elsewhere never surprises you
      // with a due date appearing because it happened to mention a day.
      if(task.text === "New task" && !task.due){
        var parsed = parseQuickCaptureLine(newText, new Date());
        if(parsed.due){
          task.text = parsed.text || "Untitled task";
          task.due = parsed.due;
          scheduleSave();
          render();
          syncTaskToCalendar(task);
          return;
        }
      }
      task.text = newText;
      scheduleSave();
      if(task.calendarEventId) syncTaskToCalendar(task);
    });
    textInput.addEventListener("keydown", function(e){ if(e.key === "Enter") textInput.blur(); });
    row.querySelector(".priority-flag").addEventListener("click", function(){ cyclePriority(row, task); });
    row.querySelector(".due-badge").addEventListener("click", function(){ toggleDueEditor(row, task); });
    row.querySelector(".notes-badge").addEventListener("click", function(){ toggleNotesEditor(row, task); });
    row.querySelector(".tags-badge").addEventListener("click", function(){ toggleTagsEditor(row, task); });
    row.querySelector(".subtasks-badge").addEventListener("click", function(){ toggleSubtasksEditor(row, task); });
    row.querySelector(".icon-btn.danger").addEventListener("click", function(){ removeTask(container, task); });
    var archiveBtn = row.querySelector('[data-act="archive"]');
    if(archiveBtn) archiveBtn.addEventListener("click", function(){
      task.archivedAt = new Date().toISOString();
      scheduleSave();
      render();
    });

    if(task.id === lastAddedId){
      row.classList.add("enter");
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ row.classList.remove("enter"); }); });
      lastAddedId = null;
    }
    return row;
  }

  // Adds n days to a "YYYY-MM-DD" string, returning a new "YYYY-MM-DD" string.
  function addDaysToDateStr(dateStr, n){
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
  }
  function snoozeTask(task, days){
    if(!task.due) return;
    task.due = { date: addDaysToDateStr(task.due.date, days), time: task.due.time, endTime: task.due.endTime, allDay: task.due.allDay };
    task.syncError = null;
    scheduleSave();
    render();
    syncTaskToCalendar(task);
  }
  function toggleDueEditor(row, task){
    var existing = row.querySelector(".due-editor");
    if(existing){ existing.remove(); return; }
    document.querySelectorAll(".due-editor").forEach(function(el){ el.remove(); });
    var editor = document.createElement("div");
    editor.className = "due-editor";
    var d = task.due || {};
    editor.innerHTML =
      '<input type="date" value="' + (d.date || "") + '" />' +
      '<input type="time" class="due-time-start" value="' + (d.time || "") + '" ' + (d.allDay ? "disabled" : "") + ' />' +
      '<span class="due-time-sep">to</span>' +
      '<input type="time" class="due-time-end" value="' + (d.endTime || "") + '" ' + (d.allDay ? "disabled" : "") + ' title="End time (optional)" />' +
      '<label><input type="checkbox" ' + (d.allDay ? "checked" : "") + ' /> All day</label>' +
      '<button class="btn btn-sm btn-primary" data-act="save">Save</button>' +
      (task.due ? '<button class="btn btn-sm btn-ghost" data-act="clear">Clear</button>' : '') +
      '<button class="btn btn-sm btn-ghost" data-act="close">Close</button>' +
      (task.due ? '<div class="snooze-row"><span class="snooze-label">Snooze</span><button type="button" class="btn btn-sm btn-ghost" data-act="snooze-1d">+1 day</button><button type="button" class="btn btn-sm btn-ghost" data-act="snooze-1w">+1 week</button></div>' : '');
    row.querySelector(".task-main").appendChild(editor);
    var dateEl = editor.querySelector('input[type="date"]');
    var timeEl = editor.querySelector('.due-time-start');
    var endTimeEl = editor.querySelector('.due-time-end');
    var allDayEl = editor.querySelector('input[type="checkbox"]');
    dateEl.focus();
    allDayEl.addEventListener("change", function(){ timeEl.disabled = allDayEl.checked; endTimeEl.disabled = allDayEl.checked; });
    editor.querySelector('[data-act="save"]').addEventListener("click", function(){
      if(!dateEl.value){ dateEl.focus(); return; }
      var startVal = allDayEl.checked ? null : (timeEl.value || null);
      var endVal = (allDayEl.checked || !startVal || !endTimeEl.value) ? null : endTimeEl.value;
      if(endVal && endVal <= startVal) endVal = null; // end must be after start — ignore an invalid range rather than reject it
      task.due = { date: dateEl.value, time: startVal, endTime: endVal, allDay: allDayEl.checked || !startVal };
      task.syncError = null;
      scheduleSave();
      render();
      syncTaskToCalendar(task);
    });
    var clearBtn = editor.querySelector('[data-act="clear"]');
    if(clearBtn) clearBtn.addEventListener("click", function(){
      task.due = null;
      scheduleSave();
      render();
      syncTaskToCalendar(task);
    });
    var snooze1d = editor.querySelector('[data-act="snooze-1d"]');
    if(snooze1d) snooze1d.addEventListener("click", function(){ snoozeTask(task, 1); });
    var snooze1w = editor.querySelector('[data-act="snooze-1w"]');
    if(snooze1w) snooze1w.addEventListener("click", function(){ snoozeTask(task, 7); });
    editor.querySelector('[data-act="close"]').addEventListener("click", function(){ editor.remove(); });
  }

  /* ---------------- notes & checklist ---------------- */
  var NOTES_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 11l2 2 4-4"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>';
  function notesBadgeSet(task){
    return !!(task.notes && task.notes.trim()) || (task.checklist && task.checklist.length > 0);
  }
  function notesBadgeHtml(task){
    var hasNotes = !!(task.notes && task.notes.trim());
    var total = task.checklist ? task.checklist.length : 0;
    var done = total ? task.checklist.filter(function(c){ return c.done; }).length : 0;
    var parts = [];
    if(hasNotes) parts.push("Notes");
    if(total) parts.push(done + "/" + total);
    return NOTES_ICON + (parts.length ? "<span>" + escapeHtml(parts.join(" · ")) + "</span>" : "");
  }
  function updateNotesBadge(row, task){
    var btn = row.querySelector(".notes-badge");
    if(!btn) return;
    btn.classList.toggle("set", notesBadgeSet(task));
    btn.innerHTML = notesBadgeHtml(task);
  }
  function renderChecklistItemRow(row, task, item){
    var itemRow = document.createElement("div");
    itemRow.className = "checklist-item" + (item.done ? " done" : "");
    itemRow.setAttribute("data-item-id", item.id);
    itemRow.innerHTML =
      '<input type="checkbox" class="checklist-item-check" ' + (item.done ? "checked" : "") + ' aria-label="Mark checklist item done" />' +
      '<input type="text" class="checklist-item-text" value="' + escapeHtml(item.text) + '" aria-label="Checklist item" />' +
      '<button type="button" class="icon-btn danger checklist-item-remove" title="Remove item" aria-label="Remove item"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    itemRow.querySelector(".checklist-item-check").addEventListener("change", function(e){
      item.done = e.target.checked;
      itemRow.classList.toggle("done", item.done);
      scheduleSave();
      updateNotesBadge(row, task);
    });
    var textEl = itemRow.querySelector(".checklist-item-text");
    textEl.addEventListener("change", function(){
      item.text = textEl.value.trim() || "Item";
      scheduleSave();
    });
    textEl.addEventListener("keydown", function(e){ if(e.key === "Enter") textEl.blur(); });
    itemRow.querySelector(".checklist-item-remove").addEventListener("click", function(){
      task.checklist = task.checklist.filter(function(c){ return c.id !== item.id; });
      itemRow.remove();
      scheduleSave();
      updateNotesBadge(row, task);
    });
    return itemRow;
  }
  function toggleNotesEditor(row, task){
    var existing = row.querySelector(".notes-editor");
    if(existing){ existing.remove(); return; }
    document.querySelectorAll(".notes-editor").forEach(function(el){ el.remove(); });
    var editor = document.createElement("div");
    editor.className = "notes-editor";
    editor.innerHTML =
      '<textarea class="notes-textarea" placeholder="Notes…" rows="3">' + escapeHtml(task.notes || "") + '</textarea>' +
      '<div class="checklist-list"></div>' +
      '<div class="checklist-add-row"><input type="text" class="checklist-add-input" placeholder="Add checklist item…" aria-label="Add checklist item"><button type="button" class="btn btn-sm btn-ghost" data-act="add-item">Add</button></div>' +
      '<div class="notes-editor-actions"><button type="button" class="btn btn-sm btn-ghost" data-act="close">Close</button></div>';
    row.querySelector(".task-main").appendChild(editor);

    var listEl = editor.querySelector(".checklist-list");
    task.checklist.forEach(function(item){ listEl.appendChild(renderChecklistItemRow(row, task, item)); });

    var textarea = editor.querySelector(".notes-textarea");
    textarea.addEventListener("blur", function(){
      var v = textarea.value.trim();
      if(v !== (task.notes || "")){
        task.notes = v;
        scheduleSave();
        updateNotesBadge(row, task);
      }
    });
    textarea.focus();

    var addInput = editor.querySelector(".checklist-add-input");
    function addItem(){
      var text = addInput.value.trim();
      if(!text) return;
      var item = { id: uid(), text: text, done: false };
      task.checklist.push(item);
      listEl.appendChild(renderChecklistItemRow(row, task, item));
      addInput.value = "";
      addInput.focus();
      scheduleSave();
      updateNotesBadge(row, task);
    }
    editor.querySelector('[data-act="add-item"]').addEventListener("click", addItem);
    addInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addItem(); } });

    editor.querySelector('[data-act="close"]').addEventListener("click", function(){
      // Blur first so an in-progress notes edit is saved before closing.
      if(document.activeElement === textarea) textarea.blur();
      editor.remove();
    });
  }

  /* ---------------- tags & tag filter ---------------- */
  var TAG_COLORS = ["#4a5fc1","#b3486b","#6f7d3a","#7a4fa0","#55606e","#b8452f","#2f7d8c","#a8672a"];
  function tagColor(tag){
    var hash = 0;
    for(var i=0;i<tag.length;i++){ hash = (hash*31 + tag.charCodeAt(i)) | 0; }
    return TAG_COLORS[Math.abs(hash) % TAG_COLORS.length];
  }
  var TAG_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20.59 13.41L11 3.83A2 2 0 009.59 3.17H4a1 1 0 00-1 1v5.59a2 2 0 00.59 1.41l9.59 9.59a2 2 0 002.82 0l4.59-4.59a2 2 0 000-2.82z"/><circle cx="7.5" cy="7.5" r="1.2" fill="currentColor" stroke="none"/></svg>';
  function tagsBadgeSet(task){ return !!(task.tags && task.tags.length); }
  function tagsBadgeHtml(task){
    var tags = task.tags || [];
    if(!tags.length) return TAG_ICON;
    return TAG_ICON + '<span>' + escapeHtml(tags.join(", ")) + '</span>';
  }
  function updateTagsBadge(row, task){
    var btn = row.querySelector(".tags-badge");
    if(!btn) return;
    btn.classList.toggle("set", tagsBadgeSet(task));
    btn.innerHTML = tagsBadgeHtml(task);
  }
  function renderTagChip(chipsEl, row, task, tag){
    var chip = document.createElement("span");
    chip.className = "tag-chip";
    chip.style.setProperty("--tag-color", tagColor(tag));
    chip.innerHTML = '<span class="tag-chip-text"></span><button type="button" class="tag-chip-remove" aria-label="Remove tag ' + escapeHtml(tag) + '"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 6l12 12M18 6L6 18"/></svg></button>';
    chip.querySelector(".tag-chip-text").textContent = tag;
    chip.querySelector(".tag-chip-remove").addEventListener("click", function(){
      task.tags = task.tags.filter(function(t){ return t !== tag; });
      chip.remove();
      scheduleSave();
      updateTagsBadge(row, task);
      refreshTagFilterButton();
    });
    chipsEl.appendChild(chip);
  }
  function toggleTagsEditor(row, task){
    var existing = row.querySelector(".tags-editor");
    if(existing){ existing.remove(); return; }
    document.querySelectorAll(".tags-editor").forEach(function(el){ el.remove(); });
    var editor = document.createElement("div");
    editor.className = "tags-editor";
    editor.innerHTML =
      '<div class="tag-chip-list"></div>' +
      '<div class="tag-add-row"><input type="text" class="tag-add-input" placeholder="Add tag…" aria-label="Add tag"><button type="button" class="btn btn-sm btn-ghost" data-act="add-tag">Add</button></div>' +
      '<div class="notes-editor-actions"><button type="button" class="btn btn-sm btn-ghost" data-act="close">Close</button></div>';
    row.querySelector(".task-main").appendChild(editor);

    var chipsEl = editor.querySelector(".tag-chip-list");
    (task.tags || []).forEach(function(tag){ renderTagChip(chipsEl, row, task, tag); });

    var addInput = editor.querySelector(".tag-add-input");
    function addTag(){
      var tag = addInput.value.trim().replace(/\s+/g, " ");
      if(!tag) return;
      if(!task.tags) task.tags = [];
      if(task.tags.indexOf(tag) === -1){
        task.tags.push(tag);
        renderTagChip(chipsEl, row, task, tag);
        scheduleSave();
        updateTagsBadge(row, task);
        refreshTagFilterButton();
      }
      addInput.value = "";
      addInput.focus();
    }
    editor.querySelector('[data-act="add-tag"]').addEventListener("click", addTag);
    addInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addTag(); } });
    addInput.focus();

    editor.querySelector('[data-act="close"]').addEventListener("click", function(){ editor.remove(); });
  }

  // Which tags are currently selected to filter the list by (OR logic: a task shows
  // if it has ANY selected tag). Session-only, not persisted — a transient lens on
  // the list rather than a saved preference.
  var activeTagFilters = [];
  function allTagsInUse(){
    var set = {};
    forEachTask(function(t){ (t.tags || []).forEach(function(tag){ set[tag] = true; }); });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b); });
  }
  function taskPassesTagFilter(task){
    if(!activeTagFilters.length) return true;
    var tags = task.tags || [];
    return activeTagFilters.some(function(tag){ return tags.indexOf(tag) !== -1; });
  }
  function refreshTagFilterButton(){
    var btn = document.getElementById("tag-filter-btn");
    if(!btn) return;
    var n = activeTagFilters.length;
    btn.classList.toggle("active", n > 0);
    btn.innerHTML = TAG_ICON + '<span>' + (n ? "Tags (" + n + ")" : "Tags") + '</span>';
  }
  // Opens the popover if none is showing, closes it if one already is — this is what
  // the "Tags" button itself toggles. Checkbox/clear actions inside the popover call
  // buildTagFilterPopover() directly instead, so they refresh it in place rather than
  // closing it (see the toggle-shaped check at the top here).
  function openTagFilterPopover(anchorEl){
    var existing = document.querySelector(".tag-filter-popover");
    if(existing){ existing.remove(); return; }
    closeAllPopovers();
    buildTagFilterPopover(anchorEl);
  }
  function buildTagFilterPopover(anchorEl){
    var old = document.querySelector(".tag-filter-popover");
    if(old) old.remove();
    var pop = document.createElement("div");
    pop.className = "tag-filter-popover";
    var tags = allTagsInUse();
    if(!tags.length){
      pop.innerHTML = '<div class="field-hint" style="padding:4px 6px;">No tags yet — add one from a task first.</div>';
    } else {
      pop.innerHTML = tags.map(function(tag){
        var checked = activeTagFilters.indexOf(tag) !== -1;
        return '<label class="tag-filter-row"><input type="checkbox" class="tag-filter-cb" value="' + escapeHtml(tag) + '"' + (checked ? " checked" : "") + '>' +
          '<span class="tag-chip-dot" style="background:' + tagColor(tag) + '"></span><span>' + escapeHtml(tag) + '</span></label>';
      }).join("");
      if(activeTagFilters.length){
        pop.innerHTML += '<button type="button" class="btn btn-sm btn-ghost" id="tag-filter-clear" style="margin-top:4px;width:100%;">Clear filter</button>';
      }
    }
    document.body.appendChild(pop);
    var rect = anchorEl.getBoundingClientRect();
    pop.style.top = (rect.bottom + 6) + "px";
    pop.style.left = Math.max(8, rect.left) + "px";
    pop.addEventListener("click", function(e){ e.stopPropagation(); });
    pop.querySelectorAll(".tag-filter-cb").forEach(function(cb){
      cb.addEventListener("change", function(){
        var tag = cb.value;
        var idx = activeTagFilters.indexOf(tag);
        if(cb.checked){ if(idx === -1) activeTagFilters.push(tag); }
        else if(idx !== -1){ activeTagFilters.splice(idx, 1); }
        refreshTagFilterButton();
        render();
        buildTagFilterPopover(anchorEl);
      });
    });
    var clearBtn = pop.querySelector("#tag-filter-clear");
    if(clearBtn) clearBtn.addEventListener("click", function(){
      activeTagFilters = [];
      refreshTagFilterButton();
      render();
      buildTagFilterPopover(anchorEl);
    });
  }

  /* ---------------- subtasks ---------------- */
  // Subtasks are a lighter-weight nested task: text, done, and an optional due date —
  // no notes/checklist/tags/priority/calendar sync of their own. Distinct from the
  // notes checklist, which is plain text items with no dates.
  var SUBTASK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3" stroke-linecap="round"/></svg>';
  // A dedicated disclosure arrow (rather than relying on the small icon alone as the
  // only visual cue) — it rotates via the .open class toggled in toggleSubtasksEditor.
  var SUBTASK_CHEVRON = '<svg class="subtask-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>';
  function subtasksBadgeSet(task){ return !!(task.subtasks && task.subtasks.length); }
  function subtasksBadgeHtml(task){
    var subs = task.subtasks || [];
    if(!subs.length) return SUBTASK_ICON + SUBTASK_CHEVRON;
    var done = subs.filter(function(s){ return s.done; }).length;
    return SUBTASK_ICON + '<span>' + done + '/' + subs.length + '</span>' + SUBTASK_CHEVRON;
  }
  function updateSubtasksBadge(row, task){
    var btn = row.querySelector(".subtasks-badge");
    if(!btn) return;
    btn.classList.toggle("set", subtasksBadgeSet(task));
    var wasOpen = btn.classList.contains("open");
    btn.innerHTML = subtasksBadgeHtml(task);
    btn.classList.toggle("open", wasOpen);
  }
  function updateSubtaskDueBadge(itemRow, subtask){
    var btn = itemRow.querySelector(".subtask-due-badge");
    if(!btn) return;
    var due = subtask.due;
    var overdue = isOverdue(due, subtask.done);
    btn.className = "due-badge due-badge-sm subtask-due-badge" + (due ? (overdue ? " overdue" : " set") : "");
    btn.textContent = due ? formatDue(due) : "Add date";
  }
  function toggleSubtaskDueEditor(itemRow, task, subtask){
    var existing = itemRow.querySelector(".due-editor");
    if(existing){ existing.remove(); return; }
    document.querySelectorAll(".due-editor").forEach(function(el){ el.remove(); });
    var editor = document.createElement("div");
    editor.className = "due-editor";
    var d = subtask.due || {};
    editor.innerHTML =
      '<input type="date" value="' + (d.date || "") + '" />' +
      '<input type="time" class="due-time-start" value="' + (d.time || "") + '" ' + (d.allDay ? "disabled" : "") + ' />' +
      '<span class="due-time-sep">to</span>' +
      '<input type="time" class="due-time-end" value="' + (d.endTime || "") + '" ' + (d.allDay ? "disabled" : "") + ' title="End time (optional)" />' +
      '<label><input type="checkbox" ' + (d.allDay ? "checked" : "") + ' /> All day</label>' +
      '<button class="btn btn-sm btn-primary" data-act="save">Save</button>' +
      (subtask.due ? '<button class="btn btn-sm btn-ghost" data-act="clear">Clear</button>' : '') +
      '<button class="btn btn-sm btn-ghost" data-act="close">Close</button>';
    itemRow.appendChild(editor);
    var dateEl = editor.querySelector('input[type="date"]');
    var timeEl = editor.querySelector('.due-time-start');
    var endTimeEl = editor.querySelector('.due-time-end');
    var allDayEl = editor.querySelector('input[type="checkbox"]');
    dateEl.focus();
    allDayEl.addEventListener("change", function(){ timeEl.disabled = allDayEl.checked; endTimeEl.disabled = allDayEl.checked; });
    editor.querySelector('[data-act="save"]').addEventListener("click", function(){
      if(!dateEl.value){ dateEl.focus(); return; }
      var startVal = allDayEl.checked ? null : (timeEl.value || null);
      var endVal = (allDayEl.checked || !startVal || !endTimeEl.value) ? null : endTimeEl.value;
      if(endVal && endVal <= startVal) endVal = null;
      subtask.due = { date: dateEl.value, time: startVal, endTime: endVal, allDay: allDayEl.checked || !startVal };
      scheduleSave();
      updateSubtaskDueBadge(itemRow, subtask);
      editor.remove();
    });
    var clearBtn = editor.querySelector('[data-act="clear"]');
    if(clearBtn) clearBtn.addEventListener("click", function(){
      subtask.due = null;
      scheduleSave();
      updateSubtaskDueBadge(itemRow, subtask);
      editor.remove();
    });
    editor.querySelector('[data-act="close"]').addEventListener("click", function(){ editor.remove(); });
  }
  function renderSubtaskRow(listEl, row, task, subtask){
    var itemRow = document.createElement("div");
    itemRow.className = "subtask-item" + (subtask.done ? " done" : "");
    itemRow.setAttribute("data-subtask-id", subtask.id);
    itemRow.innerHTML =
      '<div class="subtask-item-row">' +
        '<input type="checkbox" class="subtask-check" ' + (subtask.done ? "checked" : "") + ' aria-label="Mark subtask done" />' +
        '<input type="text" class="subtask-text" value="' + escapeHtml(subtask.text) + '" aria-label="Subtask" />' +
        '<button type="button" class="due-badge due-badge-sm subtask-due-badge' + (subtask.due ? (isOverdue(subtask.due, subtask.done) ? " overdue" : " set") : "") + '">' + (subtask.due ? escapeHtml(formatDue(subtask.due)) : "Add date") + '</button>' +
        '<button type="button" class="icon-btn danger subtask-remove" title="Remove subtask" aria-label="Remove subtask"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' +
      '</div>';
    itemRow.querySelector(".subtask-check").addEventListener("change", function(e){
      subtask.done = e.target.checked;
      subtask.completedAt = subtask.done ? new Date().toISOString() : null;
      itemRow.classList.toggle("done", subtask.done);
      scheduleSave();
      updateSubtasksBadge(row, task);
    });
    var textEl = itemRow.querySelector(".subtask-text");
    textEl.addEventListener("change", function(){
      subtask.text = textEl.value.trim() || "Untitled subtask";
      textEl.value = subtask.text;
      scheduleSave();
    });
    textEl.addEventListener("keydown", function(e){ if(e.key === "Enter") textEl.blur(); });
    itemRow.querySelector(".subtask-due-badge").addEventListener("click", function(){ toggleSubtaskDueEditor(itemRow, task, subtask); });
    itemRow.querySelector(".subtask-remove").addEventListener("click", function(){
      task.subtasks = task.subtasks.filter(function(s){ return s.id !== subtask.id; });
      itemRow.remove();
      scheduleSave();
      updateSubtasksBadge(row, task);
    });
    listEl.appendChild(itemRow);
  }
  function toggleSubtasksEditor(row, task){
    var badge = row.querySelector(".subtasks-badge");
    var existing = row.querySelector(".subtasks-editor");
    if(existing){ existing.remove(); if(badge) badge.classList.remove("open"); return; }
    document.querySelectorAll(".subtasks-editor").forEach(function(el){ el.remove(); });
    document.querySelectorAll(".subtasks-badge.open").forEach(function(b){ b.classList.remove("open"); });
    if(!Array.isArray(task.subtasks)) task.subtasks = [];
    var editor = document.createElement("div");
    editor.className = "subtasks-editor";
    editor.innerHTML =
      '<div class="subtask-list"></div>' +
      '<div class="subtask-add-row"><input type="text" class="subtask-add-input" placeholder="Add subtask…" aria-label="Add subtask"><button type="button" class="btn btn-sm btn-ghost" data-act="add-subtask">Add</button></div>' +
      '<div class="notes-editor-actions"><button type="button" class="btn btn-sm btn-ghost" data-act="close">Close</button></div>';
    row.querySelector(".task-main").appendChild(editor);
    if(badge) badge.classList.add("open");

    var listEl = editor.querySelector(".subtask-list");
    task.subtasks.forEach(function(subtask){ renderSubtaskRow(listEl, row, task, subtask); });

    var addInput = editor.querySelector(".subtask-add-input");
    function addSubtask(){
      var text = addInput.value.trim();
      if(!text) return;
      var subtask = { id: uid(), text: text, done: false, due: null, completedAt: null };
      task.subtasks.push(subtask);
      renderSubtaskRow(listEl, row, task, subtask);
      addInput.value = "";
      addInput.focus();
      scheduleSave();
      updateSubtasksBadge(row, task);
    }
    editor.querySelector('[data-act="add-subtask"]').addEventListener("click", addSubtask);
    addInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addSubtask(); } });
    addInput.focus();

    editor.querySelector('[data-act="close"]').addEventListener("click", function(){ editor.remove(); if(badge) badge.classList.remove("open"); });
  }

  /* ---------------- stats page ---------------- */
  function computeStats(){
    var total=0, done=0, overdue=0, dueThisWeek=0, completedToday=0, completedThisWeek=0;
    var now = new Date(); now.setHours(0,0,0,0);
    var weekAhead = new Date(now); weekAhead.setDate(weekAhead.getDate()+7);
    var weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate()-7);
    var upcoming = [];
    var perHeading = [];
    state.headings.forEach(function(h){
      var hTotal=0, hDone=0;
      function tally(t){
        total++; hTotal++;
        if(t.done){
          done++; hDone++;
          if(t.completedAt){
            var d = new Date(t.completedAt);
            if(d >= now) completedToday++;
            if(d >= weekAgo) completedThisWeek++;
          }
        } else if(t.due){
          var due = new Date(t.due.date + "T00:00:00");
          if(due < now) overdue++;
          else if(due <= weekAhead) dueThisWeek++;
          upcoming.push({ task:t, heading:h });
        }
      }
      h.tasks.forEach(tally);
      h.subheadings.forEach(function(sh){ sh.tasks.forEach(tally); });
      perHeading.push({ heading:h, total:hTotal, done:hDone });
    });
    upcoming.sort(function(a,b){
      var ka = a.task.due.date + (a.task.due.time || "");
      var kb = b.task.due.date + (b.task.due.time || "");
      return ka < kb ? -1 : (ka > kb ? 1 : 0);
    });
    return { total:total, done:done, overdue:overdue, dueThisWeek:dueThisWeek, completedToday:completedToday, completedThisWeek:completedThisWeek, perHeading:perHeading, upcoming:upcoming.slice(0,6) };
  }

  function renderStats(){
    var root = document.getElementById("stats-view");
    if(!state){ root.innerHTML = ""; return; }
    var s = computeStats();
    var pct = s.total ? Math.round((s.done / s.total) * 100) : 0;

    var html = '<div class="stats-head"><h2>Statistics</h2><p>' + s.total + ' tasks across ' + state.headings.length + ' heading' + (state.headings.length===1?"":"s") + '.</p></div>';

    html += '<div class="stat-grid">' +
      '<div class="stat-tile"><div class="num mono">' + pct + '%</div><div class="label">Completed (' + s.done + '/' + s.total + ')</div></div>' +
      '<div class="stat-tile"><div class="num mono' + (s.overdue? ' danger':'') + '">' + s.overdue + '</div><div class="label">Overdue</div></div>' +
      '<div class="stat-tile"><div class="num mono">' + s.dueThisWeek + '</div><div class="label">Due in 7 days</div></div>' +
      '<div class="stat-tile"><div class="num mono accent2">' + s.completedThisWeek + '</div><div class="label">Completed this week</div></div>' +
    '</div>';

    html += '<div class="stats-section"><h3>By heading</h3>';
    if(!s.perHeading.length){
      html += '<div class="stats-empty">Add a heading to see a breakdown here.</div>';
    } else {
      html += s.perHeading.map(function(row){
        var pctH = row.total ? Math.round((row.done/row.total)*100) : 0;
        var color = row.heading.color || "var(--accent)";
        return '<div class="heading-bar-row">' +
          '<span class="hb-dot" style="background:' + color + '"></span>' +
          '<span class="hb-name">' + escapeHtml(row.heading.title) + '</span>' +
          '<span class="hb-track"><span class="hb-fill" style="width:' + pctH + '%;background:' + color + '"></span></span>' +
          '<span class="hb-frac mono">' + row.done + '/' + row.total + '</span>' +
        '</div>';
      }).join("");
    }
    html += '</div>';

    html += '<div class="stats-section"><h3>Upcoming</h3>';
    if(!s.upcoming.length){
      html += '<div class="stats-empty">Nothing with a due date coming up.</div>';
    } else {
      html += '<div class="upcoming-list">' + s.upcoming.map(function(row){
        return '<div class="upcoming-row">' +
          '<span class="up-date mono">' + escapeHtml(formatDue(row.task.due)) + '</span>' +
          '<span class="up-text">' + escapeHtml(row.task.text) + '</span>' +
          '<span class="up-heading">' + escapeHtml(row.heading.title) + '</span>' +
        '</div>';
      }).join("") + '</div>';
    }
    html += '</div>';

    root.innerHTML = html;
  }

  document.getElementById("add-heading-btn").addEventListener("click", function(){
    addHeading("New heading");
    requestAnimationFrame(function(){
      var el = document.querySelector('.heading-card:last-child .heading-title');
      if(el){ el.focus(); el.select(); }
    });
  });

  /* ---------------- boot ---------------- */
  currentAppearance = loadAppearance();
  if(currentAppearance !== "system") document.documentElement.setAttribute("data-theme", currentAppearance);
  applyPalette(loadPaletteKey());
  applyFontPackage(loadFontKey());
  taskSortMode = loadTaskSortMode();
  syncSortButtons();
  state = defaultState();
  config = loadConfig();
  render();
  if(config){ setStatus("not_configured"); loadFromGithub(); loadIcsFeeds(); loadDigestSettings(); }
  else { setStatus("not_configured"); openSettings(); }

  var gcfgBoot = loadGcalConfig();
  gcalClientId = gcfgBoot && gcfgBoot.clientId;
  if(gcalClientId){
    waitForGis(function(){ tryAutoConnectGcal(); }, 25);
  } else {
    setGcalStatus("not_configured");
  }

  /* ---------------- PWA: install prompt + service worker ---------------- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline shell is a nice-to-have, not critical */ });
    });
  }
  var deferredInstallPrompt = null;
  var installBtn = document.getElementById("install-app-btn");
  function isStandalone(){
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    if(!isStandalone()) installBtn.hidden = false;
  });
  installBtn.addEventListener("click", function(){
    if(!deferredInstallPrompt) return;
    installBtn.disabled = true;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.finally(function(){
      deferredInstallPrompt = null;
      installBtn.hidden = true;
      installBtn.disabled = false;
    });
  });
  window.addEventListener("appinstalled", function(){ installBtn.hidden = true; });
})();
</script>
