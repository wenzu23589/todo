    });
    var textEl = itemRow.querySelector(".subtask-text");
    textEl.addEventListener("input", function(){ subtask.text = textEl.value; scheduleSave(); autoGrowTextarea(textEl); });
    textEl.addEventListener("change", function(){
      subtask.text = textEl.value.trim() || "Untitled subtask";
      textEl.value = subtask.text;
      scheduleSave();
      autoGrowTextarea(textEl);
    });
    // Same Shift+Enter-for-newline / plain-Enter-to-finish convention as the task title above.
    textEl.addEventListener("keydown", function(e){
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); textEl.blur(); }
    });
    requestAnimationFrame(function(){ autoGrowTextarea(textEl); });
    itemRow.querySelector(".subtask-due-badge").addEventListener("click", function(){ toggleSubtaskDueEditor(itemRow, task, subtask); });
    itemRow.querySelector(".subtask-attachments-badge").addEventListener("click", function(){ toggleSubtaskAttachmentsEditor(itemRow, subtask); });
    itemRow.querySelector(".subtask-remove").addEventListener("click", function(){
      task.subtasks = task.subtasks.filter(function(s){ return s.id !== subtask.id; });
      itemRow.remove();
      scheduleSave();
      updateSubtasksBadge(row, task);
      updateTaskSubtaskToggle(row, task);
    });
    listEl.appendChild(itemRow);
  }
  function toggleSubtasksEditor(row, task){
    var badge = row.querySelector(".subtasks-badge");
    var toggleBtn = row.querySelector(".task-subtask-toggle");
    var existing = row.querySelector(".subtasks-editor");
    if(existing){
      existing.remove();
      if(badge) badge.classList.remove("open");
      if(toggleBtn) toggleBtn.classList.remove("open");
      return;
    }
    document.querySelectorAll(".subtasks-editor").forEach(function(el){ el.remove(); });
    document.querySelectorAll(".subtasks-badge.open, .task-subtask-toggle.open").forEach(function(b){ b.classList.remove("open"); });
    if(!Array.isArray(task.subtasks)) task.subtasks = [];
    var editor = document.createElement("div");
    editor.className = "subtasks-editor";
    editor.innerHTML =
      '<div class="subtask-list"></div>' +
      '<div class="subtask-add-row"><input type="text" class="subtask-add-input" placeholder="Add subtask…" aria-label="Add subtask"><button type="button" class="btn btn-sm btn-ghost" data-act="add-subtask">Add</button></div>' +
      '<div class="notes-editor-actions"><button type="button" class="btn btn-sm btn-ghost" data-act="close">Close</button></div>';
    row.querySelector(".task-main").appendChild(editor);
    if(badge) badge.classList.add("open");
    if(toggleBtn) toggleBtn.classList.add("open");

    var listEl = editor.querySelector(".subtask-list");
    task.subtasks.forEach(function(subtask){ renderSubtaskRow(listEl, row, task, subtask); });

    var addInput = editor.querySelector(".subtask-add-input");
    function addSubtask(){
      var text = addInput.value.trim();
      if(!text) return;
      var subtask = { id: uid(), text: text, status: "not_started", done: false, due: null, completedAt: null, attachments: [] };
      task.subtasks.push(subtask);
      renderSubtaskRow(listEl, row, task, subtask);
      addInput.value = "";
      addInput.focus();
      scheduleSave();
      updateSubtasksBadge(row, task);
      updateTaskSubtaskToggle(row, task);
    }
    editor.querySelector('[data-act="add-subtask"]').addEventListener("click", addSubtask);
    addInput.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); addSubtask(); } });
    addInput.focus();

    editor.querySelector('[data-act="close"]').addEventListener("click", function(){
      editor.remove();
      if(badge) badge.classList.remove("open");
      if(toggleBtn) toggleBtn.classList.remove("open");
    });
  }

  /* ---------------- attachments (images & PDFs, on tasks and subtasks) ----------------
     Each attachment is its own file committed to the repo under attachments/, uploaded
     via ghPutBinary — the task/subtask itself only stores a lightweight reference (id,
     name, path, mime, type, size, sha). Shared between tasks and subtasks: both kinds of
     owner object just need an `attachments` array, so the upload/render/remove logic
     below is written generically against "ownerObj" and wired up by two thin per-kind
     wrapper functions (toggleAttachmentsEditor for tasks, toggleSubtaskAttachmentsEditor
     for subtasks) that know their own badge/DOM conventions. */
  var ATTACHMENTS_DIR = "attachments";
  var ATTACHMENT_MAX_BYTES = 12 * 1024 * 1024; // 12MB — still comfortably inside what a single Contents API PUT reliably accepts
  var ATTACH_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 01-7.78-7.78l9.19-9.19a3.5 3.5 0 014.95 4.95l-9.19 9.19a1.5 1.5 0 01-2.12-2.12l8.49-8.48"/></svg>';
  var ATTACH_IMAGE_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>';
  var ATTACH_PDF_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h8l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/><path d="M14 2v5a1 1 0 001 1h5"/><path d="M8 17v-4h1.3a1.3 1.3 0 010 2.6H8M12 13v4h.8a1.7 1.7 0 000-4H12zM16.5 17v-4h2M16.5 15h1.5"/></svg>';

  function attachmentPathFor(id, filename){
    var safe = String(filename || "file").replace(/[^a-zA-Z0-9._-]+/g, "_").slice(-80) || "file";
    return ATTACHMENTS_DIR + "/" + id + "-" + safe;
  }
  function formatFileSize(bytes){
    if(bytes === null || bytes === undefined) return "";
    if(bytes < 1024) return bytes + " B";
    if(bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
    return (Math.round(bytes / 1024 / 1024 * 10) / 10) + " MB";
  }
  function fileToBase64(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){
        var result = reader.result || "";
        var comma = result.indexOf(",");
        resolve(comma !== -1 ? result.slice(comma + 1) : result);
      };
      reader.onerror = function(){ reject(new Error("Couldn't read that file.")); };
      reader.readAsDataURL(file);
    });
  }

  // In-memory only (per session, never persisted): once an attachment's bytes are
  // fetched from GitHub they're kept as a blob URL so reopening the editor, or the
  // file itself, doesn't re-download it every time.
  var attachmentBlobCache = {};
  function fetchAttachmentBlob(att){
    if(attachmentBlobCache[att.path]) return attachmentBlobCache[att.path];
    var p = ghGetBinaryBlob(cfgFor(att.path), att.mime).then(function(res){
      if(!res.exists) throw new Error("That attachment is missing from the repo.");
      return res.blob;
    }).catch(function(e){ delete attachmentBlobCache[att.path]; throw e; });
    attachmentBlobCache[att.path] = p;
    return p;
  }

  /* ---------------- attachment text extraction (OCR + PDF text layer, for search) ----------------
     Runs entirely client-side, no server or API key: Tesseract.js OCRs images, and
     pdfjs-dist reads a PDF's own text layer when it has one (fast, exact) or renders its
     pages to a canvas and OCRs those when it doesn't (a scanned/photographed PDF). Both
     libraries are loaded lazily from a CDN, only the first time they're actually needed,
     so nobody pays for them just by opening the app. Pinned to exact versions so a future
     release of either library can't change behavior underneath this without a deliberate
     version bump here. */
  var TESSERACT_CDN = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";
  var PDFJS_CDN = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
  var PDFJS_WORKER_CDN = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
  var EXTRACTED_TEXT_MAX_CHARS = 20000; // plenty for search; keeps tasks.json from bloating on a text-heavy PDF
  var PDF_TEXT_LAYER_MAX_PAGES = 20; // safety cap on very long PDFs when a text layer already exists (fast path)
  var PDF_OCR_MAX_PAGES = 5; // OCR fallback is slow — first few pages are usually enough to make a scan findable

  function loadScriptOnce(src){
    return new Promise(function(resolve, reject){
      var existing = document.querySelector('script[src="' + src + '"]');
      if(existing){ existing.addEventListener("load", function(){ resolve(); }); if(existing.getAttribute("data-loaded")) resolve(); return; }
      var s = document.createElement("script");
      s.src = src;
      s.onload = function(){ s.setAttribute("data-loaded", "1"); resolve(); };
      s.onerror = function(){ reject(new Error("Couldn't load " + src)); };
      document.head.appendChild(s);
    });
  }
  var tesseractWorkerPromise = null;
  function getTesseractWorker(){
    if(tesseractWorkerPromise) return tesseractWorkerPromise;
    // Reused for the rest of the session once created — Tesseract.js's own guidance is to
    // create one worker and run every recognize() through it, rather than spinning up a
    // fresh worker (and re-downloading language data) per image.
    tesseractWorkerPromise = loadScriptOnce(TESSERACT_CDN).then(function(){
      return window.Tesseract.createWorker("eng");
    }).catch(function(e){ tesseractWorkerPromise = null; throw e; });
    return tesseractWorkerPromise;
  }
  function ocrImageSource(source){
    return getTesseractWorker().then(function(worker){
      return worker.recognize(source).then(function(result){
        return (result && result.data && result.data.text) || "";
      });
    });
  }
  var pdfjsLibPromise = null;
  function getPdfjsLib(){
    if(pdfjsLibPromise) return pdfjsLibPromise;
    pdfjsLibPromise = import(PDFJS_CDN).then(function(mod){
      mod.GlobalWorkerOptions.workerSrc = PDFJS_WORKER_CDN;
      return mod;
    }).catch(function(e){ pdfjsLibPromise = null; throw e; });
    return pdfjsLibPromise;
  }
  function ocrPdfPages(pdf, pageNums){
    var pagesToOcr = pageNums.slice(0, PDF_OCR_MAX_PAGES);
    return getTesseractWorker().then(function(worker){
      return pagesToOcr.reduce(function(chain, pageNum){
        return chain.then(function(acc){
          return pdf.getPage(pageNum).then(function(page){
            var viewport = page.getViewport({ scale: 2 });
            var canvas = document.createElement("canvas");
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            var ctx = canvas.getContext("2d");
            return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function(){
              return worker.recognize(canvas);
            }).then(function(result){
              return acc + ((result && result.data && result.data.text) || "") + "\n";
            });
          });
        });
      }, Promise.resolve(""));
    }).then(function(text){ return text.trim(); });
  }
  function extractPdfText(blob){
    return Promise.all([blob.arrayBuffer(), getPdfjsLib()]).then(function(res){
      var buf = res[0], pdfjsLib = res[1];
      return pdfjsLib.getDocument({ data: buf }).promise.then(function(pdf){
        var maxPages = Math.min(pdf.numPages, PDF_TEXT_LAYER_MAX_PAGES);
        var pageNums = [];
        for(var i = 1; i <= maxPages; i++) pageNums.push(i);
        return pageNums.reduce(function(chain, pageNum){
          return chain.then(function(acc){
            return pdf.getPage(pageNum).then(function(page){
              return page.getTextContent().then(function(content){
                return acc + content.items.map(function(it){ return it.str || ""; }).join(" ") + "\n";
              });
            });
          });
        }, Promise.resolve("")).then(function(text){
          var trimmed = text.replace(/\s+/g, " ").trim();
          // A real text layer almost always yields more than a token or two; anything
          // shorter is treated as "no usable text layer" — most likely a scanned/
          // photographed PDF with no embedded text at all — and falls back to OCR.
          if(trimmed.length >= 20) return trimmed;
          return ocrPdfPages(pdf, pageNums);
        });
      });
    });
  }
  function extractAttachmentText(att, fileOrBlob){
    var srcPromise = fileOrBlob ? Promise.resolve(fileOrBlob) : fetchAttachmentBlob(att);
    return srcPromise.then(function(blob){
      if(att.type === "image") return ocrImageSource(blob);
      if(att.type === "pdf") return extractPdfText(blob);
      return "";
    });
  }
  function ensureAttachmentTextExtracted(ownerObj, att, itemRow, onChange, fileOrBlob){
    if(att.textStatus === "done" || att.textStatus === "unavailable" || att.textStatus === "extracting") return;
    att.textStatus = "extracting";
    paintAttachmentRow(itemRow, ownerObj, att, onChange);
    extractAttachmentText(att, fileOrBlob).then(function(text){
      att.extractedText = (text || "").slice(0, EXTRACTED_TEXT_MAX_CHARS);
      att.textStatus = "done";
      scheduleSave();
      if(document.body.contains(itemRow)) paintAttachmentRow(itemRow, ownerObj, att, onChange);
    }).catch(function(){
      att.textStatus = "unavailable";
      scheduleSave();
      if(document.body.contains(itemRow)) paintAttachmentRow(itemRow, ownerObj, att, onChange);
    });
  }

  function attachmentsBadgeSet(ownerObj){ return !!(ownerObj.attachments && ownerObj.attachments.length); }
  function attachmentsBadgeHtml(ownerObj){
    var atts = ownerObj.attachments || [];
    return ATTACH_ICON + (atts.length ? "<span>" + atts.length + "</span>" : "");
  }
  function updateAttachmentsBadge(row, task){
    var btn = row.querySelector(".attachments-badge");
    if(!btn) return;
    btn.classList.toggle("set", attachmentsBadgeSet(task));
    btn.innerHTML = attachmentsBadgeHtml(task);
  }
  function updateSubtaskAttachmentsBadge(itemRow, subtask){
    var btn = itemRow.querySelector(".subtask-attachments-badge");
    if(!btn) return;
    btn.classList.toggle("set", attachmentsBadgeSet(subtask));
    btn.innerHTML = attachmentsBadgeHtml(subtask);
  }

  function showAttachmentError(editorOrRow, message){
    var editor = editorOrRow.classList && editorOrRow.classList.contains("attachments-editor") ? editorOrRow : editorOrRow.closest(".attachments-editor");
    var errEl = editor && editor.querySelector(".attachment-error");
    if(errEl){ errEl.textContent = message; errEl.hidden = false; }
  }

  function openAttachment(att, itemRow){
    fetchAttachmentBlob(att).then(function(blob){
      var url = URL.createObjectURL(blob);
      window.open(url, "_blank");
      setTimeout(function(){ URL.revokeObjectURL(url); }, 60000);
    }).catch(function(e){ showAttachmentError(itemRow, "Couldn't open that attachment: " + e.message); });
  }
  function loadAttachmentThumb(itemRow, att){
    var thumb = itemRow.querySelector(".attachment-thumb");
    if(!thumb) return;
    fetchAttachmentBlob(att).then(function(blob){
      var url = URL.createObjectURL(blob);
      var img = document.createElement("img");
      img.src = url;
      img.alt = "";
      thumb.innerHTML = "";
      thumb.appendChild(img);
    }).catch(function(){ /* leave the file-type icon in place */ });
  }
  var PDF_THUMB_SCALE = 0.3; // the thumb slot is 32x32 (see .attachment-thumb) — no need to render full-res
  var attachmentPdfThumbCache = {}; // att.path -> Promise<dataURL>, so re-painting a row never re-renders the page
  function getPdfThumbDataUrl(att){
    if(attachmentPdfThumbCache[att.path]) return attachmentPdfThumbCache[att.path];
    var p = fetchAttachmentBlob(att).then(function(blob){ return blob.arrayBuffer(); })
      .then(function(buf){ return getPdfjsLib().then(function(pdfjsLib){ return pdfjsLib.getDocument({ data: buf }).promise; }); })
      .then(function(pdf){ return pdf.getPage(1); })
      .then(function(page){
        var viewport = page.getViewport({ scale: PDF_THUMB_SCALE });
        var canvas = document.createElement("canvas");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        var ctx = canvas.getContext("2d");
        return page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function(){
          return canvas.toDataURL("image/png");
        });
      }).catch(function(e){ delete attachmentPdfThumbCache[att.path]; throw e; });
    attachmentPdfThumbCache[att.path] = p;
    return p;
  }
  function loadPdfThumb(itemRow, att){
    var thumb = itemRow.querySelector(".attachment-thumb");
    if(!thumb) return;
    getPdfThumbDataUrl(att).then(function(dataUrl){
      if(!document.body.contains(thumb)) return;
      var img = document.createElement("img");
      img.src = dataUrl;
      img.alt = "";
      thumb.innerHTML = "";
      thumb.appendChild(img);
    }).catch(function(){ /* first page couldn't be rendered — leave the PDF icon in place */ });
  }

  function paintAttachmentRow(itemRow, ownerObj, att, onChange){
    var icon = att.type === "image" ? ATTACH_IMAGE_ICON : ATTACH_PDF_ICON;
    var statusLine = att.uploading ? "Uploading…" : (att.textStatus === "extracting" ? "Reading text…" : formatFileSize(att.size));
    var searchableTitle = att.textStatus === "done" && att.extractedText ? "This file's text is included in search" : "";
    itemRow.innerHTML =
      '<div class="attachment-thumb"' + (searchableTitle ? ' title="' + escapeHtml(searchableTitle) + '"' : '') + '>' + (att.uploading || att.textStatus === "extracting" ? ICON_SPIN : icon) + '</div>' +
      '<div class="attachment-info">' +
        '<button type="button" class="attachment-name-btn"' + (att.uploading ? " disabled" : "") + '>' + escapeHtml(att.name) + '</button>' +
        '<span class="attachment-size">' + escapeHtml(statusLine) + '</span>' +
      '</div>' +
      (att.uploading ? '' : '<button type="button" class="icon-btn danger attachment-remove" title="Remove attachment" aria-label="Remove attachment"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg></button>');
    if(!att.uploading){
      itemRow.querySelector(".attachment-name-btn").addEventListener("click", function(){ openAttachment(att, itemRow); });
      itemRow.querySelector(".attachment-remove").addEventListener("click", function(){ removeAttachmentFrom(ownerObj, att, itemRow, onChange); });
      if(att.type === "image" && att.textStatus !== "extracting") loadAttachmentThumb(itemRow, att);
      if(att.type === "pdf" && att.textStatus !== "extracting") loadPdfThumb(itemRow, att);
    }
  }
  function appendAttachmentRow(listEl, ownerObj, att, onChange){
    var itemRow = document.createElement("div");
    itemRow.className = "attachment-item";
    itemRow.setAttribute("data-attachment-id", att.id);
    paintAttachmentRow(itemRow, ownerObj, att, onChange);
    listEl.appendChild(itemRow);
    // Catches up any attachment that was never extracted — either it predates this
    // feature (migrated to textStatus "pending" on load) or a previous extraction
    // attempt was interrupted (page closed mid-OCR). Triggered lazily here, only when
    // its editor is actually opened, rather than for every attachment on every load.
    // Skipped while still uploading — uploadAttachment triggers extraction itself once
    // the upload succeeds, passing the in-memory File directly (faster, and avoids a
    // race trying to fetch a file from GitHub before it's actually finished uploading).
    if(att.textStatus === "pending" && !att.uploading) ensureAttachmentTextExtracted(ownerObj, att, itemRow, onChange);
    return itemRow;
  }
  function removeAttachmentFrom(ownerObj, att, itemRow, onChange){
    ownerObj.attachments = (ownerObj.attachments || []).filter(function(a){ return a.id !== att.id; });
    itemRow.remove();
    scheduleSave();
    if(onChange) onChange();
    delete attachmentBlobCache[att.path];
    delete attachmentPdfThumbCache[att.path];
    // Best-effort cleanup of the file in the repo — the reference is already gone from
    // tasks.json either way, so a failure here (offline, token revoked, etc.) shouldn't
    // block the removal the user just did; it just leaves an orphaned file in GitHub.
    if(config && att.sha){ ghDeleteFile(cfgFor(att.path), att.sha).catch(function(){}); }
  }
  function uploadAttachment(ownerObj, file, listEl, errEl, onChange){
    errEl.hidden = true;
    var isImage = /^image\//.test(file.type);
    var isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name || "");
    if(!isImage && !isPdf){
      errEl.textContent = "Only images and PDFs can be attached.";
      errEl.hidden = false;
      return;
    }
    if(file.size > ATTACHMENT_MAX_BYTES){
      errEl.textContent = "That file is " + formatFileSize(file.size) + " — attachments are limited to 12MB.";
      errEl.hidden = false;
      return;
    }
    if(!config){
      errEl.textContent = "Connect a GitHub repo in Settings first — attachments are stored there.";
      errEl.hidden = false;
      return;
    }
    var att = { id: uid(), name: file.name || "file", path: null, mime: file.type || (isPdf ? "application/pdf" : "application/octet-stream"), type: isImage ? "image" : "pdf", size: file.size, sha: null, uploading: true, extractedText: "", textStatus: "pending" };
    att.path = attachmentPathFor(att.id, att.name);
    if(!Array.isArray(ownerObj.attachments)) ownerObj.attachments = [];
    ownerObj.attachments.push(att);
    var itemRow = appendAttachmentRow(listEl, ownerObj, att, onChange);
    fileToBase64(file).then(function(base64){
      return ghPutBinary(cfgFor(att.path), base64);
    }).then(function(sha){
      att.sha = sha;
      att.uploading = false;
      scheduleSave();
      if(onChange) onChange();
      paintAttachmentRow(itemRow, ownerObj, att, onChange);
      ensureAttachmentTextExtracted(ownerObj, att, itemRow, onChange, file);
    }).catch(function(e){
      ownerObj.attachments = ownerObj.attachments.filter(function(a){ return a.id !== att.id; });
      itemRow.remove();
      errEl.textContent = "Upload failed: " + e.message;
      errEl.hidden = false;
    });
  }
  function renderAttachmentsInto(listEl, ownerObj, onChange){
    (ownerObj.attachments || []).forEach(function(att){ appendAttachmentRow(listEl, ownerObj, att, onChange); });
  }
  function buildAttachmentsEditorEl(ownerObj, onChange){
    var editor = document.createElement("div");
    editor.className = "attachments-editor";
    editor.setAttribute("tabindex", "-1"); // programmatically focusable so Cmd/Ctrl+V pastes here on open — see below
    editor.innerHTML =
      '<div class="attachment-list"></div>' +
      '<div class="attachment-add-row">' +
        '<label class="btn btn-sm btn-ghost attachment-add-label">' +
          '<input type="file" class="attachment-file-input" accept="image/*,application/pdf" hidden />+ Add attachment' +
        '</label>' +
        '<span class="attachment-hint">Images or PDFs, up to 12MB — or paste an image</span>' +
      '</div>' +
      '<div class="attachment-error" hidden></div>' +
      '<div class="notes-editor-actions"><button type="button" class="btn btn-sm btn-ghost" data-act="close">Close</button></div>';
    var listEl = editor.querySelector(".attachment-list");
    renderAttachmentsInto(listEl, ownerObj, onChange);
    var fileInput = editor.querySelector(".attachment-file-input");
    var errEl = editor.querySelector(".attachment-error");
    fileInput.addEventListener("change", function(){
      var file = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      if(!file) return;
      uploadAttachment(ownerObj, file, listEl, errEl, onChange);
    });
    editor.querySelector('[data-act="close"]').addEventListener("click", function(){ editor.remove(); });
    // Read fresh from the live DOM element at paste time (see the document-level "paste"
    // listener near boot) rather than relying on a separately-tracked "currently open editor"
    // variable, which could go stale if the editor were removed by some other code path.
    editor.__attachCtx = { ownerObj: ownerObj, listEl: listEl, errEl: errEl, onChange: onChange };
    return editor;
  }
  function toggleAttachmentsEditor(row, task){
    var existing = row.querySelector(".attachments-editor");
    if(existing){ existing.remove(); return; }
    document.querySelectorAll(".attachments-editor").forEach(function(el){ el.remove(); });
    if(!Array.isArray(task.attachments)) task.attachments = [];
    var editor = buildAttachmentsEditorEl(task, function(){ updateAttachmentsBadge(row, task); });
    row.querySelector(".task-main").appendChild(editor);
    editor.focus({ preventScroll: true });
  }
  function toggleSubtaskAttachmentsEditor(itemRow, subtask){
    var existing = itemRow.querySelector(".attachments-editor");
    if(existing){ existing.remove(); return; }
    document.querySelectorAll(".attachments-editor").forEach(function(el){ el.remove(); });
    if(!Array.isArray(subtask.attachments)) subtask.attachments = [];
    var editor = buildAttachmentsEditorEl(subtask, function(){ updateSubtaskAttachmentsBadge(itemRow, subtask); });
    itemRow.appendChild(editor);
    editor.focus({ preventScroll: true });
  }

  /* ---------------- stats page ---------------- */
  function computeStats(){
    var total=0, done=0, overdue=0, dueThisWeek=0, completedToday=0, completedThisWeek=0;
    var now = new Date(); now.setHours(0,0,0,0);
    var weekAhead = new Date(now); weekAhead.setDate(weekAhead.getDate()+7);
    var weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate()-7);
    var upcoming = [];
    var perHeading = [];
    state.headings.forEach(function(h){
      var hTotal=0, hDone=0;
      function tally(t){
        if(t.deletedAt) return; // in the recycle bin — not part of the live list, don't count it
        total++; hTotal++;
        if(t.done){
          done++; hDone++;
          if(t.completedAt){
            var d = new Date(t.completedAt);
            if(d >= now) completedToday++;
            if(d >= weekAgo) completedThisWeek++;
          }
        } else if(t.due){
          var due = new Date(t.due.date + "T00:00:00");
          if(due < now) overdue++;
          else if(due <= weekAhead) dueThisWeek++;
          upcoming.push({ task:t, heading:h });
        }
      }
      h.tasks.forEach(tally);
      h.subheadings.forEach(function(sh){ sh.tasks.forEach(tally); });
      perHeading.push({ heading:h, total:hTotal, done:hDone });
    });
    upcoming.sort(function(a,b){
      var ka = a.task.due.date + (a.task.due.time || "");
      var kb = b.task.due.date + (b.task.due.time || "");
      return ka < kb ? -1 : (ka > kb ? 1 : 0);
    });
    return { total:total, done:done, overdue:overdue, dueThisWeek:dueThisWeek, completedToday:completedToday, completedThisWeek:completedThisWeek, perHeading:perHeading, upcoming:upcoming.slice(0,6) };
  }

  function renderStats(){
    var root = document.getElementById("stats-view");
    if(!state){ root.innerHTML = ""; return; }
    var s = computeStats();
    var pct = s.total ? Math.round((s.done / s.total) * 100) : 0;

    var html = '<div class="stats-head"><h2>Statistics</h2><p>' + s.total + ' tasks across ' + state.headings.length + ' heading' + (state.headings.length===1?"":"s") + '.</p></div>';

    html += '<div class="stat-grid">' +
      '<div class="stat-tile"><div class="num mono">' + pct + '%</div><div class="label">Completed (' + s.done + '/' + s.total + ')</div></div>' +
      '<div class="stat-tile"><div class="num mono' + (s.overdue? ' danger':'') + '">' + s.overdue + '</div><div class="label">Overdue</div></div>' +
      '<div class="stat-tile"><div class="num mono">' + s.dueThisWeek + '</div><div class="label">Due in 7 days</div></div>' +
      '<div class="stat-tile"><div class="num mono accent2">' + s.completedThisWeek + '</div><div class="label">Completed this week</div></div>' +
    '</div>';

    html += '<div class="stats-section"><h3>By heading</h3>';
    if(!s.perHeading.length){
      html += '<div class="stats-empty">Add a heading to see a breakdown here.</div>';
    } else {
      html += s.perHeading.map(function(row){
        var pctH = row.total ? Math.round((row.done/row.total)*100) : 0;
        var color = row.heading.color || "var(--accent)";
        return '<div class="heading-bar-row">' +
          '<span class="hb-dot' + (row.heading.color ? '' : ' unset') + '" style="background:' + color + '"></span>' +
          '<span class="hb-name">' + escapeHtml(row.heading.title) + '</span>' +
          '<span class="hb-track"><span class="hb-fill" style="width:' + pctH + '%;background:' + color + '"></span></span>' +
          '<span class="hb-frac mono">' + row.done + '/' + row.total + '</span>' +
        '</div>';
      }).join("");
    }
    html += '</div>';

    html += '<div class="stats-section"><h3>Upcoming</h3>';
    if(!s.upcoming.length){
      html += '<div class="stats-empty">Nothing with a due date coming up.</div>';
    } else {
      html += '<div class="upcoming-list">' + s.upcoming.map(function(row){
        return '<div class="upcoming-row">' +
          '<span class="up-date mono">' + escapeHtml(formatDue(row.task.due)) + '</span>' +
          '<span class="up-text">' + escapeHtml(row.task.text) + '</span>' +
          '<span class="up-heading">' + escapeHtml(row.heading.title) + '</span>' +
        '</div>';
      }).join("") + '</div>';
    }
    html += '</div>';

    root.innerHTML = html;
  }

  document.getElementById("add-heading-btn").addEventListener("click", function(){
    addHeading("New heading");
    requestAnimationFrame(function(){
      var el = document.querySelector('.heading-card:last-child .heading-title');
      if(el){ el.focus(); el.select(); }
    });
  });

  /* ---------------- boot ---------------- */
  currentAppearance = loadAppearance();
  if(currentAppearance !== "system") document.documentElement.setAttribute("data-theme", currentAppearance);
  applyPalette(loadPaletteKey());
  applyFontPackage(loadFontKey());
  taskSortMode = loadTaskSortMode();
  syncSortButtons();
  listLayoutMode = loadListLayoutMode();
  syncListLayoutButtons();
  state = defaultState();
  config = loadConfig();
  render();
  if(config){ setStatus("not_configured"); loadFromGithub(); loadIcsFeeds(); loadDigestSettings(); }
  else { setStatus("not_configured"); openSettings(); }

  var gcfgBoot = loadGcalConfig();
  gcalClientId = gcfgBoot && gcfgBoot.clientId;
  if(gcalClientId){
    waitForGis(function(){ tryAutoConnectGcal(); }, 25);
  } else {
    setGcalStatus("not_configured");
  }

  /* ---------------- paste an image from the clipboard into an open attachments panel ----------------
     Reuses uploadAttachment() as-is — a pasted image arrives as a File via getAsFile(), same
     shape as one picked through the file input. Only intercepts when an attachments panel is
     actually open AND focus isn't sitting in some unrelated field (notes, task title, search),
     so pasting text elsewhere on the page is never affected. */
  document.addEventListener("paste", function(e){
    var editor = document.querySelector(".attachments-editor");
    if(!editor || !editor.__attachCtx) return;
    var active = document.activeElement;
    var focusIsElsewhere = active && active !== document.body && !editor.contains(active);
    if(focusIsElsewhere) return;
    var items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    var imageFile = null;
    for(var i=0; i<items.length; i++){
      if(/^image\//.test(items[i].type)){ imageFile = items[i].getAsFile(); break; }
    }
    if(!imageFile) return; // nothing image-shaped on the clipboard — leave normal paste alone
    e.preventDefault();
    // Clipboard images usually have no real filename (every browser calls it "image.png" even
    // for a copied JPEG), so give each paste a distinct name rather than letting them all look
    // identical in the list. Works for any image/* type (png, jpeg, gif, webp, …) — not just
    // PNG — since the detection above never checked for a specific subtype.
    var extBySubtype = { jpeg: "jpg" };
    var subtype = (imageFile.type.split("/")[1] || "png").split("+")[0];
    var ext = extBySubtype[subtype] || subtype;
    var named = new File([imageFile], "pasted-" + Date.now() + "." + ext, { type: imageFile.type });
    var ctx = editor.__attachCtx;
    uploadAttachment(ctx.ownerObj, named, ctx.listEl, ctx.errEl, ctx.onChange);
  });

  /* ---------------- PWA: install prompt + service worker ---------------- */
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline shell is a nice-to-have, not critical */ });
    });
  }
  var deferredInstallPrompt = null;
  var installPromptBusy = false;
  var installBtn = document.getElementById("install-app-btn");
  function isStandalone(){
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
  }
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredInstallPrompt = e;
    if(!isStandalone()) installBtn.hidden = false;
  });
  installBtn.addEventListener("click", function(){
    if(!deferredInstallPrompt || installPromptBusy) return;
    installPromptBusy = true;
    installBtn.disabled = true;
    var capturedPrompt = deferredInstallPrompt;
    // Previously this called deferredInstallPrompt.prompt() directly with no error handling.
    // On some Android Chrome builds .prompt() can throw (or its promise can reject) instead
    // of showing the dialog — with no try/catch, that left the button permanently disabled
    // with zero feedback, which is exactly what "I click it and nothing happens" looks like.
    // Wrapping the call in Promise.resolve().then(...) turns a synchronous throw into a
    // rejection so the .catch() below always runs.
    Promise.resolve().then(function(){
      return capturedPrompt.prompt();
    }).then(function(){
      return capturedPrompt.userChoice;
    }).then(function(){
      // Accepted or dismissed — either way this event is spent per spec, so wait for a
      // fresh beforeinstallprompt before offering install again.
      deferredInstallPrompt = null;
      installBtn.hidden = true;
    }).catch(function(err){
      // .prompt() itself failed — leave deferredInstallPrompt in place and the button
      // visible/enabled so the user can try again, instead of a silently-stuck button.
      console.warn("Daybook: install prompt failed —", err);
    }).finally(function(){
      installPromptBusy = false;
      installBtn.disabled = false;
    });
  });
  window.addEventListener("appinstalled", function(){ installBtn.hidden = true; deferredInstallPrompt = null; });
})();
</script>
</body>
</html>
