<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<title>Daybook</title>
<style>
  :root{
    --ink: #1c2130;
    --ink-soft: #3a4152;
    --paper: #eef0f3;
    --paper-raised: #ffffff;
    --paper-sunken: #e3e6eb;
    --line: #d7dbe1;
    --line-soft: #e4e7eb;
    --muted: #5b6270;
    --accent: #a8672a;
    --accent-ink: #ffffff;
    --accent-2: #3f7d6e;
    --danger: #b8452f;
    --focus: #2f5fd6;
    --shadow: 0 1px 2px rgba(28,33,48,0.06), 0 8px 24px -12px rgba(28,33,48,0.18);
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink: #ece9df; --ink-soft: #c8c4b6; --paper: #14171f; --paper-raised: #1b1f2a;
      --paper-sunken: #10131a; --line: #2c3140; --line-soft: #232838; --muted: #939aab;
      --accent: #d99a4e; --accent-ink: #1c1200; --accent-2: #67ab9a; --danger: #e08469;
      --focus: #7ea1ff; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink: #ece9df; --ink-soft: #c8c4b6; --paper: #14171f; --paper-raised: #1b1f2a;
    --paper-sunken: #10131a; --line: #2c3140; --line-soft: #232838; --muted: #939aab;
    --accent: #d99a4e; --accent-ink: #1c1200; --accent-2: #67ab9a; --danger: #e08469;
    --focus: #7ea1ff; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    color-scheme: dark;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    overflow-x: hidden;
    background: var(--paper); color: var(--ink);
    font-family: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3{ font-family: "Fraunces", Georgia, "Times New Roman", serif; text-wrap: balance; margin: 0; }
  .mono{ font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  button{ font-family: inherit; }
  ::selection{ background: color-mix(in srgb, var(--accent) 35%, transparent); }
  :focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .shell{ max-width: 900px; margin: 0 auto; padding: 0 20px 80px; }

  header.top{
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .top-inner{ max-width: 900px; margin: 0 auto; display:flex; align-items:center; gap:12px; padding:16px 20px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:baseline; gap:10px; margin-right:auto; }
  .brand h1{ font-size:1.5rem; font-weight:600; letter-spacing:-0.01em; }
  .brand .tag{ color:var(--muted); font-size:0.8rem; }
  .header-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  .view-tabs{ display:flex; gap:2px; background:var(--paper-sunken); padding:3px; border-radius:var(--radius-m); }
  .tab-btn{ border:none; background:transparent; padding:6px 13px; border-radius:calc(var(--radius-m) - 3px); font-size:0.82rem; font-weight:500; color:var(--muted); cursor:pointer; transition:background .12s ease,color .12s ease; }
  .tab-btn.active{ background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow); }
  .tab-btn:hover:not(.active){ color:var(--ink); }

  .status-pill{
    display:flex; align-items:center; gap:6px; font-size:0.78rem; padding:5px 10px 5px 8px;
    border-radius:999px; border:1px solid var(--line); background:var(--paper-raised); color:var(--muted); white-space:nowrap;
  }
  .status-pill.clickable{ cursor:pointer; transition:border-color .12s ease; }
  .status-pill.clickable:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .status-pill[data-state="connected"] .status-dot{ background:var(--accent-2); }
  .status-pill[data-state="connected"]{ color:var(--accent-2); border-color:color-mix(in srgb, var(--accent-2) 40%, var(--line)); }
  .status-pill[data-state="warn"] .status-dot{ background:var(--accent); }
  .status-pill[data-state="warn"]{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .status-pill[data-state="error"] .status-dot{ background:var(--danger); }
  .status-pill[data-state="error"]{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 35%, var(--line)); }

  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper-raised);
    color:var(--ink); padding:7px 12px; border-radius:var(--radius-m); font-size:0.85rem; font-weight:500;
    cursor:pointer; box-shadow:var(--shadow); transition: transform .12s ease, border-color .12s ease;
  }
  .btn:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; box-shadow:none; border-color:transparent; color:var(--muted); }
  .btn-ghost:hover{ color:var(--ink); background:var(--paper-sunken); }
  .btn-danger{ color:var(--danger); }
  .btn-sm{ padding:4px 9px; font-size:0.78rem; border-radius:var(--radius-s); }
  .btn[disabled]{ opacity:0.5; cursor:default; }

  .banner{ max-width:900px; margin:14px auto 0; padding:10px 20px; }
  .banner-inner{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background: color-mix(in srgb, var(--accent) 12%, var(--paper-raised));
    border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    border-radius:var(--radius-m); padding:10px 14px; font-size:0.85rem;
  }
  .banner-inner.danger{ background: color-mix(in srgb, var(--danger) 12%, var(--paper-raised)); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
  .banner-inner p{ margin:0; flex:1; min-width:220px; color:var(--ink-soft); }

  main{ margin-top:24px; }

  /* ---------- shared entrance / motion ---------- */
  section.heading-card, .sub-block, .task-row{ transition: opacity .18s ease, transform .18s ease; }
  section.heading-card.enter, .sub-block.enter, .task-row.enter{ opacity:0; transform: translateY(-5px); }
  section.heading-card.dragging{ opacity:0.45; }

  section.heading-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l);
    margin-bottom:18px; box-shadow:var(--shadow); overflow:hidden;
  }
  .heading-bar{ display:flex; align-items:center; gap:8px; padding:14px 16px; border-left:4px solid var(--accent); position:relative; }
  .heading-bar.drop-before{ box-shadow: inset 0 2px 0 var(--accent); }
  .heading-bar.drop-after{ box-shadow: inset 0 -2px 0 var(--accent); }
  .heading-bar.drop-target{ background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .grip{
    display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:grab;
    padding:4px; border-radius:4px; flex-shrink:0; touch-action:none;
  }
  .grip:hover{ color:var(--ink); background:var(--paper-sunken); }
  .grip:active{ cursor:grabbing; }
  .collapse-btn{ background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; display:flex; align-items:center; justify-content:center; border-radius:4px; flex-shrink:0; }
  .collapse-btn svg{ transition: transform .15s ease; }
  .heading-card.collapsed > .heading-bar .collapse-btn svg{ transform: rotate(-90deg); }
  .sub-block.collapsed > .sub-bar .collapse-btn svg{ transform: rotate(-90deg); }
  .color-dot{
    width:15px; height:15px; border-radius:50%; border:none; padding:0; cursor:pointer; flex-shrink:0;
    box-shadow:0 0 0 1px var(--line); background:var(--accent);
  }
  .color-dot:hover{ box-shadow:0 0 0 2px color-mix(in srgb, var(--ink) 35%, var(--line)); }
  .color-popover{
    position:absolute; top:100%; left:44px; margin-top:6px; z-index:15;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
    box-shadow:var(--shadow); padding:8px; display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
  }
  .color-popover .swatch{
    width:20px; height:20px; border-radius:50%; border:none; padding:0; cursor:pointer;
    box-shadow:0 0 0 1px var(--line);
  }
  .color-popover .swatch:hover{ box-shadow:0 0 0 2px color-mix(in srgb, var(--ink) 35%, var(--line)); }
  .color-popover .swatch[data-color=""]{ background: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 5px); }
  .heading-title{
    font-size:1.15rem; font-weight:600; flex:1; min-width:0; background:transparent; border:none;
    color:var(--ink); font-family:"Fraunces",serif; padding:2px 4px; border-radius:4px;
  }
  .heading-title:focus{ background:var(--paper-sunken); }
  .heading-count{ color:var(--muted); font-size:0.78rem; white-space:nowrap; }
  .heading-actions{ display:flex; gap:4px; }

  .heading-body{ display:grid; grid-template-rows: 1fr; transition: grid-template-rows .22s ease; }
  .heading-card.collapsed .heading-body{ grid-template-rows: 0fr; }
  .heading-body-inner{ overflow:hidden; min-height:0; }
  .heading-body-content{ padding:0 16px 16px; }

  .heading-dropzone-end{ height:10px; }
  .heading-dropzone-end.drop-target{ height:10px; border-radius:6px; background: color-mix(in srgb, var(--accent) 25%, transparent); }

  .sub-block{ margin-top:6px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .sub-block:first-child{ border-top:none; }
  .sub-block.dragging{ opacity:0.45; }
  .sub-bar{ display:flex; align-items:center; gap:6px; margin-bottom:6px; position:relative; }
  .sub-bar.drop-before{ box-shadow: inset 0 2px 0 var(--accent-2); }
  .sub-bar.drop-after{ box-shadow: inset 0 -2px 0 var(--accent-2); }
  .sub-bar.drop-target{ background: color-mix(in srgb, var(--accent-2) 10%, transparent); border-radius:4px; }
  .grip-sm{ width:16px; height:16px; }
  .sub-title{
    font-size:0.92rem; font-weight:600; color:var(--ink-soft); flex:1; min-width:0; background:transparent;
    border:none; padding:2px 4px; border-radius:4px; font-family:"Public Sans",sans-serif; text-transform:uppercase; letter-spacing:0.04em;
  }
  .sub-title:focus{ background:var(--paper-sunken); }
  .sub-actions{ display:flex; gap:2px; }
  .sub-count{ color:var(--muted); font-size:0.72rem; }
  .sub-dropzone-end{ height:8px; }
  .sub-dropzone-end.drop-target{ height:8px; border-radius:6px; background: color-mix(in srgb, var(--accent-2) 25%, transparent); }

  .sub-body{ display:grid; grid-template-rows: 1fr; transition: grid-template-rows .2s ease; }
  .sub-block.collapsed .sub-body{ grid-template-rows: 0fr; }
  .sub-body-inner{ overflow:hidden; min-height:0; }

  .task-list{ display:flex; flex-direction:column; min-height:4px; }
  .task-list.drop-target{ background: color-mix(in srgb, var(--accent-2) 8%, transparent); border-radius:6px; }
  .task-row{ display:flex; align-items:flex-start; gap:8px; padding:7px 4px; border-radius:var(--radius-s); position:relative; }
  .task-row:hover{ background:var(--paper-sunken); }
  .task-row.dragging{ opacity:0.45; }
  .task-row.drop-before{ box-shadow: inset 0 2px 0 var(--accent-2); }
  .task-row.drop-after{ box-shadow: inset 0 -2px 0 var(--accent-2); }
  .check{
    width:19px; height:19px; margin-top:2px; border-radius:5px; border:1.5px solid var(--line);
    background:var(--paper-raised); cursor:pointer; flex-shrink:0; position:relative; appearance:none;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .check:checked{ background:var(--accent-2); border-color:var(--accent-2); }
  .check:checked::after{
    content:""; position:absolute; left:5px; top:1px; width:5px; height:9px; border:solid white; border-width:0 2px 2px 0;
    transform:rotate(40deg); animation: tick-pop .18s ease;
  }
  @keyframes tick-pop{ from{ transform:scale(0.3) rotate(40deg); opacity:0; } to{ transform:scale(1) rotate(40deg); opacity:1; } }
  .task-main{ flex:1; min-width:0; }
  .task-text{ width:100%; border:none; background:transparent; color:var(--ink); font:inherit; font-size:0.92rem; padding:2px 4px; border-radius:4px; }
  .task-text:focus{ background:var(--paper-sunken); }
  .task-row.done .task-text{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); transition: color .2s ease; }
  .task-meta{ display:flex; align-items:center; gap:8px; margin-top:2px; padding-left:4px; flex-wrap:wrap; }
  .due-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:0.74rem; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:2px 9px 2px 8px; cursor:pointer; background:var(--paper-raised);
  }
  .due-badge:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .due-badge.set{ color:var(--ink-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .due-badge.overdue{ color:var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
  .sync-icon{ width:12px; height:12px; flex-shrink:0; }
  .sync-note{ font-size:0.72rem; color:var(--danger); }
  .task-actions{ display:flex; gap:2px; opacity:0; transition:opacity .1s; flex-shrink:0; }
  .task-row:hover .task-actions, .task-row:focus-within .task-actions{ opacity:1; }
  .icon-btn{ background:none; border:none; color:var(--muted); cursor:pointer; padding:5px; border-radius:5px; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ color:var(--ink); background:var(--paper-sunken); }
  .icon-btn.danger:hover{ color:var(--danger); }

  .due-editor{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:var(--paper-sunken); border:1px solid var(--line); border-radius:var(--radius-s); padding:6px 8px; margin-top:4px; }
  .due-editor input[type="date"], .due-editor input[type="time"]{ font:inherit; font-size:0.8rem; border:1px solid var(--line); border-radius:4px; padding:3px 5px; background:var(--paper-raised); color:var(--ink); }
  .due-editor label{ display:flex; align-items:center; gap:4px; font-size:0.78rem; color:var(--muted); }

  .ghost-add{
    display:flex; align-items:center; gap:6px; color:var(--muted); background:none; border:1px dashed var(--line);
    border-radius:var(--radius-s); padding:6px 10px; font-size:0.82rem; cursor:pointer; margin-top:4px; width:100%; justify-content:flex-start;
  }
  .ghost-add:hover{ color:var(--ink); border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }

  .empty-state{ text-align:center; padding:64px 20px; color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius-l); margin-top:12px; }
  .empty-state h2{ font-size:1.3rem; color:var(--ink); margin-bottom:8px; }
  .empty-state p{ max-width:420px; margin:0 auto 18px; font-size:0.9rem; }

  /* ---------- stats page ---------- */
  .stats-head{ margin-bottom:18px; }
  .stats-head h2{ font-size:1.4rem; font-weight:600; }
  .stats-head p{ color:var(--muted); font-size:0.86rem; margin-top:4px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:26px; }
  .stat-tile{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; box-shadow:var(--shadow); }
  .stat-tile .num{ font-family:"Fraunces",serif; font-size:1.9rem; font-weight:600; line-height:1; }
  .stat-tile .num.danger{ color:var(--danger); }
  .stat-tile .num.accent2{ color:var(--accent-2); }
  .stat-tile .label{ font-size:0.78rem; color:var(--muted); margin-top:5px; }
  .stats-section{ margin-bottom:26px; }
  .stats-section h3{ font-size:0.95rem; font-weight:600; margin-bottom:10px; }
  .heading-bar-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .heading-bar-row .hb-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .heading-bar-row .hb-name{ font-size:0.85rem; flex:0 0 140px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .heading-bar-row .hb-track{ flex:1; height:7px; background:var(--paper-sunken); border-radius:99px; overflow:hidden; }
  .heading-bar-row .hb-fill{ display:block; height:100%; border-radius:99px; transition:width .3s ease; }
  .heading-bar-row .hb-frac{ font-size:0.72rem; color:var(--muted); flex-shrink:0; width:44px; text-align:right; }
  .upcoming-list{ display:flex; flex-direction:column; gap:2px; }
  .upcoming-row{ display:flex; align-items:baseline; gap:10px; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:0.85rem; }
  .upcoming-row:last-child{ border-bottom:none; }
  .upcoming-row .up-date{ color:var(--muted); font-size:0.76rem; width:64px; flex-shrink:0; }
  .upcoming-row .up-text{ flex:1; min-width:0; }
  .upcoming-row .up-heading{ color:var(--muted); font-size:0.74rem; flex-shrink:0; }
  .stats-empty{ color:var(--muted); font-size:0.85rem; padding:20px 0; text-align:center; border:1px dashed var(--line); border-radius:var(--radius-m); }

  .save-indicator{
    position:fixed; bottom:18px; right:18px; z-index:30; background:var(--paper-raised); border:1px solid var(--line);
    box-shadow:var(--shadow); border-radius:999px; padding:7px 14px; font-size:0.76rem; color:var(--muted);
    display:flex; align-items:center; gap:6px; opacity:0; transform:translateY(6px); transition:opacity .2s ease, transform .2s ease; pointer-events:none;
  }
  .save-indicator.show{ opacity:1; transform:none; }
  .save-indicator .status-dot{ width:6px; height:6px; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,12,18,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-box{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); padding:22px; max-width:420px; width:100%; box-shadow:var(--shadow); max-height:90vh; overflow:auto; }
  .modal-box h3{ font-size:1.1rem; margin-bottom:6px; }
  .modal-box p{ font-size:0.85rem; color:var(--muted); margin:0 0 16px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:0.78rem; color:var(--muted); margin-bottom:4px; font-weight:600; letter-spacing:0.01em; }
  .field input, .field select{ width:100%; font:inherit; font-size:0.88rem; padding:8px 10px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--paper-sunken); color:var(--ink); }
  .field input:focus, .field select:focus{ background:var(--paper-raised); }
  .field-hint{ font-size:0.72rem; color:var(--muted); margin-top:3px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-error{ font-size:0.8rem; color:var(--danger); margin:-6px 0 12px; }
  .modal-note{ font-size:0.8rem; color:var(--muted); background:var(--paper-sunken); border-radius:var(--radius-s); padding:8px 10px; margin:-4px 0 14px; }

  /* ---------- theme popover ---------- */
  .theme-popover{
    position:fixed; z-index:40; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
    box-shadow:var(--shadow); padding:8px; display:flex; flex-direction:column; gap:2px; min-width:170px;
  }
  .theme-option{
    display:flex; align-items:center; gap:9px; border:none; background:transparent; padding:8px 9px; border-radius:var(--radius-s);
    cursor:pointer; font:inherit; font-size:0.85rem; color:var(--ink); text-align:left;
  }
  .theme-option:hover{ background:var(--paper-sunken); }
  .theme-option.active{ background:color-mix(in srgb, var(--accent) 12%, var(--paper-sunken)); font-weight:600; }
  .theme-swatch{ display:flex; flex-shrink:0; }
  .theme-swatch span{ width:13px; height:13px; border-radius:50%; box-shadow:0 0 0 1px var(--line); }
  .theme-swatch span + span{ margin-left:-4px; }
  .theme-section-label{ font-size:0.7rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); padding:6px 9px 3px; }
  .theme-appearance-row{ display:flex; gap:2px; background:var(--paper-sunken); padding:3px; border-radius:var(--radius-m); margin:0 4px 8px; }
  .theme-appearance-btn{
    flex:1; border:none; background:transparent; padding:6px 4px; border-radius:calc(var(--radius-m) - 3px);
    font-size:0.78rem; font-weight:500; color:var(--muted); cursor:pointer;
  }
  .theme-appearance-btn.active{ background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow); }
  .theme-appearance-btn:hover:not(.active){ color:var(--ink); }

  /* ---------- calendar view ---------- */
  .cal-head{ display:flex; align-items:center; gap:10px; margin:22px 0 16px; flex-wrap:wrap; }
  .cal-head h2{ font-size:1.25rem; flex:1; min-width:140px; }
  .cal-nav{ display:flex; align-items:center; gap:2px; }
  .cal-nav-btn{ border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); width:30px; height:30px; border-radius:var(--radius-s); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cal-nav-btn:hover{ background:var(--paper-sunken); }
  .cal-mode-toggle{ display:flex; gap:2px; background:var(--paper-sunken); padding:3px; border-radius:var(--radius-m); }
  .cal-loading{ font-size:0.78rem; color:var(--muted); }
  .cal-error{ font-size:0.82rem; color:var(--danger); margin-bottom:12px; }

  .cal-month-grid{ border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; background:var(--paper-raised); box-shadow:var(--shadow); }
  .cal-weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line); }
  .cal-weekday-row span{ padding:8px 6px; font-size:0.72rem; font-weight:600; color:var(--muted); text-align:center; letter-spacing:0.03em; text-transform:uppercase; }
  .cal-month-body{ display:grid; grid-template-columns:repeat(7,1fr); }
  .cal-day-cell{
    min-height:92px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
    padding:5px; display:flex; flex-direction:column; gap:3px; cursor:pointer; position:relative;
  }
  .cal-day-cell:hover{ background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .cal-month-body .cal-day-cell:nth-child(7n){ border-right:none; }
  .cal-day-cell.outside{ background:var(--paper-sunken); }
  .cal-day-cell.outside .cal-day-num{ color:var(--muted); opacity:0.6; }
  .cal-day-num{ font-family:"IBM Plex Mono",monospace; font-size:0.78rem; color:var(--ink-soft); }
  .cal-day-cell.today .cal-day-num{
    display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px;
    background:var(--accent); color:var(--accent-ink); border-radius:50%; font-weight:600;
  }
  .cal-chip{
    font-size:0.68rem; padding:2px 5px; border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:color-mix(in srgb, var(--accent) 16%, var(--paper-raised)); color:var(--ink); border-left:3px solid var(--accent);
  }
  .cal-chip.done{ text-decoration:line-through; opacity:0.6; }
  .cal-chip.ext-event{ background:var(--paper-sunken); border-left:3px solid var(--muted); color:var(--muted); font-style:italic; }
  .cal-more{ font-size:0.66rem; color:var(--muted); padding:1px 5px; }

  .cal-week-grid{ display:grid; grid-template-columns:repeat(7,minmax(112px,1fr)); gap:10px; align-items:start; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; }
  .cal-week-col{ border:1px solid var(--line); border-radius:var(--radius-m); background:var(--paper-raised); box-shadow:var(--shadow); min-height:220px; display:flex; flex-direction:column; }
  .cal-week-col-head{ padding:8px 10px; border-bottom:1px solid var(--line-soft); text-align:center; cursor:pointer; }
  .cal-week-col-head:hover{ background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .cal-week-col-head .wd{ font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; }
  .cal-week-col-head .dn{ font-family:"IBM Plex Mono",monospace; font-size:0.95rem; }
  .cal-week-col.today .cal-week-col-head .dn{
    display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
    background:var(--accent); color:var(--accent-ink); border-radius:50%; font-weight:600;
  }
  .cal-week-body{ padding:6px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .cal-week-chip{
    font-size:0.72rem; padding:4px 6px; border-radius:6px; background:color-mix(in srgb, var(--accent) 14%, var(--paper-raised));
    border-left:3px solid var(--accent); color:var(--ink); line-height:1.3;
  }
  .cal-week-chip.done{ text-decoration:line-through; opacity:0.6; }
  .cal-week-chip.ext-event{ background:var(--paper-sunken); border-left:3px solid var(--muted); color:var(--muted); font-style:italic; }
  .cal-week-chip .t{ display:block; font-size:0.62rem; color:var(--muted); font-family:"IBM Plex Mono",monospace; }
  .cal-week-add{ border:1px dashed var(--line); background:transparent; color:var(--muted); border-radius:6px; padding:5px 6px; font-size:0.72rem; cursor:pointer; }
  .cal-week-add:hover{ color:var(--ink); border-color:color-mix(in srgb, var(--ink) 25%, var(--line)); }

  .quickadd-popover{
    position:fixed; z-index:40; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
    box-shadow:var(--shadow); padding:12px; width:230px; display:flex; flex-direction:column; gap:8px;
  }
  .quickadd-popover .qa-title{ font-size:0.78rem; font-weight:600; color:var(--muted); }
  .quickadd-popover input, .quickadd-popover select{
    width:100%; font:inherit; font-size:0.85rem; padding:7px 9px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--paper-sunken); color:var(--ink);
  }
  .quickadd-popover .qa-actions{ display:flex; gap:6px; justify-content:flex-end; }
</style>
</head>

  <header class="top">

          Theme
        </button>

        <button class="status-pill clickable" id="gcal-pill" data-state="off">
          <span class="status-dot"></span><span id="gcal-pill-text">Set up Calendar</span>
        </button>
        <button class="btn btn-sm" id="settings-btn" aria-label="GitHub settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1-1.55 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.7 1.7 0 00.34-1.87 1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09a1.7 1.7 0 001.55-1 1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06a1.7 1.7 0 001.87.34H9a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06a1.7 1.7 0 00-.34 1.87V9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>
          Settings
        </button>
      </div>
    </div>
  </header>

  <div class="banner" id="banner" hidden>
    <div class="banner-inner" id="banner-inner">
      <p id="banner-text"></p>
      <button class="btn btn-sm btn-ghost" id="banner-dismiss">Dismiss</button>

  <main>

      <div id="headings-root"></div>

<div class="save-indicator" id="save-indicator"><span class="status-dot"></span><span id="save-indicator-text">Saved</span></div>
<div id="modal-root"></div>

<script>
(function(){
  "use strict";

  var CONFIG_KEY = "daybook-github-config-v1";
  var state = null;
  var sha = null;
  var config = null;
  var connectionStatus = "not_configured"; // not_configured | connected | error
  var pendingSave = false;
  var saveTimer = null;
  var lastFetchAt = 0;
  var viewMode = "list";
  var lastAddedId = null;

  /* ---------------- theme palettes ---------------- */
  var PALETTE_KEY = "daybook-palette-v1";
  var PALETTES = {
    ledger: { name: "Ledger", light: { accent: "#a8672a", accent2: "#3f7d6e" }, dark: { accent: "#d99a4e", accent2: "#67ab9a" } },
    ocean:  { name: "Ocean",  light: { accent: "#2f6690", accent2: "#1f8a70" }, dark: { accent: "#6fb3e0", accent2: "#4fc7a4" } },
    plum:   { name: "Plum",   light: { accent: "#7a4fa0", accent2: "#b3486b" }, dark: { accent: "#b48ee0", accent2: "#e07aa0" } },
    forest: { name: "Forest", light: { accent: "#4a6741", accent2: "#2f7d8c" }, dark: { accent: "#8fbf7c", accent2: "#5fb6c9" } },
    slate:  { name: "Slate",  light: { accent: "#4a5568", accent2: "#6b7a3f" }, dark: { accent: "#a3adc2", accent2: "#b7c980" } }
  };
  function loadPaletteKey(){
    try{ var k = localStorage.getItem(PALETTE_KEY); return (k && PALETTES[k]) ? k : "ledger"; } catch(e){ return "ledger"; }
  }
  function effectiveIsDark(){
    var forced = document.documentElement.getAttribute("data-theme");
    if(forced === "dark") return true;
    if(forced === "light") return false;
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }
  function applyPalette(key){
    if(!PALETTES[key]) key = "ledger";
    try{ localStorage.setItem(PALETTE_KEY, key); }catch(e){}
    var root = document.documentElement;
    if(key === "ledger"){
      root.style.removeProperty("--accent");
      root.style.removeProperty("--accent-2");
    } else {
      var pal = PALETTES[key];
      var vals = effectiveIsDark() ? pal.dark : pal.light;
      root.style.setProperty("--accent", vals.accent);
      root.style.setProperty("--accent-2", vals.accent2);
    }
    currentPaletteKey = key;
  }
  var currentPaletteKey = "ledger";

  /* ---------------- appearance (light / dark / system) ---------------- */
  var APPEARANCE_KEY = "daybook-appearance-v1";
  var currentAppearance = "system";
  function loadAppearance(){
    try{
      var v = localStorage.getItem(APPEARANCE_KEY);
      return (v === "light" || v === "dark") ? v : "system";
    }catch(e){ return "system"; }
  }
  function applyAppearance(mode){
    if(mode !== "light" && mode !== "dark") mode = "system";
    try{ localStorage.setItem(APPEARANCE_KEY, mode); }catch(e){}
    var root = document.documentElement;
    if(mode === "system") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", mode);
    currentAppearance = mode;
    applyPalette(currentPaletteKey);
  }
  if(window.matchMedia){
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){ applyPalette(currentPaletteKey); });
  }

  function uid(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }
  function defaultState(){ return { version: 3, headings: [], googleCalendarId: null, updatedAt: null }; }
  function escapeHtml(s){
    return (s == null ? "" : String(s)).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* migrate older saves */
  function normalizeState(s){
    if(!s || !Array.isArray(s.headings)) return defaultState();
    if(s.googleCalendarId === undefined) s.googleCalendarId = null;
    s.headings.forEach(function(h){
      if(!Array.isArray(h.tasks)) h.tasks = [];
      if(!Array.isArray(h.subheadings)) h.subheadings = [];
      if(h.color === undefined) h.color = null;
      if(h.collapsed === undefined) h.collapsed = false;
      h.tasks.forEach(normalizeTask);
      h.subheadings.forEach(function(sh){
        if(!Array.isArray(sh.tasks)) sh.tasks = [];
        if(sh.collapsed === undefined) sh.collapsed = false;
        sh.tasks.forEach(normalizeTask);
      });
    });
    s.version = 3;
    return s;
  }
  function normalizeTask(t){
    if(t.completedAt === undefined) t.completedAt = null;
    if(t.calendarEventId === undefined) t.calendarEventId = null;
    if(t.syncError === undefined) t.syncError = null;
  }

  /* ---------------- config (per-device, in this browser only) ---------------- */
  function loadConfig(){
    try{ return JSON.parse(localStorage.getItem(CONFIG_KEY) || "null"); }
    catch(e){ return null; }
  }
  function saveConfig(cfg){ localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }
  function clearConfig(){ localStorage.removeItem(CONFIG_KEY); }

  /* ---------------- base64 <-> utf8 ---------------- */
  function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUtf8(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g, "")))); }

  /* ---------------- GitHub Contents API ---------------- */
  function contentsUrl(cfg, withRef){
    var url = "https://api.github.com/repos/" + encodeURIComponent(cfg.owner) + "/" + encodeURIComponent(cfg.repo) + "/contents/" + cfg.path.split("/").map(encodeURIComponent).join("/");
    if(withRef) url += "?ref=" + encodeURIComponent(cfg.branch);
    return url;
  }

  function ghHeaders(cfg, extra){
    var h = { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" };
    if(extra) for(var k in extra) h[k] = extra[k];
    return h;
  }

  function describeStatus(res, json){
    if(res.status === 401) return "That token was rejected. Check it's valid and hasn't expired.";
    if(res.status === 403) return (json && /rate limit/i.test(json.message||"")) ? "GitHub rate limit hit — wait a bit and try again." : "That token doesn't have permission for this repo. It needs Contents: Read and write.";
    if(res.status === 404) return "Repo, branch, or path not found — double check the owner/repo/branch.";
    if(res.status === 409) return "conflict";
    if(res.status === 422) return (json && json.message) || "GitHub rejected the request (422).";
    return (json && json.message) || ("GitHub error (" + res.status + ")");
  }

  function ghGet(cfg){
    return fetch(contentsUrl(cfg, true), { headers: ghHeaders(cfg) }).then(function(res){
      if(res.status === 404){
        return { exists:false, sha:null, data:null };
      }
      return res.json().then(function(json){
        if(!res.ok) throw new Error(describeStatus(res, json));
        var text = b64DecodeUtf8(json.content);
        var data;
        try{ data = JSON.parse(text); } catch(e){ throw new Error("The file at that path isn't valid Daybook JSON."); }
        return { exists:true, sha: json.sha, data: data };
      });
    });
  }

  function ghPut(cfg, dataObj, prevSha){
    var body = {
      message: "Update Daybook tasks — " + new Date().toISOString(),
      content: b64EncodeUtf8(JSON.stringify(dataObj, null, 2)),
      branch: cfg.branch
    };
    if(prevSha) body.sha = prevSha;
    return fetch(contentsUrl(cfg, false), {
      method: "PUT", headers: ghHeaders(cfg, {"Content-Type":"application/json"}), body: JSON.stringify(body)
    }).then(function(res){
      return res.json().then(function(json){
        if(!res.ok){
          var msg = describeStatus(res, json);
          if(msg === "conflict"){ var err = new Error("conflict"); err.code = "conflict"; throw err; }
          throw new Error(msg);
        }
        return json.content.sha;
      });
    });
  }

  /* ---------------- status / banner ---------------- */
  function setStatus(kind, detail){
    connectionStatus = kind;
    var pill = document.getElementById("status-pill");
    var text = document.getElementById("status-text");
    var syncBtn = document.getElementById("sync-now-btn");
    if(kind === "connected"){
      pill.setAttribute("data-state", "connected");
      text.textContent = config.owner + "/" + config.repo;
      syncBtn.disabled = false;
    } else if(kind === "not_configured"){
      pill.setAttribute("data-state", "off");
      text.textContent = "Not connected";
      syncBtn.disabled = true;
    } else if(kind === "syncing"){
      pill.setAttribute("data-state", "warn");
      text.textContent = "Syncing…";
      syncBtn.disabled = true;
    } else {
      pill.setAttribute("data-state", "error");
      text.textContent = "Sync error";
      syncBtn.disabled = false;
      if(detail) showBanner(detail, "danger");
    }
  }

  var bannerDismissed = {};
  function showBanner(msg, kind){
    if(bannerDismissed[msg]) return;
    var banner = document.getElementById("banner");
    var inner = document.getElementById("banner-inner");
    document.getElementById("banner-text").textContent = msg;
    inner.className = "banner-inner" + (kind === "danger" ? " danger" : "");
    banner.hidden = false;
  }
  document.getElementById("banner-dismiss").addEventListener("click", function(){
    var msg = document.getElementById("banner-text").textContent;
    bannerDismissed[msg] = true;
    document.getElementById("banner").hidden = true;
  });

  /* ---------------- save indicator ---------------- */
  var saveIndicatorTimer = null;
  function setSaveIndicator(kind){
    var el = document.getElementById("save-indicator");
    var textEl = document.getElementById("save-indicator-text");
    var dot = el.querySelector(".status-dot");
    el.classList.add("show");
    if(saveIndicatorTimer){ clearTimeout(saveIndicatorTimer); saveIndicatorTimer = null; }
    if(kind === "pending" || kind === "saving"){
      textEl.textContent = "Saving…"; dot.style.background = "var(--muted)";
    } else if(kind === "saved"){
      textEl.textContent = "Saved to GitHub"; dot.style.background = "var(--accent-2)";
      saveIndicatorTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
    } else if(kind === "error"){
      textEl.textContent = "Couldn't save — see banner"; dot.style.background = "var(--danger)";
    } else if(kind === "offline"){
      textEl.textContent = "Not connected — changes stay in this tab only"; dot.style.background = "var(--danger)";
      saveIndicatorTimer = setTimeout(function(){ el.classList.remove("show"); }, 3000);
    }
  }

  /* ---------------- load / save ---------------- */
  function loadFromGithub(){
    if(!config) { state = state || defaultState(); render(); return Promise.resolve(); }
    setStatus("syncing");
    return ghGet(config).then(function(res){
      lastFetchAt = Date.now();
      sha = res.sha;
      state = normalizeState(res.data || defaultState());
      setStatus("connected");
      render();
    }).catch(function(err){
      state = state || defaultState();
      setStatus("error", err.message || "Couldn't load from GitHub.");
      render();
    });
  }

  function scheduleSave(){
    if(!config){ setSaveIndicator("offline"); return; }
    pendingSave = true;
    setSaveIndicator("pending");
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 1100);
  }

  function doSave(){
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    if(!config){ pendingSave = false; setSaveIndicator("offline"); return; }
    state.updatedAt = new Date().toISOString();
    setSaveIndicator("saving");
    ghPut(config, state, sha).then(function(newSha){
      sha = newSha; pendingSave = false; setSaveIndicator("saved");
      if(connectionStatus !== "connected") setStatus("connected");
    }).catch(function(err){
      pendingSave = false;
      if(err && err.code === "conflict"){
        showBanner("This file changed on GitHub since you last loaded it (probably from another device). Reloading the latest version — your last change wasn't saved, redo it if needed.", "danger");
        loadFromGithub();
        return;
      }
      setSaveIndicator("error");
      showBanner(err.message || "Couldn't save to GitHub.", "danger");
      setStatus("error");
    });
  }

  document.getElementById("sync-now-btn").addEventListener("click", function(){
    if(pendingSave){ doSave(); } else { loadFromGithub(); }
    if(gcalStatus === "connected") reconcileFromCalendar();
  });

  window.addEventListener("focus", function(){
    if(config && !pendingSave && Date.now() - lastFetchAt >= 15000) loadFromGithub();
    if(gcalStatus === "connected" && Date.now() - lastGcalFetchAt >= 60000) reconcileFromCalendar();
  });

  /* ---------------- GitHub settings modal ---------------- */
  function openSettings(){
    var root = document.getElementById("modal-root");
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    var c = config || { owner:"", repo:"", branch:"main", path:"data/tasks.json", token:"" };
    backdrop.innerHTML =
      '<div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="settings-title">' +
        '<h3 id="settings-title">Connect your GitHub repo</h3>' +

  /* ================================================================
     GOOGLE CALENDAR (client-side OAuth via Google Identity Services)
     ================================================================ */
  var GCAL_CONFIG_KEY = "daybook-gcal-config-v1";
  var GCAL_EVER_KEY = "daybook-gcal-everconnected-v1";
  var GCAL_SCOPE = "https://www.googleapis.com/auth/calendar";
  var gcalClientId = null;
  var gcalTokenClient = null;
  var gcalToken = null;
  var gcalTokenExpiresAt = 0;
  var gcalStatus = "not_configured"; // not_configured | not_connected | connecting | connected | error
  var gcalStatusDetail = "";
  var gcalCalendars = [];
  var lastGcalFetchAt = 0;

  function loadGcalConfig(){ try{ return JSON.parse(localStorage.getItem(GCAL_CONFIG_KEY) || "null"); }catch(e){ return null; } }
  function saveGcalConfig(cfg){ localStorage.setItem(GCAL_CONFIG_KEY, JSON.stringify(cfg)); }

  function setGcalStatus(kind, detail){
    gcalStatus = kind; gcalStatusDetail = detail || "";
    var pill = document.getElementById("gcal-pill");
    var text = document.getElementById("gcal-pill-text");
    var map = {
      not_configured: {state:"off", text:"Set up Calendar"},
      not_connected: {state:"off", text:"Connect Calendar"},
      connecting: {state:"warn", text:"Connecting…"},
      connected: {state:"connected", text: (function(){
        var cal = gcalCalendars.filter(function(c){ return c.id === (state && state.googleCalendarId); })[0];
        return "Calendar: " + (cal ? cal.summary.trim() : "connected");
      })()},
      error: {state:"error", text:"Calendar error"}
    };
    var m = map[kind] || map.error;
    pill.setAttribute("data-state", m.state);
    text.textContent = m.text;
  }

  function ensureTokenClient(){
    if(!window.google || !google.accounts || !google.accounts.oauth2 || !gcalClientId) return null;
    if(!gcalTokenClient){
      gcalTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: gcalClientId,
        scope: GCAL_SCOPE,
        callback: function(){}
      });
    }
    return gcalTokenClient;
  }

  function requestGcalToken(opts){
    return new Promise(function(resolve, reject){
      var tc = ensureTokenClient();
      if(!tc){ reject(new Error("Google sign-in script isn't loaded yet — try again in a moment.")); return; }
      tc.callback = function(resp){
        if(resp && resp.error){ reject(resp); return; }
        gcalToken = resp.access_token;
        gcalTokenExpiresAt = Date.now() + (parseInt(resp.expires_in, 10) || 3500) * 1000;
        localStorage.setItem(GCAL_EVER_KEY, "1");
        resolve(gcalToken);
      };
      tc.requestAccessToken(opts || {});
    });
  }

  function ensureFreshGcalToken(){
    if(gcalToken && Date.now() < gcalTokenExpiresAt - 60000) return Promise.resolve(gcalToken);
    return requestGcalToken({ prompt: "" });
  }

  function gcalFetch(path, options){
    return ensureFreshGcalToken().then(function(token){
      options = options || {};
      var headers = { "Authorization": "Bearer " + token, "Content-Type": "application/json" };
      if(options.headers) for(var k in options.headers) headers[k] = options.headers[k];
      var opts = { method: options.method, body: options.body, headers: headers };
      return fetch("https://www.googleapis.com/calendar/v3/" + path, opts);
    });
  }

  function describeGcalError(err){
    if(err && err.message) return err.message;
    if(err && err.error === "popup_closed_by_user") return "Sign-in window closed before finishing.";
    if(err && err.error) return "Google sign-in error: " + err.error;
    return "Couldn't connect to Google Calendar.";
  }

  function connectGoogleCalendar(){
    if(!gcalClientId){ openCalendarSettings(); return; }
    setGcalStatus("connecting");
    requestGcalToken({ prompt: "" }).then(function(){
      return loadGoogleCalendars();
    }).then(function(){
      setGcalStatus("connected");
      reconcileFromCalendar();
    }).catch(function(err){
      setGcalStatus("error", describeGcalError(err));
      showBanner("Google Calendar: " + describeGcalError(err), "danger");
    });
  }

  function loadGoogleCalendars(){
    return gcalFetch("users/me/calendarList?maxResults=250").then(function(res){
      if(!res.ok) return res.json().then(function(j){ throw new Error((j && j.error && j.error.message) || "Couldn't load your calendars."); });
      return res.json();
    }).then(function(json){
      gcalCalendars = json.items || [];
      if(!state.googleCalendarId || !gcalCalendars.some(function(c){ return c.id === state.googleCalendarId; })){
        var pick = gcalCalendars.filter(function(c){ return /to.?do/i.test(c.summary || ""); })[0]
          || gcalCalendars.filter(function(c){ return c.primary; })[0]
          || gcalCalendars[0];
        if(pick){ state.googleCalendarId = pick.id; scheduleSave(); }
      }
      lastGcalFetchAt = Date.now();
    });
  }

  function pad2(n){ return n < 10 ? "0" + n : "" + n; }
  function addDaysToDateStr(dateStr, days){
    var d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + days);
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }
  function addMinutesToTimeStr(timeStr, mins){
    var parts = timeStr.split(":");
    var d = new Date(2000, 0, 1, parseInt(parts[0], 10), parseInt(parts[1], 10));
    d.setMinutes(d.getMinutes() + mins);
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }
  function eventTitleFor(task){ return (task.done ? "✓ " : "") + task.text; }

  function buildEventBody(task){
    if(!task.due) return null;
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
    if(task.due.allDay || !task.due.time){
      return { summary: eventTitleFor(task), start: { date: task.due.date }, end: { date: addDaysToDateStr(task.due.date, 1) } };
    }
    return {
      summary: eventTitleFor(task),
      start: { dateTime: task.due.date + "T" + task.due.time + ":00", timeZone: tz },
      end: { dateTime: task.due.date + "T" + addMinutesToTimeStr(task.due.time, 30) + ":00", timeZone: tz }
    };
  }

  function syncTaskToCalendar(task){
    if(gcalStatus !== "connected" || !state.googleCalendarId) return;
    var body = buildEventBody(task);
    task.syncing = true; render();
    var p;
    var base = "calendars/" + encodeURIComponent(state.googleCalendarId) + "/events";
    if(!body){
      if(task.calendarEventId){
        p = gcalFetch(base + "/" + encodeURIComponent(task.calendarEventId), { method: "DELETE" })
          .then(function(){ task.calendarEventId = null; });
      } else { p = Promise.resolve(); }
    } else if(task.calendarEventId){
      p = gcalFetch(base + "/" + encodeURIComponent(task.calendarEventId), { method: "PATCH", body: JSON.stringify(body) })
        .then(function(res){
          if(res.status === 404){ task.calendarEventId = null; throw new Error("That calendar event was removed — try again to recreate it."); }
          if(!res.ok) return res.json().then(function(j){ throw new Error((j && j.error && j.error.message) || "Calendar update failed."); });
        });
    } else {
      p = gcalFetch(base, { method: "POST", body: JSON.stringify(body) })
        .then(function(res){ return res.json().then(function(j){
          if(!res.ok) throw new Error((j && j.error && j.error.message) || "Calendar create failed.");
          task.calendarEventId = j.id;
        }); });
    }
    p.then(function(){ task.syncError = null; })
      .catch(function(err){ task.syncError = err.message || "Calendar sync failed."; })
      .then(function(){ task.syncing = false; scheduleSave(); render(); });
  }

  function deleteRemoteEventBestEffort(task){
    if(gcalStatus !== "connected" || !task.calendarEventId || !state.googleCalendarId) return Promise.resolve();
    return gcalFetch("calendars/" + encodeURIComponent(state.googleCalendarId) + "/events/" + encodeURIComponent(task.calendarEventId), { method: "DELETE" }).catch(function(){});
  }

  function eventToDue(ev){
    if(!ev.start) return null;
    if(ev.start.date && !ev.start.dateTime) return { date: ev.start.date, time: null, allDay: true };
    var dt = ev.start.dateTime;
    return { date: dt.slice(0, 10), time: dt.slice(11, 16), allDay: false };
  }
  function dueEqual(a, b){
    if(!a && !b) return true;
    if(!a || !b) return false;
    return a.date === b.date && a.time === b.time && !!a.allDay === !!b.allDay;
  }
  function normText(s){ return (s || "").replace(/^✓\s*/, "").trim().toLowerCase(); }

  function reconcileFromCalendar(){
    if(gcalStatus !== "connected" || !state.googleCalendarId) return Promise.resolve();
    var timeMin = new Date(); timeMin.setDate(timeMin.getDate() - 3); timeMin.setHours(0, 0, 0, 0);
    var timeMax = new Date(); timeMax.setDate(timeMax.getDate() + 60);
    var url = "calendars/" + encodeURIComponent(state.googleCalendarId) + "/events?singleEvents=true&orderBy=startTime&maxResults=250" +
      "&timeMin=" + encodeURIComponent(timeMin.toISOString()) + "&timeMax=" + encodeURIComponent(timeMax.toISOString());
    return gcalFetch(url).then(function(res){
      if(!res.ok) return res.json().then(function(j){ throw new Error((j && j.error && j.error.message) || "Couldn't read calendar events."); });
      return res.json();
    }).then(function(json){
      lastGcalFetchAt = Date.now();
      var events = json.items || [];
      var byId = {}; events.forEach(function(e){ byId[e.id] = e; });
      var linkedIds = {}; var changed = false;
      forEachTask(function(t){
        if(!t.calendarEventId) return;
        linkedIds[t.calendarEventId] = true;
        var ev = byId[t.calendarEventId];
        if(!ev || ev.status === "cancelled"){ t.calendarEventId = null; t.syncError = "The linked calendar event was removed"; changed = true; return; }
        var extDue = eventToDue(ev);
        var extDone = /^✓/.test(ev.summary || "");
        var extText = normText(ev.summary);
        if(!dueEqual(extDue, t.due)){ t.due = extDue; changed = true; }
        if(extText && extText !== normText(t.text)){ t.text = (ev.summary || "").replace(/^✓\s*/, "").trim(); changed = true; }
        if(extDone !== t.done){ t.done = extDone; t.completedAt = extDone ? (t.completedAt || new Date().toISOString()) : null; changed = true; }
        if(t.syncError){ t.syncError = null; changed = true; }
      });
      events.forEach(function(ev){
        if(linkedIds[ev.id] || ev.status === "cancelled") return;
        var evNorm = normText(ev.summary);
        if(!evNorm) return;
        var match = null;
        forEachTask(function(t){ if(match || t.calendarEventId) return; if(normText(t.text) === evNorm) match = t; });
        if(match){
          match.calendarEventId = ev.id;
          match.due = eventToDue(ev);
          var extDone2 = /^✓/.test(ev.summary || "");
          if(extDone2 !== match.done){ match.done = extDone2; match.completedAt = extDone2 ? new Date().toISOString() : null; }
          match.syncError = null;
          linkedIds[ev.id] = true; changed = true;
        }
      });
      if(changed){ scheduleSave(); render(); }
    }).catch(function(err){
      showBanner("Calendar sync: " + (err.message || "couldn't refresh from Google Calendar."), "danger");
    });
  }

  function tryAutoConnectGcal(){
    if(!gcalClientId){ setGcalStatus("not_configured"); return; }
    if(localStorage.getItem(GCAL_EVER_KEY) !== "1"){ setGcalStatus("not_connected"); return; }
    setGcalStatus("connecting");
    requestGcalToken({ prompt: "" }).then(function(){
      return loadGoogleCalendars();
    }).then(function(){
      setGcalStatus("connected");
      reconcileFromCalendar();
    }).catch(function(){ setGcalStatus("not_connected"); });
  }

  function waitForGis(cb, triesLeft){
    if(window.google && google.accounts && google.accounts.oauth2){ cb(); return; }
    if(triesLeft <= 0) return;
    setTimeout(function(){ waitForGis(cb, triesLeft - 1); }, 200);
  }

  function openCalendarSettings(){
    var root = document.getElementById("modal-root");
    var backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    root.appendChild(backdrop);
    function close(){ if(backdrop.parentNode) root.removeChild(backdrop); }
    backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });

    function paint(){
      var gcfg = loadGcalConfig();
      var clientIdVal = gcalClientId || (gcfg && gcfg.clientId) || "";
      var html = '<div class="modal-box" role="dialog" aria-modal="true"><h3>Google Calendar</h3>';

      if(gcalStatus !== "connected"){
        html += '<p>Give a task a due date and it becomes a real event on your Google Calendar — and events you add there flow back into Daybook. This needs a small (free) Google Cloud project of your own; see the README for exact steps.</p>';
        html += '<div id="cal-error" class="modal-error" hidden></div>';
        html += '<div class="field"><label for="f-clientid">OAuth Client ID</label>' +
          '<input id="f-clientid" type="text" placeholder="xxxxxxxx.apps.googleusercontent.com" value="' + escapeHtml(clientIdVal) + '">' +
          '<div class="field-hint">From Google Cloud Console → Google Auth platform → Clients. Not secret — safe to store in this browser.</div></div>';
        html += '<div class="modal-actions">' +
          '<button class="btn btn-ghost" id="cal-cancel">Close</button>' +
          '<button class="btn btn-primary" id="cal-connect">Connect Google Calendar</button>' +
          '</div>';
      } else {
        html += '<p>Connected. Choose which calendar new due dates sync to:</p>';
        html += '<div class="field"><label for="f-cal-select">Calendar</label><select id="f-cal-select">' +
          gcalCalendars.map(function(c){
            return '<option value="' + escapeHtml(c.id) + '"' + (c.id === state.googleCalendarId ? " selected" : "") + '>' + escapeHtml((c.summary || c.id).trim()) + '</option>';
          }).join("") + '</select></div>';
        html += '<div class="modal-note">Switching calendars unlinks tasks from their old events (nothing is deleted there) and re-creates events for tasks with due dates on the new calendar.</div>';
        html += '<div class="modal-actions">' +
          '<button class="btn btn-danger btn-ghost" id="cal-disconnect">Disconnect</button>' +
          '<button class="btn btn-ghost" id="cal-cancel">Close</button>' +
          '</div>';
      }
      html += '</div>';
      backdrop.innerHTML = html;

      backdrop.querySelector("#cal-cancel").addEventListener("click", close);

      var connectBtn = backdrop.querySelector("#cal-connect");
      if(connectBtn){
        connectBtn.addEventListener("click", function(){
          var idVal = backdrop.querySelector("#f-clientid").value.trim();
          var errEl = backdrop.querySelector("#cal-error");
          if(!idVal){ errEl.textContent = "Paste your OAuth Client ID first."; errEl.hidden = false; return; }
          gcalClientId = idVal;
          saveGcalConfig({ clientId: idVal });
          gcalTokenClient = null;
          connectBtn.disabled = true; connectBtn.textContent = "Connecting…";
          setGcalStatus("connecting");
          waitForGis(function(){
            requestGcalToken({ prompt: "" }).then(function(){
              return loadGoogleCalendars();
            }).then(function(){
              setGcalStatus("connected");
              reconcileFromCalendar();
              paint();
            }).catch(function(err){
              setGcalStatus("not_connected");
              errEl.textContent = describeGcalError(err);
              errEl.hidden = false;
              connectBtn.disabled = false; connectBtn.textContent = "Connect Google Calendar";
            });
          }, 25);
        });
      }

      var calSelect = backdrop.querySelector("#f-cal-select");
      if(calSelect){
        calSelect.addEventListener("change", function(){
          var newId = calSelect.value;
          if(newId === state.googleCalendarId) return;
          state.googleCalendarId = newId;
          forEachTask(function(t){ t.calendarEventId = null; t.syncError = null; });
          scheduleSave();
          setGcalStatus("connected");
          forEachTask(function(t){ if(t.due) syncTaskToCalendar(t); });
          render();
        });
      }

      var discBtn = backdrop.querySelector("#cal-disconnect");
      if(discBtn){
        discBtn.addEventListener("click", function(){
          gcalToken = null; gcalTokenExpiresAt = 0;
          localStorage.removeItem(GCAL_EVER_KEY);
          setGcalStatus("not_connected");
          close();
        });
      }
    }
    paint();
  }

  /* ---------------- view tabs ---------------- */
  function setView(mode){
    viewMode = mode;
    document.getElementById("list-view").hidden = mode !== "list";
    document.getElementById("cal-view").hidden = mode !== "cal";
    document.getElementById("stats-view").hidden = mode !== "stats";

  document.getElementById("tab-cal").addEventListener("click", function(){ setView("cal"); });
  document.getElementById("tab-stats").addEventListener("click", function(){ setView("stats"); });

  /* ---------------- data helpers ---------------- */
  function forEachTask(fn){
    state.headings.forEach(function(h){
      h.tasks.forEach(function(t){ fn(t, h, null); });
      h.subheadings.forEach(function(sh){ sh.tasks.forEach(function(t){ fn(t, h, sh); }); });
    });
  }

  function locateTask(taskId){
    for(var i=0;i<state.headings.length;i++){
      var h = state.headings[i];
      var idx = h.tasks.findIndex(function(t){ return t.id === taskId; });
      if(idx >= 0) return { list: h.tasks, index: idx, heading: h, sub: null };
      for(var j=0;j<h.subheadings.length;j++){
        var sh = h.subheadings[j];
        var idx2 = sh.tasks.findIndex(function(t){ return t.id === taskId; });
        if(idx2 >= 0) return { list: sh.tasks, index: idx2, heading: h, sub: sh };
      }
    }
    return null;
  }
  function locateSub(subId){
    for(var i=0;i<state.headings.length;i++){
      var h = state.headings[i];
      var idx = h.subheadings.findIndex(function(s){ return s.id === subId; });
      if(idx >= 0) return { list: h.subheadings, index: idx, heading: h };
    }
    return null;
  }
  function locateHeading(headingId){
    var idx = state.headings.findIndex(function(h){ return h.id === headingId; });
    return idx >= 0 ? { index: idx } : null;
  }

  function moveTaskTo(taskId, targetList, targetIndex){
    var loc = locateTask(taskId);
    if(!loc) return;
    var sameList = loc.list === targetList;
    var task = loc.list.splice(loc.index, 1)[0];
    if(sameList && loc.index < targetIndex) targetIndex--;
    if(targetIndex < 0) targetIndex = 0;
    if(targetIndex > targetList.length) targetIndex = targetList.length;
    targetList.splice(targetIndex, 0, task);
  }
  function moveSubTo(subId, targetHeading, targetIndex){
    var loc = locateSub(subId);
    if(!loc) return;
    var targetList = targetHeading.subheadings;
    var sameList = loc.list === targetList;
    var sub = loc.list.splice(loc.index, 1)[0];
    if(sameList && loc.index < targetIndex) targetIndex--;
    if(targetIndex < 0) targetIndex = 0;
    if(targetIndex > targetList.length) targetIndex = targetList.length;
    targetList.splice(targetIndex, 0, sub);
  }
  function moveHeadingTo(headingId, targetIndex){
    var idx = state.headings.findIndex(function(h){ return h.id === headingId; });
    if(idx < 0) return;

  /* ---------------- rendering ---------------- */
  function formatDue(due){
    if(!due) return "";
    var d = new Date(due.date + "T00:00:00");
    var label = d.toLocaleDateString(undefined, {month:"short", day:"numeric"});
    if(!due.allDay && due.time){
      var parts = due.time.split(":");
      var t = new Date(2000,0,1, parseInt(parts[0],10), parseInt(parts[1],10));
      label += " · " + t.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
    }
    return label;
  }
  function isOverdue(due, done){
    if(!due || done) return false;

  }

  var ICON_SPIN = '<svg class="sync-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="animation:spin .8s linear infinite"><path d="M21 12a9 9 0 11-3-6.7"/></svg>';

  /* ---------------- calendar view ---------------- */
  var calMode = "month";
  var calAnchor = new Date(); calAnchor.setHours(0,0,0,0);
  var calEvents = [];
  var calEventsKey = null;
  var calEventsLoading = false;
  var calEventsError = null;

  function dateKey(d){ return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function addMonthsCal(d, n){ return new Date(d.getFullYear(), d.getMonth()+n, 1); }
  function addDaysCal(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function mondayOfWeek(d){ var r = new Date(d); var day = (r.getDay()+6)%7; r.setDate(r.getDate()-day); return r; }
  function sameDateCal(a, b){ return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
  function formatTimeShort(timeStr){
    if(!timeStr) return "";
    var parts = timeStr.split(":");
    var t = new Date(2000,0,1, parseInt(parts[0],10), parseInt(parts[1],10));
    return t.toLocaleTimeString(undefined, {hour:"numeric", minute:"2-digit"});
  }

  function fetchCalRangeEvents(startDate, endDateExclusive){
    var key = gcalStatus + "|" + (state.googleCalendarId || "") + "|" + dateKey(startDate) + "_" + dateKey(endDateExclusive);
    if(gcalStatus !== "connected" || !state.googleCalendarId){
      calEvents = []; calEventsKey = key; calEventsError = null;
      return;
    }
    if(calEventsKey === key || calEventsLoading) return;
    calEventsLoading = true; calEventsError = null;
    var url = "calendars/" + encodeURIComponent(state.googleCalendarId) + "/events?singleEvents=true&orderBy=startTime&maxResults=250" +
      "&timeMin=" + encodeURIComponent(startDate.toISOString()) + "&timeMax=" + encodeURIComponent(endDateExclusive.toISOString());
    gcalFetch(url).then(function(res){
      if(!res.ok) return res.json().then(function(j){ throw new Error((j && j.error && j.error.message) || "Couldn't load calendar events."); });
      return res.json();
    }).then(function(json){
      calEvents = (json.items || []).filter(function(e){ return e.status !== "cancelled"; });
      calEventsKey = key;
    }).catch(function(err){
      calEventsError = err.message || "Couldn't load calendar events.";
    }).then(function(){
      calEventsLoading = false;
      if(viewMode === "cal") renderCalendar();
    });
  }

  function buildDayIndex(startDate, numDays){
    var idx = {};
    for(var i=0;i<numDays;i++){ idx[dateKey(addDaysCal(startDate,i))] = { tasks: [], events: [] }; }
    var linkedIds = {};
    forEachTask(function(t){ if(t.calendarEventId) linkedIds[t.calendarEventId] = true; });
    forEachTask(function(t, h){
      if(!t.due) return;
      var k = t.due.date;
      if(idx[k]) idx[k].tasks.push({ task: t, heading: h });
    });
    calEvents.forEach(function(ev){
      if(linkedIds[ev.id]) return;
      var due = eventToDue(ev);
      if(!due) return;
      var k = due.date;
      if(idx[k]) idx[k].events.push({ event: ev, due: due });
    });
    return idx;
  }

  function itemSortKey(it){
    var due = it.type === "task" ? it.data.task.due : it.data.due;
    return (due && !due.allDay && due.time) ? due.time : "";
  }
  function dayItems(idx, k){
    var d = idx[k] || { tasks: [], events: [] };
    var items = d.tasks.map(function(x){ return { type:"task", data:x }; })
      .concat(d.events.map(function(x){ return { type:"event", data:x }; }));
    items.sort(function(a,b){ var ka=itemSortKey(a), kb=itemSortKey(b); return ka<kb?-1:(ka>kb?1:0); });
    return items;
  }

  function renderCalendarMonth(root){
    var monthStart = startOfMonth(calAnchor);
    var gridStart = mondayOfWeek(monthStart);
    var totalDays = 42;
    var gridEnd = addDaysCal(gridStart, totalDays);
    fetchCalRangeEvents(gridStart, gridEnd);
    var title = monthStart.toLocaleDateString(undefined, {month:"long", year:"numeric"});
    renderCalendarHead(root, title);

    var idx = buildDayIndex(gridStart, totalDays);
    var today = new Date(); today.setHours(0,0,0,0);
    var grid = document.createElement("div"); grid.className = "cal-month-grid";
    var weekdayRow = document.createElement("div"); weekdayRow.className = "cal-weekday-row";
    ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(function(d){ var s = document.createElement("span"); s.textContent = d; weekdayRow.appendChild(s); });
    grid.appendChild(weekdayRow);
    var body = document.createElement("div"); body.className = "cal-month-body";
    var dayDates = []; for(var i=0;i<totalDays;i++) dayDates.push(addDaysCal(gridStart, i));
    dayDates.forEach(function(d){
      var k = dateKey(d);
      var cell = document.createElement("div");
      cell.className = "cal-day-cell" + (d.getMonth() !== monthStart.getMonth() ? " outside" : "") + (sameDateCal(d, today) ? " today" : "");
      var num = document.createElement("span"); num.className = "cal-day-num"; num.textContent = d.getDate(); cell.appendChild(num);
      var items = dayItems(idx, k);
      var shown = items.slice(0, 3);
      shown.forEach(function(it){ cell.appendChild(renderCalChip(it)); });
      if(items.length > shown.length){
        var more = document.createElement("span"); more.className = "cal-more"; more.textContent = "+" + (items.length - shown.length) + " more"; cell.appendChild(more);
      }
      cell.addEventListener("click", function(e){ e.stopPropagation(); openQuickAdd(cell, k); });
      body.appendChild(cell);
    });
    grid.appendChild(body);
    root.appendChild(grid);
  }

  function renderCalendarWeek(root){
    var weekStart = mondayOfWeek(calAnchor);
    var weekEnd = addDaysCal(weekStart, 7);
    fetchCalRangeEvents(weekStart, weekEnd);
    var title = weekStart.toLocaleDateString(undefined, {month:"short", day:"numeric"}) + " – " + addDaysCal(weekStart,6).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"});
    renderCalendarHead(root, title);

    var idx = buildDayIndex(weekStart, 7);
    var today = new Date(); today.setHours(0,0,0,0);
    var grid = document.createElement("div"); grid.className = "cal-week-grid";
    var dayDates = []; for(var i=0;i<7;i++) dayDates.push(addDaysCal(weekStart, i));
    dayDates.forEach(function(d){
      var k = dateKey(d);
      var col = document.createElement("div");
      col.className = "cal-week-col" + (sameDateCal(d, today) ? " today" : "");
