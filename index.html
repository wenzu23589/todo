<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="font-base-link" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a8672a">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daybook">
<title>Daybook</title>
<style>
  :root{
    --ink: #1c2130;
    --ink-soft: #3a4152;
    --paper: #eef0f3;
    --paper-raised: #ffffff;
    --paper-sunken: #e3e6eb;
    --line: #d7dbe1;
    --line-soft: #e4e7eb;
    --muted: #5b6270;
    --accent: #a8672a;
    --accent-ink: #ffffff;
    --accent-2: #3f7d6e;
    --danger: #b8452f;
    --focus: #2f5fd6;
    --shadow: 0 1px 2px rgba(28,33,48,0.06), 0 8px 24px -12px rgba(28,33,48,0.18);
    --radius-s: 6px;
    --radius-m: 10px;
    --radius-l: 14px;
    --font-heading: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink: #ece9df; --ink-soft: #c8c4b6; --paper: #14171f; --paper-raised: #1b1f2a;
      --paper-sunken: #10131a; --line: #2c3140; --line-soft: #232838; --muted: #939aab;
      --accent: #d99a4e; --accent-ink: #1c1200; --accent-2: #67ab9a; --danger: #e08469;
      --focus: #7ea1ff; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink: #ece9df; --ink-soft: #c8c4b6; --paper: #14171f; --paper-raised: #1b1f2a;
    --paper-sunken: #10131a; --line: #2c3140; --line-soft: #232838; --muted: #939aab;
    --accent: #d99a4e; --accent-ink: #1c1200; --accent-2: #67ab9a; --danger: #e08469;
    --focus: #7ea1ff; --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    color-scheme: dark;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    overflow-x: hidden;
    background: var(--paper); color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3{ font-family: var(--font-heading); text-wrap: balance; margin: 0; }
  .mono{ font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  button{ font-family: inherit; }
  ::selection{ background: color-mix(in srgb, var(--accent) 35%, transparent); }
  :focus-visible{ outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

  .shell{ max-width: 900px; margin: 0 auto; padding: 0 20px 80px; }

  header.top{
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .top-inner{ max-width: 900px; margin: 0 auto; display:flex; align-items:center; gap:12px; padding:16px 20px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:baseline; gap:10px; margin-right:auto; }
  .brand h1{ font-size:1.5rem; font-weight:600; letter-spacing:-0.01em; }
  .brand .tag{ color:var(--muted); font-size:0.8rem; }
  .header-controls{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; position:relative; margin-left:auto; }
  /* margin-left:auto keeps this pinned to the right edge of whatever row it wraps onto
     inside .top-inner's flex-wrap — without it, when .header-controls ends up alone on
     its own wrapped line (e.g. collapsed to just the "more" button at narrow widths),
     flexbox has no sibling on that line for .brand's margin-right:auto to push against,
     so it falls back to flex-start (the left edge) instead of staying right-aligned. */
  .header-controls-inner{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  /* Double-class selector (.btn.header-more-btn) so this reliably beats the base .btn rule's
     display:inline-flex — both are single-class specificity otherwise, and .btn is declared
     later in the stylesheet, so a plain .header-more-btn{display:none} was losing the cascade
     and the button stayed visible at every width, not just under 640px. */
  .btn.header-more-btn{ display:none; padding:6px 8px; }
  @media (max-width: 640px){
    /* On narrow screens the six header controls (Theme/Sync now/Install app/repo
       status/Set up Calendar/Settings) used to wrap across up to three rows before
       any task content appeared. Collapse them into a single "more" menu instead. */
    .btn.header-more-btn{ display:inline-flex; align-items:center; }
    .header-controls-inner{
      display:none; position:fixed; z-index:30; /* top/right set inline in JS from the button's own rect —
        .header-controls can wrap to its own row at narrow widths, so a CSS-only "top:100%;right:0" anchor
        (relative to that ancestor) would sometimes miss the actual button entirely */
      flex-direction:column; align-items:stretch; gap:6px; min-width:210px;
      background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
      box-shadow:var(--shadow); padding:8px;
    }
    .header-controls-inner.open{ display:flex; }
    .header-controls-inner .btn, .header-controls-inner .status-pill{ width:100%; justify-content:flex-start; }
  }

  .view-tabs{
    display:flex; gap:2px; background:var(--paper-sunken); padding:3px; border-radius:var(--radius-m);
    max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .view-tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{ flex-shrink:0; }
  .tab-btn{ border:none; background:transparent; padding:6px 13px; border-radius:calc(var(--radius-m) - 3px); font-size:0.82rem; font-weight:500; color:var(--muted); cursor:pointer; transition:background .12s ease,color .12s ease; }
  .tab-btn.active{ background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow); }
  .tab-btn:hover:not(.active){ color:var(--ink); }

  .status-pill{
    display:flex; align-items:center; gap:6px; font-size:0.78rem; padding:5px 10px 5px 8px;
    border-radius:999px; border:1px solid var(--line); background:var(--paper-raised); color:var(--muted); white-space:nowrap;
  }
  .status-pill.clickable{ cursor:pointer; transition:border-color .12s ease; }
  .status-pill.clickable:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .status-dot{ width:7px; height:7px; border-radius:50%; background:var(--muted); flex-shrink:0; }
  .status-pill[data-state="connected"] .status-dot{ background:var(--accent-2); }
  .status-pill[data-state="connected"]{ color:var(--accent-2); border-color:color-mix(in srgb, var(--accent-2) 40%, var(--line)); }
  .status-pill[data-state="warn"] .status-dot{ background:var(--accent); }
  .status-pill[data-state="warn"]{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .status-pill[data-state="error"] .status-dot{ background:var(--danger); }
  .status-pill[data-state="error"]{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 35%, var(--line)); }

  .btn{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--paper-raised);
    color:var(--ink); padding:7px 12px; border-radius:var(--radius-m); font-size:0.85rem; font-weight:500;
    cursor:pointer; box-shadow:var(--shadow); transition: transform .12s ease, border-color .12s ease;
  }
  .btn:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .btn:active{ transform: translateY(1px); }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; box-shadow:none; border-color:transparent; color:var(--muted); }
  .btn-ghost:hover{ color:var(--ink); background:var(--paper-sunken); }
  .btn-danger{ color:var(--danger); }
  .btn-sm{ padding:4px 9px; font-size:0.78rem; border-radius:var(--radius-s); }
  .btn[disabled]{ opacity:0.5; cursor:default; }

  .banner{ max-width:900px; margin:14px auto 0; padding:10px 20px; }
  .banner-inner{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background: color-mix(in srgb, var(--accent) 12%, var(--paper-raised));
    border:1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    border-radius:var(--radius-m); padding:10px 14px; font-size:0.85rem;
  }
  .banner-inner.danger{ background: color-mix(in srgb, var(--danger) 12%, var(--paper-raised)); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }
  .banner-inner p{ margin:0; flex:1; min-width:220px; color:var(--ink-soft); }

  main{ margin-top:24px; }

  /* ---------- shared entrance / motion ---------- */
  section.heading-card, .sub-block, .task-row{ transition: opacity .18s ease, transform .18s ease; }
  section.heading-card.enter, .sub-block.enter, .task-row.enter{ opacity:0; transform: translateY(-5px); }
  section.heading-card.dragging{ opacity:0.45; }

  section.heading-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l);
    margin-bottom:18px; box-shadow:var(--shadow); overflow:hidden;
  }
  .heading-bar{ display:flex; align-items:center; gap:8px; padding:14px 16px; border-left:4px solid var(--accent); position:relative; }
  .heading-bar.drop-before{ box-shadow: inset 0 2px 0 var(--accent); }
  .heading-bar.drop-after{ box-shadow: inset 0 -2px 0 var(--accent); }
  .heading-bar.drop-target{ background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .grip{
    display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:grab;
    padding:4px; border-radius:4px; flex-shrink:0; touch-action:none;
  }
  .grip:hover{ color:var(--ink); background:var(--paper-sunken); }
  .grip:active{ cursor:grabbing; }
  .collapse-btn{ background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; display:flex; align-items:center; justify-content:center; border-radius:4px; flex-shrink:0; }
  .collapse-btn svg{ transition: transform .15s ease; }
  .heading-card.collapsed > .heading-bar .collapse-btn svg{ transform: rotate(-90deg); }
  .sub-block.collapsed > .sub-bar .collapse-btn svg{ transform: rotate(-90deg); }
  .color-dot{
    width:15px; height:15px; border-radius:50%; border:none; padding:0; cursor:pointer; flex-shrink:0;
    box-shadow:0 0 0 1px var(--line); background:var(--accent);
  }
  .color-dot:hover{ box-shadow:0 0 0 2px color-mix(in srgb, var(--ink) 35%, var(--line)); }
  .color-dot.unset{ background:var(--paper); } /* no custom color chosen — plain ring, not a fake accent fill */
  .color-dot.unset:hover{ box-shadow:0 0 0 2px color-mix(in srgb, var(--ink) 35%, var(--line)); }
  .color-popover{
    position:absolute; top:100%; left:44px; margin-top:6px; z-index:15;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
    box-shadow:var(--shadow); padding:8px; display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
  }
  .color-popover .swatch{
    width:20px; height:20px; border-radius:50%; border:none; padding:0; cursor:pointer;
    box-shadow:0 0 0 1px var(--line);
  }
  .color-popover .swatch:hover{ box-shadow:0 0 0 2px color-mix(in srgb, var(--ink) 35%, var(--line)); }
  .color-popover .swatch[data-color=""]{ background: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 5px); }
  .heading-title{
    font-size:1.15rem; font-weight:600; flex:1; min-width:0; background:transparent; border:none;
    color:var(--ink); font-family:var(--font-heading); padding:2px 4px; border-radius:4px;
  }
  .heading-title:focus{ background:var(--paper-sunken); }
  .heading-count{ color:var(--muted); font-size:0.78rem; white-space:nowrap; }
  .heading-actions{ display:flex; gap:4px; flex-shrink:0; }
  @media (max-width: 640px){
    /* The heading/sub-heading bar is a single row (unlike a task row, which wraps its
       badges to a second line) — a populated Notes badge or an attachment count pill can
       otherwise eat enough width on a narrow screen to crush a long heading title down to
       just a few visible characters. Icon-only still shows the "set" state via its color. */
    .heading-notes-badge span, .heading-attachments-badge span,
    .sub-notes-badge span, .sub-attachments-badge span{ display:none; }
  }

  .heading-body{ display:grid; grid-template-rows: 1fr; transition: grid-template-rows .22s ease; }
  .heading-card.collapsed .heading-body{ grid-template-rows: 0fr; }
  .heading-body-inner{ overflow:hidden; min-height:0; }
  .heading-body-content{ padding:0 16px 16px; }

  .heading-dropzone-end{ height:10px; }
  .heading-dropzone-end.drop-target{ height:10px; border-radius:6px; background: color-mix(in srgb, var(--accent) 25%, transparent); }

  .sub-block{ margin-top:6px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .sub-block:first-child{ border-top:none; }
  .sub-block.dragging{ opacity:0.45; }
  .sub-bar{ display:flex; align-items:center; gap:6px; margin-bottom:6px; position:relative; }
  .sub-bar.drop-before{ box-shadow: inset 0 2px 0 var(--accent-2); }
  .sub-bar.drop-after{ box-shadow: inset 0 -2px 0 var(--accent-2); }
  .sub-bar.drop-target{ background: color-mix(in srgb, var(--accent-2) 10%, transparent); border-radius:4px; }
  .grip-sm{ width:16px; height:16px; }
  .sub-title{
    font-size:0.95rem; font-weight:600; color:var(--ink-soft); flex:1; min-width:0; background:transparent;
    border:none; padding:2px 4px; border-radius:4px; font-family:var(--font-body);
  }
  .sub-title:focus{ background:var(--paper-sunken); }
  .sub-actions{ display:flex; gap:2px; flex-shrink:0; }
  .sub-count{ color:var(--muted); font-size:0.72rem; }
  .sub-dropzone-end{ height:8px; }
  .sub-dropzone-end.drop-target{ height:8px; border-radius:6px; background: color-mix(in srgb, var(--accent-2) 25%, transparent); }

  .sub-body{ display:grid; grid-template-rows: 1fr; transition: grid-template-rows .2s ease; }
  .sub-block.collapsed .sub-body{ grid-template-rows: 0fr; }
  .sub-body-inner{ overflow:hidden; min-height:0; }

  .task-list{ display:flex; flex-direction:column; min-height:4px; }
  .task-list.drop-target{ background: color-mix(in srgb, var(--accent-2) 8%, transparent); border-radius:6px; }
  .task-row{ display:flex; align-items:flex-start; gap:8px; padding:7px 4px; border-radius:var(--radius-s); position:relative; }
  .task-row:hover{ background:var(--paper-sunken); }
  .task-row.dragging{ opacity:0.45; }
  .task-row.drop-before{ box-shadow: inset 0 2px 0 var(--accent-2); }
  .task-row.drop-after{ box-shadow: inset 0 -2px 0 var(--accent-2); }
  /* Not started / in progress / done — click cycles through all three. A plain checkbox
     can only ever be on or off, so this is a <button>, not an <input type="checkbox">. */
  .task-row.in-progress{ box-shadow: inset 2px 0 0 var(--accent); border-radius:2px; }
  .check{
    width:19px; height:19px; margin-top:2px; border-radius:5px; border:1.5px solid var(--line);
    background:var(--paper-raised); cursor:pointer; flex-shrink:0; position:relative; padding:0;
    transition: background-color .15s ease, border-color .15s ease;
  }
  .check.status-done{ background:var(--accent-2); border-color:var(--accent-2); }
  .check.status-done::after{
    content:""; position:absolute; left:5px; top:1px; width:5px; height:9px; border:solid white; border-width:0 2px 2px 0;
    transform:rotate(40deg); animation: tick-pop .18s ease;
  }
  .check.status-in_progress{ border-color:var(--accent); }
  .check.status-in_progress::after{
    content:""; position:absolute; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px;
    border-radius:2px; background:var(--accent); animation: dot-pop .18s ease;
  }
  @keyframes tick-pop{ from{ transform:scale(0.3) rotate(40deg); opacity:0; } to{ transform:scale(1) rotate(40deg); opacity:1; } }
  @keyframes dot-pop{ from{ transform:scale(0.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .task-main{ flex:1; min-width:0; }
  .task-text{
    display:block; width:100%; border:none; background:transparent; color:var(--ink); font:inherit;
    font-size:0.92rem; line-height:1.35; padding:2px 4px; border-radius:4px; resize:none; overflow:hidden;
  }
  @media (max-width: 640px){
    .task-text{ font-size:0.95rem; }
  }
  .task-text:focus{ background:var(--paper-sunken); }
  .task-row.done .task-text{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); transition: color .2s ease; }
  .task-meta{ display:flex; align-items:center; gap:8px; margin-top:2px; padding-left:4px; flex-wrap:wrap; }
  .priority-flag{
    display:inline-flex; align-items:center; gap:6px; font-size:0.8rem; color:var(--muted); flex-shrink:0;
    border:1px solid transparent; border-radius:999px; padding:2px 9px 2px 8px; cursor:pointer; background:transparent;
    opacity:0.72; transition: opacity .12s ease, background .12s ease, border-color .12s ease;
  }
  .priority-flag:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); background:var(--paper-raised); opacity:1; }
  .priority-flag.set{ color:var(--ink-soft); border-color: var(--line); background:var(--paper-raised); opacity:1; }
  .priority-flag.set:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .priority-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; border:1px solid var(--line); }
  .priority-dot.dot-high{ background:#d6483c; border-color:#b83a30; }
  .priority-dot.dot-medium{ background:#e08a34; border-color:#c07326; }
  .priority-dot.dot-low{ background:#3f9142; border-color:#337536; }
  .priority-dot.dot-none{ background:#ffffff; border-color:var(--line); }
  .due-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:0.8rem; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:2px 9px 2px 8px; cursor:pointer; background:var(--paper-raised);
  }
  .due-badge:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .due-badge.set{ color:var(--ink-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .due-badge.overdue{ color:var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
  .sync-icon{ width:14px; height:14px; flex-shrink:0; }
  .sync-note{ font-size:0.72rem; color:var(--danger); }
  .task-actions{ display:flex; gap:2px; opacity:0; transition:opacity .1s; flex-shrink:0; }
  .task-row:hover .task-actions, .task-row:focus-within .task-actions{ opacity:1; }
  .icon-btn{ background:none; border:none; color:var(--muted); cursor:pointer; padding:5px; border-radius:5px; display:flex; align-items:center; justify-content:center; }
  .icon-btn:hover{ color:var(--ink); background:var(--paper-sunken); }
  .icon-btn.danger:hover{ color:var(--danger); }

  .due-editor{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; background:var(--paper-sunken); border:1px solid var(--line); border-radius:var(--radius-s); padding:6px 8px; margin-top:4px; }
  .due-editor input[type="date"], .due-editor input[type="time"]{ font:inherit; font-size:0.8rem; border:1px solid var(--line); border-radius:4px; padding:3px 5px; background:var(--paper-raised); color:var(--ink); }
  .due-editor label{ display:flex; align-items:center; gap:4px; font-size:0.78rem; color:var(--muted); }
  .due-time-sep{ font-size:0.78rem; color:var(--muted); }
  .snooze-row{ display:flex; align-items:center; gap:6px; width:100%; padding-top:6px; margin-top:2px; border-top:1px solid var(--line); }
  .snooze-label{ font-size:0.72rem; color:var(--muted); margin-right:2px; }

  .notes-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:0.8rem; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:2px 9px 2px 8px; cursor:pointer; background:var(--paper-raised);
  }
  .notes-badge:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .notes-badge.set{ color:var(--ink-soft); border-color: color-mix(in srgb, var(--accent-2) 45%, var(--line)); }
  .notes-editor{
    display:flex; flex-direction:column; background:var(--paper-sunken); border:1px solid var(--line);
    border-radius:var(--radius-s); padding:8px; margin-top:4px;
  }
  /* Only a task's own notes/checklist block gets this collapsible head+chevron — it's the
     only notes UI that shows up unprompted whenever there's content, so it's also the only
     one that needs a way to fold back out of the way again. */
  .notes-editor-head{ display:flex; align-items:center; gap:4px; }
  .notes-editor-head .notes-collapse-btn svg{ transition: transform .15s ease; }
  .notes-editor.collapsed .notes-editor-head .notes-collapse-btn svg{ transform: rotate(-90deg); }
  .notes-editor-head-label{ font-size:0.72rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  .notes-editor-content{ display:flex; flex-direction:column; gap:7px; padding-top:7px; }
  .notes-toolbar{ display:flex; align-items:center; gap:3px; position:relative; }
  .notes-fmt-btn{
    display:flex; align-items:center; justify-content:center; width:26px; height:26px; border:1px solid var(--line);
    border-radius:var(--radius-s); background:var(--paper-raised); color:var(--ink-soft); cursor:pointer; font-size:0.82rem; padding:0;
  }
  .notes-fmt-btn:hover{ background:var(--paper-sunken); }
  .notes-fmt-btn.active{ background:color-mix(in srgb, var(--accent) 16%, var(--paper-sunken)); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); color:var(--ink); }
  .notes-done-btn{ margin-left:auto; display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; width:auto; }
  .notes-remove-btn{ flex-shrink:0; }
  /* A brief highlight right after "Done" (or a plain blur) confirms the save actually went
     through, rather than leaving it to guesswork or the small global save indicator. */
  .notes-editor.just-saved{
    border-color: color-mix(in srgb, var(--accent-2) 55%, var(--line));
    background: color-mix(in srgb, var(--accent-2) 8%, var(--paper-sunken));
    transition: border-color .25s ease, background .25s ease;
  }
  .notes-link-popover{
    position:absolute; top:100%; left:0; margin-top:4px; z-index:20; display:flex; gap:6px; align-items:center;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-s); box-shadow:var(--shadow); padding:6px;
  }
  .notes-link-input{
    font:inherit; font-size:0.82rem; border:1px solid var(--line); border-radius:4px; padding:4px 6px;
    background:var(--paper-raised); color:var(--ink); width:200px;
  }
  .notes-rich{
    width:100%; font:inherit; font-size:0.85rem; border:1px solid var(--line); border-radius:var(--radius-s);
    padding:6px 8px; background:var(--paper-raised); color:var(--ink); resize:vertical; overflow:auto; min-height:52px; line-height:1.4;
  }
  .notes-rich:focus{ outline:none; border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .notes-rich:empty:before{ content:attr(data-placeholder); color:var(--muted); }
  .notes-rich a{ color:var(--accent); text-decoration:underline; }
  .notes-rich ul, .notes-rich ol{ margin:4px 0 4px 20px; padding:0; }
  .notes-rich li{ margin:2px 0; }
  .notes-hint{ font-size:0.68rem; color:var(--muted); }
  /* A heading/sub-heading can hold several independent notes, each its own card — unlike a
     task's single notes field, these are always shown (no click needed to see what's there),
     so the block just stacks them with a little breathing room between cards. */
  .heading-notes-block{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
  .checklist-list{ display:flex; flex-direction:column; gap:2px; }
  .checklist-item{ display:flex; align-items:center; gap:6px; }
  .checklist-item-check{ flex-shrink:0; }
  .checklist-item-text{
    flex:1; min-width:0; border:none; background:transparent; color:var(--ink); font:inherit; font-size:0.85rem; padding:3px 4px; border-radius:4px;
  }
  .checklist-item-text:focus{ background:var(--paper-raised); }
  .checklist-item.done .checklist-item-text{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); }
  .checklist-item-remove{ opacity:0; padding:3px; flex-shrink:0; }
  .checklist-item:hover .checklist-item-remove, .checklist-item-text:focus ~ .checklist-item-remove{ opacity:1; }
  .checklist-add-row{ display:flex; gap:6px; }
  .checklist-add-input{
    flex:1; min-width:0; font:inherit; font-size:0.85rem; border:1px solid var(--line); border-radius:var(--radius-s);
    padding:5px 8px; background:var(--paper-raised); color:var(--ink);
  }
  .notes-editor-actions{ display:flex; justify-content:flex-end; }

  /* A heading/sub-heading note that isn't actively being edited shows just its rendered
     content — no toolbar, no Done/remove buttons cluttering the view — until you click into
     it. The remove button stays available but out of the way (revealed on hover/focus). */
  .notes-editor.view-mode{ flex-direction:row; align-items:flex-start; gap:4px; padding:6px 8px; }
  .notes-view{
    flex:1; min-width:0; font-size:0.85rem; line-height:1.45; color:var(--ink); cursor:pointer;
    padding:3px 5px; border-radius:4px; word-wrap:break-word;
  }
  .notes-view:hover, .notes-view:focus{ background:var(--paper-raised); outline:none; }
  .notes-view-empty{ color:var(--muted); font-style:italic; }
  .notes-view a{ color:var(--accent); text-decoration:underline; }
  .notes-view ul, .notes-view ol{ margin:4px 0 4px 20px; padding:0; }
  .notes-view li{ margin:2px 0; }
  .notes-editor.view-mode .notes-remove-btn{ opacity:0; flex-shrink:0; transition:opacity .12s ease; }
  .notes-editor.view-mode:hover .notes-remove-btn, .notes-editor.view-mode:focus-within .notes-remove-btn{ opacity:1; }

  .tags-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:0.8rem; color:var(--muted); max-width:220px;
    border:1px solid var(--line); border-radius:999px; padding:2px 9px 2px 8px; cursor:pointer; background:var(--paper-raised);
  }
  .tags-badge span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tags-badge:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .tags-badge.set{ color:var(--ink-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .tags-editor{
    display:flex; flex-direction:column; gap:7px; background:var(--paper-sunken); border:1px solid var(--line);
    border-radius:var(--radius-s); padding:8px; margin-top:4px;
  }
  .tag-chip-list{ display:flex; flex-wrap:wrap; gap:6px; }
  .tag-chip{
    display:inline-flex; align-items:center; gap:5px; font-size:0.78rem; color:var(--ink-soft);
    background:var(--paper-raised); border:1px solid color-mix(in srgb, var(--tag-color) 45%, var(--line));
    border-radius:999px; padding:3px 5px 3px 10px;
  }
  .tag-chip::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--tag-color); flex-shrink:0; }
  .tag-chip-remove{ background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; display:flex; border-radius:50%; }
  .tag-chip-remove:hover{ color:var(--danger); background:var(--paper-sunken); }
  .tag-add-row{ display:flex; gap:6px; }
  .tag-add-input{
    flex:1; min-width:0; font:inherit; font-size:0.85rem; border:1px solid var(--line); border-radius:var(--radius-s);
    padding:5px 8px; background:var(--paper-raised); color:var(--ink);
  }
  .tag-filter-toggle-btn.active{ color:var(--ink-soft); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); background:var(--paper-sunken); }
  .tag-filter-toggle-btn svg{ vertical-align:-1px; margin-right:4px; }
  .tag-filter-popover{
    position:fixed; z-index:60; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-s);
    box-shadow:0 8px 24px rgba(0,0,0,0.18); padding:8px; min-width:180px; max-height:280px; overflow-y:auto;
  }
  .tag-filter-row{ display:flex; align-items:center; gap:8px; padding:6px 7px; border-radius:var(--radius-s); font-size:0.85rem; cursor:pointer; }
  .tag-filter-row:hover{ background:var(--paper-sunken); }
  .tag-filter-row input{ width:auto; flex-shrink:0; }
  .tag-chip-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .due-filter-popover{ min-width:210px; max-height:none; }
  .due-filter-range{ border-top:1px solid var(--line); margin-top:6px; padding-top:8px; }
  .due-filter-range-label{ font-size:0.72rem; font-weight:700; letter-spacing:0.02em; color:var(--muted); padding:0 7px 4px; }
  .due-filter-range-row{ display:flex; align-items:center; gap:6px; padding:0 7px; }
  .due-filter-range-row input[type="date"]{ flex:1; min-width:0; font:inherit; font-size:0.8rem; border:1px solid var(--line); border-radius:var(--radius-s); padding:4px 6px; background:var(--paper-raised); color:var(--ink); }
  .due-filter-range-sep{ font-size:0.78rem; color:var(--muted); flex-shrink:0; }

  .subtasks-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:0.8rem; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:2px 9px 2px 8px; cursor:pointer; background:var(--paper-raised);
  }
  .subtasks-badge:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .subtasks-badge.set{ color:var(--ink-soft); border-color: color-mix(in srgb, var(--accent-2) 45%, var(--line)); }
  .subtask-chevron{ flex-shrink:0; transition: transform .15s ease; }
  .subtasks-badge.open .subtask-chevron, .task-subtask-toggle.open .subtask-chevron{ transform: rotate(180deg); }
  .task-subtask-toggle{
    background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; margin-top:1px;
    display:flex; align-items:center; justify-content:center; border-radius:4px; flex-shrink:0;
  }
  .task-subtask-toggle:hover{ color:var(--ink); background:var(--paper-sunken); }
  .task-subtask-toggle.open{ color:var(--ink-soft); }
  .subtasks-editor{
    display:flex; flex-direction:column; gap:7px; background:var(--paper-sunken); border:1px solid var(--line);
    border-radius:var(--radius-s); padding:8px; margin-top:4px;
  }
  .subtask-list{ display:flex; flex-direction:column; gap:3px; }
  .subtask-item{ display:flex; flex-direction:column; gap:4px; }
  .subtask-item-row{ display:flex; align-items:flex-start; gap:6px; }
  /* Reuses .check's base styling (colors, states) at a slightly smaller size to fit the
     tighter subtask row. */
  .subtask-check{ width:15px; height:15px; margin-top:3px; flex-shrink:0; }
  .subtask-check.status-done::after{ left:4px; top:0; width:4px; height:7px; }
  .subtask-check.status-in_progress::after{ width:6px; height:6px; margin:-3px 0 0 -3px; }
  .subtask-item.in-progress .subtask-item-row{ box-shadow: inset 2px 0 0 var(--accent); border-radius:2px; }
  .subtask-text{
    display:block; flex:1; min-width:0; border:none; background:transparent; color:var(--ink); font:inherit;
    font-size:0.85rem; line-height:1.3; padding:3px 4px; border-radius:4px; resize:none; overflow:hidden;
  }
  .subtask-text:focus{ background:var(--paper-raised); }
  .subtask-item.done .subtask-text{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); }
  .due-badge-sm{ font-size:0.7rem; padding:1px 7px; flex-shrink:0; margin-top:1px; }
  .subtask-remove{ opacity:0; padding:3px; flex-shrink:0; margin-top:1px; }
  .subtask-item:hover .subtask-remove, .subtask-text:focus ~ .subtask-remove{ opacity:1; }
  .subtask-add-row{ display:flex; gap:6px; }
  .subtask-add-input{
    flex:1; min-width:0; font:inherit; font-size:0.85rem; border:1px solid var(--line); border-radius:var(--radius-s);
    padding:5px 8px; background:var(--paper-raised); color:var(--ink);
  }

  .attachments-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:0.8rem; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:2px 9px 2px 8px; cursor:pointer; background:var(--paper-raised);
  }
  .attachments-badge:hover{ border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .attachments-badge.set{ color:var(--ink-soft); border-color: color-mix(in srgb, var(--accent-2) 45%, var(--line)); }
  .attachments-editor{
    display:flex; flex-direction:column; gap:7px; background:var(--paper-sunken); border:1px solid var(--line);
    border-radius:var(--radius-s); padding:8px; margin-top:4px;
  }
  /* Focused programmatically (see the paste-image handler below) so Cmd/Ctrl+V works the
     moment the panel opens — not via Tab, so the default focus ring would look stray here. */
  .attachments-editor:focus{ outline:none; }
  .attachment-list{ display:flex; flex-direction:column; gap:6px; }
  .attachment-item{ display:flex; align-items:center; gap:8px; }
  .attachment-thumb{
    width:32px; height:32px; border-radius:6px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--paper-raised); border:1px solid var(--line); color:var(--muted); overflow:hidden;
  }
  .attachment-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .attachment-info{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .attachment-name-btn{
    background:none; border:none; padding:0; text-align:left; font:inherit; font-size:0.85rem; color:var(--accent);
    cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .attachment-name-btn:hover{ text-decoration:underline; }
  .attachment-name-btn:disabled{ color:var(--muted); cursor:default; text-decoration:none; }
  .attachment-size{ font-size:0.72rem; color:var(--muted); }
  .attachment-remove{ flex-shrink:0; padding:4px; }
  .attachment-add-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .attachment-add-label{ cursor:pointer; }
  .attachment-hint{ font-size:0.74rem; color:var(--muted); }
  .attachment-error{ font-size:0.78rem; color:var(--danger); }

  .ghost-add{
    display:flex; align-items:center; gap:6px; color:var(--muted); background:none; border:1px dashed var(--line);
    border-radius:var(--radius-s); padding:6px 10px; font-size:0.82rem; cursor:pointer; margin-top:4px; width:100%; justify-content:flex-start;
  }
  .ghost-add:hover{ color:var(--ink); border-color: color-mix(in srgb, var(--ink) 25%, var(--line)); }
  .archive-toggle{ border-style:solid; background:var(--paper-sunken); }
  .archive-toggle svg{ transition:transform .15s ease; flex-shrink:0; }
  .archived-list{ display:flex; flex-direction:column; gap:1px; margin-top:4px; border-radius:var(--radius-s); overflow:hidden; }
  .archived-row{
    display:flex; align-items:center; gap:8px; padding:6px 8px; background:var(--paper-sunken); font-size:0.85rem;
  }
  .archived-text{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); }
  .trash-row-path{ font-size:0.78rem; text-decoration:none; opacity:0.8; }
  .archived-date{ font-size:0.72rem; color:var(--muted); flex-shrink:0; }
  .archived-row .btn{ flex-shrink:0; }

  .empty-state{ text-align:center; padding:64px 20px; color:var(--muted); border:1px dashed var(--line); border-radius:var(--radius-l); margin-top:12px; }
  .empty-state h2{ font-size:1.3rem; color:var(--ink); margin-bottom:8px; }
  .empty-state p{ max-width:420px; margin:0 auto 18px; font-size:0.9rem; }

  /* ---------- today view ---------- */
  .today-section{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:16px; }
  .today-section-head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .today-section-title{ font-size:1rem; font-weight:600; }
  .today-section-count{ color:var(--muted); font-size:0.78rem; }
  .today-task-wrap{ padding-top:6px; }
  .today-task-wrap:first-of-type{ padding-top:0; }
  .today-task-path{ font-size:0.72rem; color:var(--muted); padding:4px 4px 0; }
  .today-task-path-sep{ opacity:0.6; }
  #today-view .grip{ display:none; }

  /* ---------- stats page ---------- */
  .stats-head{ margin-bottom:18px; }
  .stats-head h2{ font-size:1.4rem; font-weight:600; }
  .stats-head p{ color:var(--muted); font-size:0.86rem; margin-top:4px; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:26px; }
  .stat-tile{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m); padding:14px 16px; box-shadow:var(--shadow); }
  .stat-tile .num{ font-family:var(--font-heading); font-size:1.9rem; font-weight:600; line-height:1; }
  .stat-tile .num.danger{ color:var(--danger); }
  .stat-tile .num.accent2{ color:var(--accent-2); }
  .stat-tile .label{ font-size:0.78rem; color:var(--muted); margin-top:5px; }
  .stats-section{ margin-bottom:26px; }
  .stats-section h3{ font-size:0.95rem; font-weight:600; margin-bottom:10px; }
  .heading-bar-row{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .heading-bar-row .hb-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; border:1px solid transparent; box-sizing:border-box; }
  .heading-bar-row .hb-dot.unset{ background:var(--paper) !important; border-color:var(--line); }
  .heading-bar-row .hb-name{ font-size:0.85rem; flex:0 0 140px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .heading-bar-row .hb-track{ flex:1; height:7px; background:var(--paper-sunken); border-radius:99px; overflow:hidden; }
  .heading-bar-row .hb-fill{ display:block; height:100%; border-radius:99px; transition:width .3s ease; }
  .heading-bar-row .hb-frac{ font-size:0.72rem; color:var(--muted); flex-shrink:0; width:44px; text-align:right; }
  .upcoming-list{ display:flex; flex-direction:column; gap:2px; }
  .upcoming-row{ display:flex; align-items:baseline; gap:10px; padding:6px 0; border-bottom:1px solid var(--line-soft); font-size:0.85rem; }
  .upcoming-row:last-child{ border-bottom:none; }
  .upcoming-row .up-date{ color:var(--muted); font-size:0.76rem; width:64px; flex-shrink:0; }
  .upcoming-row .up-text{ flex:1; min-width:0; }
  .upcoming-row .up-heading{ color:var(--muted); font-size:0.74rem; flex-shrink:0; }
  .stats-empty{ color:var(--muted); font-size:0.85rem; padding:20px 0; text-align:center; border:1px dashed var(--line); border-radius:var(--radius-m); }

  .save-indicator{
    position:fixed; bottom:18px; right:18px; z-index:30; background:var(--paper-raised); border:1px solid var(--line);
    box-shadow:var(--shadow); border-radius:999px; padding:7px 14px; font-size:0.76rem; color:var(--muted);
    display:flex; align-items:center; gap:6px; opacity:0; transform:translateY(6px); transition:opacity .2s ease, transform .2s ease; pointer-events:none;
  }
  .save-indicator.show{ opacity:1; transform:none; }
  .save-indicator .status-dot{ width:6px; height:6px; }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,12,18,0.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-box{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); padding:22px; max-width:420px; width:100%; box-shadow:var(--shadow); max-height:90vh; overflow:auto; }
  .modal-box h3{ font-size:1.1rem; margin-bottom:6px; }
  .modal-box p{ font-size:0.85rem; color:var(--muted); margin:0 0 16px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:8px; margin-top:16px; flex-wrap:wrap; }
  /* Jump-to-heading outline drawer — a side menu listing every heading (plus its sub-headings,
     slightly indented) with a live task count, for getting to one further down a long list
     without scrolling past everything in between. Unlike a modal, it stays open across clicks
     so you can jump to several headings in a row. */
  .outline-drawer-backdrop{
    position:fixed; inset:0; background:rgba(10,12,18,0.25); z-index:55;
    opacity:0; pointer-events:none; transition:opacity 0.2s ease;
  }
  .outline-drawer-backdrop.open{ opacity:1; pointer-events:auto; }
  .outline-drawer{
    position:fixed; top:0; left:0; bottom:0; width:320px; max-width:85vw; z-index:56;
    background:var(--paper-raised); border-right:1px solid var(--line); box-shadow:var(--shadow);
    display:flex; flex-direction:column; transform:translateX(-100%); transition:transform 0.22s ease;
  }
  .outline-drawer.open{ transform:translateX(0); }
  .outline-drawer-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:16px 10px 12px 18px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  .outline-drawer-header h3{ font-size:1.05rem; margin:0; }
  .outline-drawer-close{
    border:none; background:none; cursor:pointer; color:var(--muted); font-size:1.4rem; line-height:1;
    padding:4px 9px; border-radius:var(--radius-s);
  }
  .outline-drawer-close:hover{ background:var(--paper-sunken); color:var(--ink); }
  #outline-btn.active{ background:var(--paper-sunken); border-color:color-mix(in srgb, var(--accent) 45%, var(--line)); color:var(--ink); }
  .outline-list{ display:flex; flex-direction:column; gap:2px; overflow:auto; margin-top:0; padding:10px 12px 18px; flex:1; }
  .outline-group{ display:flex; flex-direction:column; }
  .outline-item-row{ display:flex; align-items:center; gap:0; }
  .outline-item{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none; background:none;
    padding:7px 8px; border-radius:var(--radius-s); cursor:pointer; font:inherit; font-size:0.85rem; color:var(--ink);
  }
  .outline-item:hover{ background:var(--paper-sunken); }
  .outline-sub-item{ padding-left:26px; font-size:0.8rem; color:var(--ink-soft); }
  .outline-item-dot{ width:8px; height:8px; border-radius:50%; background:var(--line); flex-shrink:0; }
  .outline-item-title{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .outline-item-count{ color:var(--muted); font-size:0.78rem; flex-shrink:0; }
  .outline-empty{ color:var(--muted); font-size:0.85rem; margin:0; padding:8px 8px 0; }
  /* Expand/collapse a heading's own sub-heading list within the outline panel — separate
     from clicking the heading row itself, which still jumps straight to it. */
  .outline-group-toggle{
    background:none; border:none; color:var(--muted); cursor:pointer; padding:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; border-radius:4px;
  }
  .outline-group-toggle:hover{ background:var(--paper-sunken); }
  .outline-group-toggle svg{ transition: transform .15s ease; transform: rotate(-90deg); }

  .outline-group-toggle-spacer{ width:26px; flex-shrink:0; }
  @keyframes outlineFlash{
    0%{ box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 55%, transparent); }
    100%{ box-shadow:0 0 0 3px transparent; }
  }
  .heading-card.outline-highlight, .sub-block.outline-highlight{ animation: outlineFlash 1.4s ease-out; border-radius: var(--radius-l); }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:0.78rem; color:var(--muted); margin-bottom:4px; font-weight:600; letter-spacing:0.01em; }
  .field input, .field select, .field textarea{ width:100%; font:inherit; font-size:0.88rem; padding:8px 10px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--paper-sunken); color:var(--ink); }
  .field input:focus, .field select:focus, .field textarea:focus{ background:var(--paper-raised); }
  .field textarea{ resize:vertical; min-height:120px; }
  .field-hint{ font-size:0.72rem; color:var(--muted); margin-top:3px; }
  .field-row{ display:flex; gap:10px; }
  .field-row .field{ flex:1; }
  .modal-error{ font-size:0.8rem; color:var(--danger); margin:-6px 0 12px; }
  .modal-note{ font-size:0.8rem; color:var(--muted); background:var(--paper-sunken); border-radius:var(--radius-s); padding:8px 10px; margin:-4px 0 14px; }
  .cal-display-list{ display:flex; flex-direction:column; gap:2px; max-height:150px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius-s); padding:4px; background:var(--paper-sunken); }
  .cal-display-row{ display:flex; align-items:center; gap:8px; padding:6px 7px; border-radius:var(--radius-s); font-size:0.85rem; cursor:pointer; }
  .cal-display-row:hover{ background:var(--paper-raised); }
  .cal-display-row input{ width:auto; flex-shrink:0; }
  .cal-display-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; box-shadow:0 0 0 1px var(--line); }
  .ics-feeds-field{ margin-top:6px; }
  .ics-feed-list{ display:flex; flex-direction:column; gap:2px; max-height:160px; overflow-y:auto; border:1px solid var(--line); border-radius:var(--radius-s); padding:4px; background:var(--paper-sunken); margin-bottom:10px; }
  .ics-feed-row{ display:flex; align-items:center; gap:8px; padding:6px 7px; border-radius:var(--radius-s); font-size:0.85rem; }
  .ics-feed-row:hover{ background:var(--paper-raised); }
  .ics-feed-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ics-feed-status{ font-size:0.72rem; color:var(--muted); flex-shrink:0; }
  .ics-feed-remove{ font-size:0.72rem; padding:3px 8px; flex-shrink:0; }
  .ics-add-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .ics-add-row input{ flex:1; min-width:120px; }
  .ics-add-row .btn{ flex-shrink:0; }
  .digest-field{ margin-top:14px; }
  .export-field{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line-soft); }
  .export-field .field-hint{ margin-bottom:8px; }
  .digest-toggle-row{ display:flex; align-items:center; gap:8px; cursor:pointer; font-size:0.9rem; margin:8px 0; }
  .digest-toggle-row input{ width:auto; flex-shrink:0; }
  .digest-field input[type="email"]{ margin-bottom:8px; }

  /* ---------- theme popover ---------- */
  .theme-popover{
    position:fixed; z-index:40; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
    box-shadow:var(--shadow); padding:8px; display:flex; flex-direction:column; gap:2px; min-width:170px;
    max-height:min(480px, calc(100vh - 90px)); overflow-y:auto;
  }
  .theme-option{
    display:flex; align-items:center; gap:9px; border:none; background:transparent; padding:8px 9px; border-radius:var(--radius-s);
    cursor:pointer; font:inherit; font-size:0.85rem; color:var(--ink); text-align:left;
  }
  .theme-option:hover{ background:var(--paper-sunken); }

  .theme-swatch{ display:flex; flex-shrink:0; }
  .theme-swatch span{ width:13px; height:13px; border-radius:50%; box-shadow:0 0 0 1px var(--line); }
  .theme-swatch span + span{ margin-left:-4px; }
  .theme-section-label{ font-size:0.7rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); padding:6px 9px 3px; }
  .theme-appearance-row{ display:flex; gap:2px; background:var(--paper-sunken); padding:3px; border-radius:var(--radius-m); margin:0 4px 8px; }
  .theme-appearance-btn{
    flex:1; border:none; background:transparent; padding:6px 4px; border-radius:calc(var(--radius-m) - 3px);
    font-size:0.78rem; font-weight:500; color:var(--muted); cursor:pointer;
  }
  .theme-appearance-btn.active{ background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow); }
  .theme-appearance-btn:hover:not(.active){ color:var(--ink); }
  .theme-font-list{ display:flex; flex-direction:column; gap:2px; }
  .theme-font-option{
    display:flex; align-items:center; gap:10px; border:none; background:transparent; padding:6px 9px; border-radius:var(--radius-s);
    cursor:pointer; font:inherit; font-size:0.85rem; color:var(--ink); text-align:left;
  }
  .theme-font-option:hover{ background:var(--paper-sunken); }
  .theme-font-option.active{ background:color-mix(in srgb, var(--accent) 12%, var(--paper-sunken)); }
  .theme-font-sample{
    display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; flex-shrink:0;
    border:1px solid var(--line); border-radius:var(--radius-s); background:var(--paper); font-size:0.95rem; font-weight:600;
  }
  .theme-font-label{ font-weight:500; }
  .theme-font-option.active .theme-font-label{ font-weight:700; }

  /* ---------- calendar view ---------- */
  .cal-head{ display:flex; align-items:center; gap:10px; margin:22px 0 16px; flex-wrap:wrap; }
  .cal-head h2{ font-size:1.25rem; flex:1; min-width:140px; }
  .cal-nav{ display:flex; align-items:center; gap:2px; }
  .cal-nav-btn{ border:1px solid var(--line); background:var(--paper-raised); color:var(--ink); width:30px; height:30px; border-radius:var(--radius-s); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .cal-nav-btn:hover{ background:var(--paper-sunken); }
  .cal-mode-toggle{ display:flex; gap:2px; background:var(--paper-sunken); padding:3px; border-radius:var(--radius-m); }
  .cal-loading{ font-size:0.78rem; color:var(--muted); }
  .cal-error{ font-size:0.82rem; color:var(--danger); margin-bottom:12px; }

  .cal-month-grid{ border:1px solid var(--line); border-radius:var(--radius-l); overflow:hidden; background:var(--paper-raised); box-shadow:var(--shadow); }
  .cal-weekday-row{ display:grid; grid-template-columns:repeat(7,1fr); border-bottom:1px solid var(--line); }
  .cal-weekday-row span{ padding:8px 6px; font-size:0.72rem; font-weight:600; color:var(--muted); text-align:center; letter-spacing:0.03em; text-transform:uppercase; }
  .cal-month-body{ display:grid; grid-template-columns:repeat(7,1fr); }
  .cal-day-cell{
    min-height:92px; min-width:0; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
    padding:5px; display:flex; flex-direction:column; gap:3px; cursor:pointer; position:relative; overflow:hidden;
  }
  .cal-day-cell:hover{ background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .cal-month-body .cal-day-cell:nth-child(7n){ border-right:none; }
  .cal-day-cell.outside{ background:var(--paper-sunken); }
  .cal-day-cell.outside .cal-day-num{ color:var(--muted); opacity:0.6; }
  .cal-day-num{ font-family:var(--font-mono); font-size:0.78rem; color:var(--ink-soft); }
  .cal-day-cell.today .cal-day-num{
    display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px;
    background:var(--accent); color:var(--accent-ink); border-radius:50%; font-weight:600;
  }
  .cal-chip{
    font-size:0.68rem; padding:2px 5px; border-radius:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:color-mix(in srgb, var(--accent) 16%, var(--paper-raised)); color:var(--ink); border-left:3px solid var(--accent);
  }
  .cal-chip.done{ text-decoration:line-through; opacity:0.6; }
  .cal-chip.ext-event{ background:var(--paper-sunken); border-left:3px solid var(--muted); color:var(--muted); font-style:italic; }
  .cal-chip.other-cal{ background:var(--paper-sunken); color:var(--ink-soft); border-left:3px solid var(--muted); }
  .cal-more{ font-size:0.66rem; color:var(--muted); padding:1px 5px; }

  .cal-week-grid{ display:grid; grid-template-columns:repeat(7,minmax(112px,1fr)); gap:10px; align-items:start; overflow-x:auto; -webkit-overflow-scrolling:touch; padding-bottom:6px; }
  .cal-week-col{ border:1px solid var(--line); border-radius:var(--radius-m); background:var(--paper-raised); box-shadow:var(--shadow); min-height:220px; display:flex; flex-direction:column; }
  .cal-week-col-head{ padding:8px 10px; border-bottom:1px solid var(--line-soft); text-align:center; cursor:pointer; }
  .cal-week-col-head:hover{ background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .cal-week-col-head .wd{ font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.03em; }
  .cal-week-col-head .dn{ font-family:var(--font-mono); font-size:0.95rem; }
  .cal-week-col.today .cal-week-col-head .dn{
    display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px;
    background:var(--accent); color:var(--accent-ink); border-radius:50%; font-weight:600;
  }
  .cal-week-body{ padding:6px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .cal-week-chip{
    font-size:0.72rem; padding:4px 6px; border-radius:6px; background:color-mix(in srgb, var(--accent) 14%, var(--paper-raised));
    border-left:3px solid var(--accent); color:var(--ink); line-height:1.3;
  }
  .cal-week-chip.done{ text-decoration:line-through; opacity:0.6; }
  .cal-week-chip.ext-event{ background:var(--paper-sunken); border-left:3px solid var(--muted); color:var(--muted); font-style:italic; }
  .cal-week-chip.other-cal{ background:var(--paper-sunken); color:var(--ink-soft); border-left:3px solid var(--muted); }
  .cal-week-chip .t{ display:block; font-size:0.62rem; color:var(--muted); font-family:var(--font-mono); }
  .cal-week-add{ border:1px dashed var(--line); background:transparent; color:var(--muted); border-radius:6px; padding:5px 6px; font-size:0.72rem; cursor:pointer; }
  .cal-week-add:hover{ color:var(--ink); border-color:color-mix(in srgb, var(--ink) 25%, var(--line)); }

  .search-row{ display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  .search-input-wrap{ position:relative; flex:1; min-width:200px; max-width:420px; }
  .search-icon{ position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none; }
  .search-input{
    width:100%; font:inherit; font-size:0.88rem; border:1px solid var(--line); border-radius:999px;
    padding:7px 10px 7px 30px; background:var(--paper-raised); color:var(--ink);
  }
  .search-input:focus{ border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
  .search-status{ font-size:0.78rem; color:var(--muted); }
  .list-sort-row{ display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .list-sort-label{ font-size:0.72rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); }
  /* Extra breathing room ahead of the Sort group, now that View leads the row — keeps the
     two toggles from reading as one continuous cluster of buttons. */
  .list-sort-label-gapped{ margin-left:18px; }
  .list-sort-toggle{ display:inline-flex; gap:2px; background:var(--paper-sunken); padding:3px; border-radius:var(--radius-m); }
  .list-sort-btn{
    border:none; background:transparent; padding:5px 11px; border-radius:calc(var(--radius-m) - 3px);
    font-size:0.78rem; font-weight:500; color:var(--muted); cursor:pointer; font:inherit;
  }
  .list-sort-btn.active{ background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow); font-weight:600; }
  .list-sort-btn:hover:not(.active){ color:var(--ink); }
  .grip.inactive{ opacity:0.35; cursor:default; }

  .heading-tabs-bar{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .heading-tab-btn{
    flex-shrink:0; display:inline-flex; align-items:center; gap:6px; border:none; background:var(--paper-sunken);
    padding:7px 13px; border-radius:var(--radius-m); font-size:0.82rem; font-weight:500; color:var(--muted);
    cursor:pointer; font:inherit; transition:background .12s ease,color .12s ease;
  }
  .heading-tab-btn.active{ background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow); font-weight:600; }
  .heading-tab-btn:hover:not(.active){ color:var(--ink); }
  .heading-tab-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .heading-tab-count{ font-size:0.72rem; color:var(--muted); }
  .heading-tab-btn.active .heading-tab-count{ color:var(--ink); }

  .undo-toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:60;
    display:flex; align-items:center; gap:12px; background:var(--ink); color:var(--paper);
    border-radius:var(--radius-m); padding:10px 10px 10px 16px; box-shadow:var(--shadow); font-size:0.85rem;
    animation: undo-toast-in .18s ease;
  }
  .undo-toast .btn{ color:var(--paper); border-color:color-mix(in srgb, var(--paper) 35%, transparent); }
  .undo-toast .btn:hover{ background:color-mix(in srgb, var(--paper) 15%, transparent); }
  @keyframes undo-toast-in{ from{ opacity:0; transform:translateX(-50%) translateY(6px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }

  .reminder-toasts{ position:fixed; bottom:22px; right:16px; z-index:45; display:flex; flex-direction:column-reverse; gap:8px; max-width:300px; }
  .reminder-toast{
    background:var(--paper-raised); border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:var(--radius-m); box-shadow:var(--shadow); padding:10px 12px; font-size:0.83rem;
    animation: reminder-toast-in .18s ease;
  }
  @keyframes reminder-toast-in{ from{ opacity:0; transform:translateX(12px); } to{ opacity:1; transform:translateX(0); } }
  .reminder-toast-title{ font-weight:600; color:var(--ink); margin-bottom:2px; }
  .reminder-toast-path{ color:var(--muted); font-size:0.76rem; margin-bottom:4px; }
  .reminder-toast-time{ color:var(--muted); font-size:0.72rem; margin-bottom:8px; }
  .reminder-toast-actions{ display:flex; gap:5px; flex-wrap:wrap; }
  .reminder-toast-actions .btn{ padding:3px 8px; font-size:0.76rem; }

  .week-view-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .week-view-title{ font-size:1.15rem; font-weight:600; }
  .week-view-range{ color:var(--muted); font-size:0.85rem; }
  .week-day-section{ margin-bottom:10px; }
  .week-day-today .today-section-title{ color:var(--accent); }
  .week-day-today-tag{
    display:inline-block; font-size:0.68rem; font-weight:600; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent);
    border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:middle;
  }
  .week-day-empty{ color:var(--muted); font-size:0.82rem; padding:4px 4px 2px; }

  /* Status board: not started / in progress / done, one column each. */
  .board-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  .board-title{ font-size:1.15rem; font-weight:600; }
  .board-sub{ color:var(--muted); font-size:0.85rem; margin-top:2px; }
  .board{ display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; align-items:start; }
  @media (max-width: 860px){ .board{ grid-template-columns:1fr; } }
  .board-col{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-l); box-shadow:var(--shadow); overflow:hidden; }
  .board-col-head{ display:flex; align-items:center; gap:9px; padding:12px 14px; border-bottom:1px solid var(--line-soft); }
  .board-col-dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
  .board-col-dot.not-started{ background:var(--paper-raised); border:2px solid var(--line); }
  .board-col-dot.in-progress{ background:var(--accent); }
  .board-col-dot.done{ background:var(--accent-2); }
  .board-col-title{ font-size:0.92rem; font-weight:600; flex:1; }
  .board-col-count{ color:var(--muted); font-size:0.76rem; background:var(--paper-sunken); border-radius:999px; padding:2px 8px; }
  .board-col-body{ padding:9px; display:flex; flex-direction:column; gap:8px; }
  .board-col-empty{ padding:18px 10px; text-align:center; color:var(--muted); font-size:0.82rem; }
  .board-card{ background:var(--paper-sunken); border:1px solid var(--line-soft); border-radius:var(--radius-m); padding:9px 10px; }
  .board-card.in-progress{ box-shadow: inset 2px 0 0 var(--accent); }
  .board-card.context-only{ opacity:0.72; }
  .board-card-path{ font-size:0.68rem; color:var(--muted); margin-bottom:5px; display:flex; align-items:center; gap:4px; }
  .board-card-path .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .board-card-row{ display:flex; align-items:flex-start; gap:8px; }
  .board-card-title{ font-size:0.87rem; flex:1; }
  .board-card.done .board-card-title{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); }
  .board-card-meta{ display:flex; gap:6px; margin-top:6px; padding-left:26px; flex-wrap:wrap; }
  .board-card-meta .pill{
    display:inline-flex; align-items:center; gap:4px; font-size:0.68rem; color:var(--muted);
    border:1px solid var(--line); border-radius:999px; padding:1px 7px; background:var(--paper-raised);
  }
  .board-card-meta .pill.overdue{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, var(--line)); }
  .board-card-meta .pill.high{ color:#a3492f; border-color:color-mix(in srgb, #a3492f 35%, var(--line)); }
  .board-card-meta .pill.medium{ color:#a3762a; border-color:color-mix(in srgb, #a3762a 35%, var(--line)); }
  .board-card-meta .pill.low{ color:var(--accent-2); border-color:color-mix(in srgb, var(--accent-2) 35%, var(--line)); }
  .board-subtask{
    margin-top:7px; margin-left:26px; padding:6px 8px; background:var(--paper-raised); border:1px solid var(--line-soft);
    border-radius:var(--radius-s); display:flex; align-items:flex-start; gap:7px;
  }
  .board-subtask.in-progress{ box-shadow: inset 2px 0 0 var(--accent); }
  .board-subtask .check{ width:15px; height:15px; margin-top:2px; flex-shrink:0; }
  .board-subtask .check.status-done::after{ left:4px; top:0; width:4px; height:7px; }
  .board-subtask .check.status-in_progress::after{ width:6px; height:6px; margin:-3px 0 0 -3px; }
  .board-subtask-title{ font-size:0.8rem; color:var(--ink-soft); }
  .board-subtask.done .board-subtask-title{ color:var(--muted); text-decoration:line-through; text-decoration-color:var(--line); }

  .quickadd-popover{
    position:fixed; z-index:40; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-m);
    box-shadow:var(--shadow); padding:12px; width:230px; display:flex; flex-direction:column; gap:8px;
  }
  .quickadd-popover .qa-title{ font-size:0.78rem; font-weight:600; color:var(--muted); }
  .quickadd-popover input, .quickadd-popover select{
    width:100%; font:inherit; font-size:0.85rem; padding:7px 9px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--paper-sunken); color:var(--ink);
  }
  .quickadd-popover .qa-actions{ display:flex; gap:6px; justify-content:flex-end; }
</style>

<body>
<div class="shell">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <h1>Daybook</h1>
        <span class="tag">to&#8209;dos, in sections</span>
      </div>

    t.subtasks.forEach(normalizeSubtask);
    if(t.due && t.due.endTime === undefined) t.due.endTime = null;
    // Auto-archive tasks completed a while ago, so the list doesn't accumulate old
    // check marks forever — still visible under "Show archived", not deleted.
    if(t.done && t.completedAt && !t.archivedAt && !t.deletedAt){
      var ageMs = Date.now() - new Date(t.completedAt).getTime();
      if(ageMs > ARCHIVE_AFTER_DAYS * 24 * 60 * 60 * 1000) t.archivedAt = new Date().toISOString();
    }
  }
  // Subtasks are deliberately lighter than top-level tasks: text, done, an optional
  // due date, and attachments — no notes/checklist/tags/priority/calendar sync of their own.
  function normalizeSubtask(st){
    if(!st.id) st.id = uid();
    if(typeof st.text !== "string") st.text = "";
    if(!TASK_STATUSES[st.status]) st.status = st.done ? "done" : "not_started";
    st.done = st.status === "done";
    if(st.due !== null && typeof st.due !== "object") st.due = null;
    if(st.due && st.due.endTime === undefined) st.due.endTime = null;
    if(st.completedAt === undefined) st.completedAt = null;
    if(!Array.isArray(st.attachments)) st.attachments = [];
    st.attachments.forEach(normalizeAttachment);
  }
  // Attachments created before search/OCR shipped won't have these fields — mark them
  // "pending" so the next time their editor is opened, extraction runs and catches them up.
  function normalizeAttachment(a){
    if(typeof a.extractedText !== "string") a.extractedText = "";
    if(a.textStatus === undefined) a.textStatus = a.extractedText ? "done" : "pending";
  }
  // Shared by headings and sub-headings, which got their own notes/attachments after tasks
  // already had them. A heading/sub-heading can hold several independent notes (unlike a
  // task, which has one notes field) — notesList is the current format; a heading saved
  // under the older single-`notes`-string format gets that one note migrated in as the
  // first (and only) entry the first time it's loaded.
  function normalizeNotesAndAttachments(ownerObj){
    if(!Array.isArray(ownerObj.notesList)){
      var migrated = [];
      if(typeof ownerObj.notes === "string" && stripHtmlToText(ownerObj.notes).trim()){
        migrated.push({ id: uid(), html: ownerObj.notes });
      }
      ownerObj.notesList = migrated;
    }
    ownerObj.notesList.forEach(function(n){
      if(typeof n.id !== "string" || !n.id) n.id = uid();
      if(typeof n.html !== "string") n.html = "";
    });
    delete ownerObj.notes;
    if(!Array.isArray(ownerObj.attachments)) ownerObj.attachments = [];
    ownerObj.attachments.forEach(normalizeAttachment);
  }

  /* ---------------- config (per-device, in this browser only) ---------------- */
  function loadConfig(){
    try{ return JSON.parse(localStorage.getItem(CONFIG_KEY) || "null"); }
    catch(e){ return null; }
  }
  function saveConfig(cfg){ localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg)); }
  function clearConfig(){ localStorage.removeItem(CONFIG_KEY); }
  function cfgFor(path){
    return { owner: config.owner, repo: config.repo, branch: config.branch, token: config.token, path: path };
  }

  /* ---------------- base64 <-> utf8 ---------------- */
  function b64EncodeUtf8(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUtf8(b64){ return decodeURIComponent(escape(atob(b64.replace(/\n/g, "")))); }

  /* ---------------- GitHub Contents API ---------------- */
  function contentsUrl(cfg, withRef){
    var url = "https://api.github.com/repos/" + encodeURIComponent(cfg.owner) + "/" + encodeURIComponent(cfg.repo) + "/contents/" + cfg.path.split("/").map(encodeURIComponent).join("/");
    if(withRef) url += "?ref=" + encodeURIComponent(cfg.branch);
    return url;
  }

  function ghHeaders(cfg, extra){
    var h = { "Authorization": "Bearer " + cfg.token, "Accept": "application/vnd.github+json" };
    if(extra) for(var k in extra) h[k] = extra[k];
    return h;
  }

  function describeStatus(res, json){
    if(res.status === 401) return "That token was rejected. Check it's valid and hasn't expired.";
    if(res.status === 403) return (json && /rate limit/i.test(json.message||"")) ? "GitHub rate limit hit — wait a bit and try again." : "That token doesn't have permission for this repo. It needs Contents: Read and write.";
    if(res.status === 404) return "Repo, branch, or path not found — double check the owner/repo/branch.";
    if(res.status === 409) return "conflict";
    if(res.status === 422) return (json && json.message) || "GitHub rejected the request (422).";
    return (json && json.message) || ("GitHub error (" + res.status + ")");
  }

  function ghGet(cfg){
    return fetch(contentsUrl(cfg, true), { headers: ghHeaders(cfg) }).then(function(res){
      if(res.status === 404){
        return { exists:false, sha:null, data:null };
      }
      return res.json().then(function(json){
        if(!res.ok) throw new Error(describeStatus(res, json));
        var text = b64DecodeUtf8(json.content);
        var data;
        try{ data = JSON.parse(text); } catch(e){ throw new Error("The file at that path isn't valid Daybook JSON."); }
        return { exists:true, sha: json.sha, data: data };
      });
    });
  }

  function ghPut(cfg, dataObj, prevSha, opts){
    var body = {
      message: "Update Daybook tasks — " + new Date().toISOString(),
      content: b64EncodeUtf8(JSON.stringify(dataObj, null, 2)),
      branch: cfg.branch
    };
    if(prevSha) body.sha = prevSha;
    var fetchOpts = { method: "PUT", headers: ghHeaders(cfg, {"Content-Type":"application/json"}), body: JSON.stringify(body) };
    // keepalive lets this request keep running after the page starts unloading (tab close,
    // refresh, navigation) — used only for the best-effort flush on hide/pagehide below, since
    // browsers cap keepalive request bodies at ~64KB and a normal save shouldn't be limited by that.
    if(opts && opts.keepalive) fetchOpts.keepalive = true;
    return fetch(contentsUrl(cfg, false), fetchOpts).then(function(res){
      return res.json().then(function(json){
        if(!res.ok){
          var msg = describeStatus(res, json);
          if(msg === "conflict"){ var err = new Error("conflict"); err.code = "conflict"; throw err; }
          throw new Error(msg);
        }
        return json.content.sha;
      });
    });
  }

  /* ---------------- GitHub Contents API — binary files (attachments) ----------------
     Separate from ghGet/ghPut above, which only ever read/write the one JSON tasks
     file. Attachments are uploaded as their own files under attachments/ in the repo,
     referenced from a task/subtask by path — this keeps tasks.json itself small and
     fast to sync no matter how many images or PDFs get attached.
     Note on GET: GitHub's Contents API only returns inline base64 `content` for files
     under 1MB; above that it comes back empty. The `application/vnd.github.raw` Accept
     media type sidesteps that entirely by returning the raw bytes directly (works up to
     100MB), so that's what's used here for downloading rather than the JSON content field. */
  function ghPutBinary(cfg, base64Content){
    var body = { message: "Add attachment — " + new Date().toISOString(), content: base64Content, branch: cfg.branch };
    return fetch(contentsUrl(cfg, false), {
      method: "PUT", headers: ghHeaders(cfg, {"Content-Type":"application/json"}), body: JSON.stringify(body)
    }).then(function(res){
      return res.json().then(function(json){
        if(!res.ok) throw new Error(describeStatus(res, json));
        return json.content && json.content.sha;
      });
    });
  }
  function ghGetBinaryBlob(cfg, mime){
    return fetch(contentsUrl(cfg, true), { headers: ghHeaders(cfg, {"Accept":"application/vnd.github.raw"}) }).then(function(res){
      if(res.status === 404) return { exists:false };
      if(!res.ok){
        return res.json().catch(function(){ return null; }).then(function(json){ throw new Error(describeStatus(res, json)); });
      }
      return res.blob().then(function(blob){
        return { exists:true, blob: mime ? blob.slice(0, blob.size, mime) : blob };
      });
    });
  }
  function ghDeleteFile(cfg, sha){
    var body = { message: "Remove attachment — " + new Date().toISOString(), sha: sha, branch: cfg.branch };
    return fetch(contentsUrl(cfg, false), {
      method: "DELETE", headers: ghHeaders(cfg, {"Content-Type":"application/json"}), body: JSON.stringify(body)
    }).then(function(res){
      if(res.status === 404) return; // already gone — fine, nothing left to clean up
      return res.json().then(function(json){
        if(!res.ok) throw new Error(describeStatus(res, json));
      });
    });
  }

  /* ---------------- status / banner ---------------- */

    if(kind === "connected"){

    } else if(kind === "not_configured"){

      pill.setAttribute("data-state", "warn");

      syncBtn.disabled = true;
    } else {
      pill.setAttribute("data-state", "error");
      text.textContent = "Sync error";
      syncBtn.disabled = false;
      if(detail) showBanner(detail, "danger");
    }
  }

  /* ---------------- save indicator ---------------- */
  var saveIndicatorTimer = null;
  function setSaveIndicator(kind){
    var el = document.getElementById("save-indicator");
    var textEl = document.getElementById("save-indicator-text");
    var dot = el.querySelector(".status-dot");
    el.classList.add("show");
    if(saveIndicatorTimer){ clearTimeout(saveIndicatorTimer); saveIndicatorTimer = null; }
    if(kind === "pending" || kind === "saving"){
      textEl.textContent = "Saving…"; dot.style.background = "var(--muted)";
    } else if(kind === "saved"){
      textEl.textContent = "Saved to GitHub"; dot.style.background = "var(--accent-2)";
      saveIndicatorTimer = setTimeout(function(){ el.classList.remove("show"); }, 1800);
    } else if(kind === "error"){
      textEl.textContent = "Couldn't save — see banner"; dot.style.background = "var(--danger)";
    } else if(kind === "offline"){
      textEl.textContent = "Not connected — changes stay in this tab only"; dot.style.background = "var(--danger)";
      saveIndicatorTimer = setTimeout(function(){ el.classList.remove("show"); }, 3000);
    }
  }

  /* ---------------- load / save ---------------- */
  function loadFromGithub(){
    if(!config) { state = state || defaultState(); render(); return Promise.resolve(); }
    setStatus("syncing");
    return ghGet(config).then(function(res){
      lastFetchAt = Date.now();
      sha = res.sha;
      state = normalizeState(res.data || defaultState());
      setStatus("connected");
      render();
    }).catch(function(err){
      state = state || defaultState();
      setStatus("error", err.message || "Couldn't load from GitHub.");
      render();
    });
  }

  function scheduleSave(){
    if(!config){ setSaveIndicator("offline"); return; }
    pendingSave = true;
    setSaveIndicator("pending");
    if(saveTimer) clearTimeout(saveTimer);
    if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; }
    saveTimer = setTimeout(doSave, 1100);
  }

  function doSave(opts){
    if(saveTimer){ clearTimeout(saveTimer); saveTimer = null; }
    if(saveRetryTimer){ clearTimeout(saveRetryTimer); saveRetryTimer = null; }
    if(!config){ pendingSave = false; setSaveIndicator("offline"); return Promise.resolve(); }
    state.updatedAt = new Date().toISOString();
    setSaveIndicator("saving");
    return ghPut(config, state, sha, opts).then(function(newSha){
      sha = newSha; pendingSave = false; setSaveIndicator("saved");
      if(connectionStatus !== "connected") setStatus("connected");
    }).catch(function(err){
      if(err && err.code === "conflict"){
        // The remote copy moved out from under us — there's no local sha to reconcile against,
        // so the change really is lost. Clear pendingSave (nothing left worth retrying against
        // a stale base) and pull the latest version in, same as before.
        pendingSave = false;
        showBanner("This file changed on GitHub since you last loaded it (probably from another device). Reloading the latest version — your last change wasn't saved, redo it if needed.", "danger");
        loadFromGithub();
        return;
      }
      // Any other failure (offline, rate limit, timeout, auth hiccup) is likely transient —
      // deliberately leave pendingSave true rather than clearing it. That keeps the change
      // flagged as unsaved (so the focus-refetch below won't silently overwrite it with the
      // stale remote copy) and lets us retry automatically instead of relying on the user to
      // notice the banner and click "sync now" themselves.
      setSaveIndicator("error");
      showBanner(err.message || "Couldn't save to GitHub.", "danger");
      setStatus("error");
      saveRetryTimer = setTimeout(function(){ if(pendingSave) doSave(); }, 8000);
    });
  }

  document.getElementById("sync-now-btn").addEventListener("click", function(){
    if(pendingSave){ doSave(); } else { loadFromGithub(); }
    if(gcalStatus === "connected") reconcileFromCalendar();
  });

  // Alt-tabbing away mid-edit and back is exactly the case the plain !pendingSave check above
  // misses: the field never blurred (so 'change' never fired, so pendingSave never became
  // true), but the user is still actively in the middle of typing. Reloading from GitHub at
  // that moment would tear down and rebuild the whole list, wiping out whatever they'd typed
  // but hadn't committed yet — this is the "resets in the middle of writing a task" bug.
  function isActivelyEditing(){
    var el = document.activeElement;
    if(!el || el === document.body) return false;
    var tag = el.tagName;
    if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return true;
    return !!el.isContentEditable;
  }
  window.addEventListener("focus", function(){
    if(config && !pendingSave && !isActivelyEditing() && Date.now() - lastFetchAt >= 15000) loadFromGithub();
    if(gcalStatus === "connected" && !isActivelyEditing() && Date.now() - lastGcalFetchAt >= 60000) reconcileFromCalendar();
  });

  /* ---------------- flush-on-exit ----------------
     scheduleSave() debounces by ~1.1s so a burst of edits doesn't hammer the API — but that
     window is exactly where a change could vanish if the tab is closed, refreshed, or
     navigated away from before the timer fires. Three handlers close that gap:
       - visibilitychange (hidden) / pagehide: as soon as the page is about to go away, if a
         change hasn't been saved yet, fire the save immediately with `keepalive: true` so the
         request has a real chance of completing after the page itself has unloaded.
       - beforeunload: if a save is still outstanding at that point (the flush above hasn't
         resolved, or failed), show the browser's native "leave site?" prompt so a refresh or
         tab close isn't the last thing standing between the user and losing that edit. */
  var flushInFlight = false;
  function flushPendingSave(){
    if(!config || !pendingSave || flushInFlight) return;
    flushInFlight = true;
    doSave({ keepalive: true }).then(function(){ flushInFlight = false; }, function(){ flushInFlight = false; });
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "hidden") flushPendingSave();
  });
  window.addEventListener("pagehide", flushPendingSave);
  window.addEventListener("beforeunload", function(e){
    if(pendingSave){
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  });

  /* ---------------- GitHub settings modal ---------------- */
  // Downloads the current in-memory state as a dated .json file — entirely client-side,
  // no server round-trip, works whether or not a GitHub repo is connected.
  function exportBackup(){
    if(!state) return;
    var now = new Date();
    var fname = "daybook-backup-" + now.getFullYear() + "-" + pad2(now.getMonth()+1) + "-" + pad2(now.getDate()) + ".json";
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }
