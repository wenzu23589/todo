name: Sync external calendars

on:
  schedule:
    # Every 30 minutes. GitHub may delay this somewhat under load — it's a
    # best-effort background refresh, not a live feed.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/ics-feeds.json"

permissions:
  contents: write

concurrency:
  group: sync-ics
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install node-ical@0.18.0 --no-save --no-audit --no-fund

      - name: Fetch and expand iCal feeds
        run: node scripts/sync-ics.js data/ics-feeds.json data/ics-events.json

      - name: Commit updated events if changed
        run: |
          if git diff --quiet -- data/ics-events.json; then
            echo "No change in data/ics-events.json"
            exit 0
          fi
          git config user.name "daybook-ics-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/ics-events.json
          git commit -m "Sync external calendars"
          git push
